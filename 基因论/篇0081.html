<blockquote height="1em" width="2em" align="justify">appendix</blockquote>
<blockquote height="1em" width="2em" align="justify">1933年，摩尔根被授予诺贝尔生理学或医学奖。除此以外，他还获得了其他许多科学荣誉，其中包括伦敦皇家学会授予的达尔文奖章（1924年）和开普勒奖章（1939年）。摩尔根在染色体遗传理论方面取得了重大成果，促使遗传学很快有了飞跃的发展，并为现代的新兴科学——基因工程奠定了基础。</blockquote>
