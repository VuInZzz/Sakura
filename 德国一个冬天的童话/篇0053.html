<p class="title1">给一个政治诗人</p>
<p class="date">德国，一个冬天的童话 · 海涅</p>
<br>
<div class="content"><p class="center">你歌唱，像当年的第泰斯<a id="w22"></a>
 <a href="text00010.html#m22">
<sup>[22]</sup>
</a>
 ，</p>
<p class="center">满怀里是英雄气概；</p>
<p class="center">但是你却选错了，</p>
<p class="center">你的听众和你的时代。</p>
<p class="center">他们诚然满意地倾听，</p>
<p class="center">感到兴奋，还不住赞美：</p>
<p class="center">你多么能掌握形式，</p>
<p class="center">你的思想是多么高贵。</p>
<p class="center">他们也常常举起酒杯，</p>
<p class="center">给你祝贺健康，</p>
<p class="center">并且大声呼啸，</p>
<p class="center">把你的一些战歌歌唱。</p>
<p class="center">奴仆喜欢唱一首自由歌，</p>
<p class="center">晚间坐在酒馆内：</p>
<p class="center">这能够助长消化力，</p>
<p class="center">也给饮料添些香味。</p>
<p class="right">1843</p>
</div>
