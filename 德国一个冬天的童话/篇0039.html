<p class="title1">世界和人生太不完整……</p>
<p class="date">德国，一个冬天的童话 · 海涅</p>
<br>
<div class="content"><p class="center">世界和人生太不完整——</p>
<p class="center">我要向德国的教授请教。</p>
<p class="center">他会把人生拼凑在一起，</p>
<p class="center">做出一个可以理解的系统；</p>
<p class="center">用他的睡帽和他的烂睡衣</p>
<p class="center">堵住这世界大厦上的窟窿。</p>
</div>
