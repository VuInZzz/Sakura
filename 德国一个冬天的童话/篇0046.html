<p class="title1">天是这样黯淡、平凡……</p>
<p class="date">德国，一个冬天的童话 · 海涅</p>
<br>
<div class="content"><p class="center">天是这样黯淡、平凡！</p>
<p class="center">这座城还是这座城<a id="w7"></a>
 <a href="text00010.html#m7">
<sup>[7]</sup>
</a>
 ！</p>
<p class="center">它总是这样愚蠢可怜地</p>
<p class="center">在易北河投下倒影。</p>
<p class="center">长鼻子，还是无聊地</p>
<p class="center">擦鼻涕，和往日一般，</p>
<p class="center">不是伪善的卑躬屈节，</p>
<p class="center">就是妄自尊大的傲慢。</p>
<p class="center">美丽的南方！我多么尊敬</p>
<p class="center">你的神和你的天，</p>
<p class="center">自从我和这堆人垃圾，</p>
<p class="center">和这样的天气又见了面。</p>
</div>
