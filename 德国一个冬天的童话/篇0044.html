<p class="title1">你写的那封信……</p>
<p class="date">德国，一个冬天的童话 · 海涅</p>
<br>
<div class="content"><p class="center">你写的那封信，</p>
<p class="center">并不能使我悲伤；</p>
<p class="center">你说你不再爱我，</p>
<p class="center">你的信却是这样长。</p>
<p class="center">好一篇小的手稿！</p>
<p class="center">十二页，层层密密！</p>
<p class="center">人们真是要分开，</p>
<p class="center">不会写得这样详细。</p>
</div>
