<p class="title1">给独创者</p>
<p class="date">德国，一个冬天的童话 · 歌德</p>
<br>
<div class="content"><p class="center">有个人说：“我不属于任何流派！</p>
<p class="center">没有大师值得我跟他竞赛；</p>
<p class="center">这也是风马牛不相及，</p>
<p class="center">从死人那里学过什么东西。”——</p>
<p class="center">如果我真正了解他，这就是说：</p>
<p class="center">我是自己亲手制造的一个蠢货。</p>
</div>
