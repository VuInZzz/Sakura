<p class="title1">给运命女神</p>
<p class="date">德国，一个冬天的童话 · 荷尔德林</p>
<br>
<div class="content"><p class="center">只给我“一个”夏，你们掌权的神！</p>
<p class="center">还有一个秋为了成熟的歌曲，</p>
<p class="center">　　使我的心，饱尝了甜美的</p>
<p class="center">　　游戏，随后更情愿地死亡。</p>
<p class="center">灵魂，在人世不得享受过他的</p>
<p class="center">神权，在下边冥土里也不安宁；</p>
<p class="center">　　可是我若有一天完成了</p>
<p class="center">　　那悬在我心上的圣业，诗，</p>
<p class="center">我就欢迎，啊，那阴世的安静！</p>
<p class="center">纵使我的弦琴不陪伴我下去，</p>
<p class="center">　　我也满足；我“一次”曾生活</p>
<p class="center">　　像群神，我再也没有需求。</p>
</div>
