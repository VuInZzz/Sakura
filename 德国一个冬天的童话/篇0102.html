<p class="title1">奥尔弗斯</p>
<p class="date">德国，一个冬天的童话 · 里尔克</p>
<br>
<div class="content">奥尔弗斯<a id="w2"></a>
 <a href="text00013.html#m2">
<sup>[2]</sup>
</a>
</h2>
<p class="center">只有谁在阴影内</p>
<p class="center">也曾奏起琴声，</p>
<p class="center">他才能以感应</p>
<p class="center">传送无穷的赞美。</p>
<p class="center">只有谁曾伴着死者</p>
<p class="center">尝过他们的罂粟，</p>
<p class="center">那最微妙的音素</p>
<p class="center">他再也不会失落。</p>
<p class="center">倒影在池塘里</p>
<p class="center">也许常模糊不清：</p>
<p class="center">记住这形象。</p>
<p class="center">在阴阳交错的境域</p>
<p class="center">有些声音才能</p>
<p class="center">永久而和畅。</p>
<p class="right">1922年 米索</p>
