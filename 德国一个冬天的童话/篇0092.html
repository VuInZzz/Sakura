<p class="title1">在西司马利亚</p>
<p class="date">德国，一个冬天的童话 · 尼采</p>
<br>
<div class="content">在西司马利亚<a id="w1"></a>
 <a href="text00011.html#m1">
<sup>[1]</sup>
</a>
</h2>
<p class="center">我坐在这里等着，等着——却无所等候，</p>
<p class="center">在善与恶的彼岸，我时而享受</p>
<p class="center">光，时而享受影，都只是游戏，</p>
<p class="center">整个是海，是中午，整个的时间无目的。</p>
<p class="center">女友，忽然间一身化为两个——</p>
<p class="center">——苏鲁支<a id="w2"></a>
 <a href="text00011.html#m2">
<sup>[2]</sup>
</a>
 从我的身边走过。</p>
</div>
