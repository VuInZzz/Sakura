<p class="title1">谁解相思渴……</p>
<p class="date">德国，一个冬天的童话 · 歌德</p>
<br>
<div class="content">谁解相思渴……<a id="w9"></a>
 <a href="text00008.html#m9">
<sup>[9]</sup>
</a>
</h2>
<p class="center">谁解相思渴，</p>
<p class="center">谁知我心伤！</p>
<p class="center">远离众欢乐，</p>
<p class="center">孤单何苍凉。</p>
<p class="center">举首天寥廓，</p>
<p class="center">极目向彼方。</p>
<p class="center">爱我识我者，</p>
<p class="center">噫嘻在远乡。</p>
<p class="center">我神多眩惑，</p>
<p class="center">焦灼我心肠。</p>
<p class="center">谁解相思渴，</p>
<p class="center">谁知我心伤！</p>
</div>
