<p class="title1">警告</p>
<p class="date">德国，一个冬天的童话 · 海涅</p>
<br>
<div class="content"><p class="center">忠实的朋友，你算完蛋啦！</p>
<p class="center">你竟让这样的书籍印行！</p>
<p class="center">你若要名誉和金钱，</p>
<p class="center">就必须俯首听命。</p>
<p class="center">我从来没有向你劝告过，</p>
<p class="center">在人民面前这样讲说，</p>
<p class="center">这样讲说那些牧师，</p>
<p class="center">这样讲说最高的统治者！</p>
<p class="center">忠实的朋友，你算完蛋啦！</p>
<p class="center">公侯们有长胳膊，</p>
<p class="center">牧师们有长舌头，</p>
<p class="center">可是人民有长耳朵！</p>
<p class="right">1829</p>
</div>
