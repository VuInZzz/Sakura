<p class="title1">水的颂歌</p>
<p class="date">德国，一个冬天的童话 · 歌德</p>
<br>
<div class="content">水的颂歌<a id="w15"></a>
 <a href="text00008.html#m15">
<sup>[15]</sup>
</a>
</h2>
<p class="center">一切都从水里产生！</p>
<p class="center">一切都被水保持！</p>
<p class="center">海洋，给我们你永恒的统治。</p>
<p class="center">如果你不遣送云霓，</p>
<p class="center">不施舍丰富的清溪，</p>
<p class="center">不让河水流来流去，</p>
<p class="center">不完成滔滔的江水，</p>
<p class="center">哪里会有山岳、平原、世界？</p>
<p class="center">是你保持那最清新的生机。</p>
</div>
