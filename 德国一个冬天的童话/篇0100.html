<p class="title1">总是一再地……</p>
<p class="date">德国，一个冬天的童话 · 里尔克</p>
<br>
<div class="content"><p class="center">总是一再地，虽然我们认识爱的风景，</p>
<p class="center">认识教堂小墓场刻着它哀悼的名姓</p>
<p class="center">还有山谷尽头沉默可怕的峡谷；</p>
<p class="center">我们总是一再地两个人走出去</p>
<p class="center">走到古老的树下，我们总是一再地</p>
<p class="center">仰对着天空，卧在花丛里。</p>
<p class="right">1914年</p>
</div>
