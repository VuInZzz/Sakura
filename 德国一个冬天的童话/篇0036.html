<p class="title1">这是一个坏天气……</p>
<p class="date">德国，一个冬天的童话 · 海涅</p>
<br>
<div class="content"><p class="center">这是一个坏天气，</p>
<p class="center">下雨刮风又飘雪；</p>
<p class="center">我坐在窗边向外望，</p>
<p class="center">望着外边的黑夜。</p>
<p class="center">一粒寂寞的微光闪闪，</p>
<p class="center">它慢慢地向前摇摆；</p>
<p class="center">是一个妈妈提着小灯</p>
<p class="center">在那里晃过大街。</p>
<p class="center">我相信，她购买了</p>
<p class="center">鸡蛋、黄油和面粉；</p>
<p class="center">她要给她的大女孩</p>
<p class="center">烤一块蛋糕点心。</p>
<p class="center">女孩在家里倒在靠椅上，</p>
<p class="center">睡眼矇眬地看着灯光；</p>
<p class="center">金黄的卷发波浪一般</p>
<p class="center">拍打着甜美的面庞。</p>
</div>
