<p class="title1">颂歌</p>
<p class="date">德国，一个冬天的童话 · 海涅</p>
<br>
<div class="content">颂歌<a id="w57"></a>
 <a href="text00010.html#m57">
<sup>[57]</sup>
</a>
</h2>
<p class="center">我是剑，我是火焰。</p>
<p class="center">黑暗里我照耀着你们，</p>
<p class="center">战斗开始时，</p>
<p class="center">我奋勇当先</p>
<p class="center">走在队伍的最前列。</p>
<p class="center">我周围倒着</p>
<p class="center">我的战友的尸体，</p>
<p class="center">可是我们得到了胜利。</p>
<p class="center">我们得到了胜利，</p>
<p class="center">可是周围倒着</p>
<p class="center">我的战友的尸体。</p>
<p class="center">在欢呼胜利的凯歌里</p>
<p class="center">响着追悼会严肃的歌声。</p>
<p class="center">但我们没有时间欢乐，</p>
<p class="center">也没有时间哀悼。</p>
<p class="center">喇叭重新吹起，</p>
<p class="center">又开始新的战斗。</p>
<p class="center">我是剑，我是火焰。</p>
<p class="right">1830</p>
