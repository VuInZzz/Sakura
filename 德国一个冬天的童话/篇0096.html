<p class="title1">秋日</p>
<p class="date">德国，一个冬天的童话 · 里尔克</p>
<br>
<div class="content"><p class="center">主啊，是时候了。夏日曾经很盛大。</p>
<p class="center">把你的阴影落在日规上，</p>
<p class="center">让秋风刮过田野。</p>
<p class="center">让最后的果实长得丰满，</p>
<p class="center">再给它们两天南方的气候，</p>
<p class="center">迫使它们成熟，</p>
<p class="center">把最后的甘甜酿入浓酒。</p>
<p class="center">谁这时没有房屋，就不必建筑，</p>
<p class="center">谁这时孤独，就永远孤独，</p>
<p class="center">就醒着，读着，写着长信，</p>
<p class="center">在林荫道上来回</p>
<p class="center">不安地游荡，当着落叶纷飞。</p>
<p class="right">1902年 巴黎</p>
</div>
