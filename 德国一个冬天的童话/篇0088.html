<p class="title1">旅人</p>
<p class="date">德国，一个冬天的童话 · 尼采</p>
<br>
<div class="content"><p class="center">“再也没有路！四围是深渊，死的寂静！”</p>
<p class="center">你志愿如此！你的意志躲避路径，</p>
<p class="center">旅人，如今是这样，要看得冷静，明显！</p>
<p class="center">你是遗失的人，你可信托——危险？</p>
</div>
