<p class="title1">等着吧</p>
<p class="date">德国，一个冬天的童话 · 海涅</p>
<br>
<div class="content"><p class="center">因为我的闪电是这样出色，</p>
<p class="center">你们就以为，我不能雷鸣！</p>
<p class="center">你们搞错了，因为我同样</p>
<p class="center">有一种打雷的本领。</p>
<p class="center">一旦那正当的日子来到，</p>
<p class="center">这本领就恐怖地得到证明；</p>
<p class="center">你们将要听到我的声音，</p>
<p class="center">是长空霹雳，风雨雷霆。</p>
<p class="center">暴风雨将要在那一天</p>
<p class="center">甚至把一些檞树吹倒，</p>
<p class="center">一些教堂的高塔要倒塌，</p>
<p class="center">一些宫殿也将要动摇！</p>
<p class="right">1844</p>
</div>
