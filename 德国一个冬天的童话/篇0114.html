<p class="title1">焚书</p>
<p class="date">德国，一个冬天的童话 · 布莱希特</p>
<br>
<div class="content"><p class="center">政权命令，把有害知识的书</p>
<p class="center">公开焚烧，到处赶着牛</p>
<p class="center">拉着满载书籍的车</p>
<p class="center">到柴火堆上，一个被驱逐的诗人，</p>
<p class="center">最优秀的一个，端详焚书的书单，</p>
<p class="center">他惊讶地发现，他的书</p>
<p class="center">没列在里边。他愤愤不平</p>
<p class="center">跑到书桌旁，给当权者写一封信。</p>
<p class="center">烧掉我！他飞笔直书，烧掉我！</p>
<p class="center">不要这样对待我！不要剩下我！</p>
<p class="center">我不是总在我的书里报道真理吗？可是现在</p>
<p class="center">我被你们看待像个说谎者！</p>
<p class="center">我命令你们：烧掉我！</p>
</div>
