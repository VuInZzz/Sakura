<p class="title1">纵使这世界转变……</p>
<p class="date">德国，一个冬天的童话 · 里尔克</p>
<br>
<div class="content"><p class="center">纵使这世界转变</p>
<p class="center">云体一般地迅速，</p>
<p class="center">一切完成的事件</p>
<p class="center">归根都回到太古。</p>
<p class="center">超乎转变和前进之上，</p>
<p class="center">你歌曲前的歌音</p>
<p class="center">更广阔更自由地飘扬，</p>
<p class="center">神弹他的琴。</p>
<p class="center">苦难没有认清，</p>
<p class="center">爱也没有学成，</p>
<p class="center">远远在死乡的事物</p>
<p class="center">没有揭开了面幕。</p>
<p class="center">唯有大地上的歌声</p>
<p class="center">在颂扬，在庆祝。</p>
<p class="right">1922年 米索</p>
</div>
