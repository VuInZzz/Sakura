<p class="title1">啊，诗人，你说，你做什么……</p>
<p class="date">德国，一个冬天的童话 · 里尔克</p>
<br>
<div class="content"><p class="center">啊，诗人，你说，你做什么？——我赞美。</p>
<p class="center">但是那死亡和奇诡</p>
<p class="center">你怎样担当，怎样承受？——我赞美。</p>
<p class="center">但是那无名的、失名的事物，</p>
<p class="center">诗人，你到底怎样呼唤？——我赞美。</p>
<p class="center">你何处得的权力，在每样衣冠内，</p>
<p class="center">在每个面具下都是真实？——我赞美。</p>
<p class="center">怎么狂暴和寂静都像风雷</p>
<p class="center">与星光似的认识你？——因为我赞美。</p>
<p class="right">1921年 米索</p>
</div>
