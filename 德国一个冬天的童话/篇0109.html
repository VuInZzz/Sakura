<p class="title1">我的哥哥是个飞行员</p>
<p class="date">德国，一个冬天的童话 · 布莱希特</p>
<br>
<div class="content"><p class="center">我的哥哥是个飞行员，</p>
<p class="center">一天他得到了票一张，</p>
<p class="center">他装好了他的箱笼，</p>
<p class="center">上了长途，向着南方。</p>
<p class="center">我的哥哥是征服者，</p>
<p class="center">我们的民族缺少地方，</p>
<p class="center">我们要弄到土地，</p>
<p class="center">是我们长久的梦想。</p>
<p class="center">我哥哥征服的地方</p>
<p class="center">位在瓜答拉马群山<a id="w6"></a>
 <a href="text00014.html#m6">
<sup>[6]</sup>
</a>
 ，</p>
<p class="center">它有一米八寸长，</p>
<p class="center">它的深度是一米半。</p>
</div>
