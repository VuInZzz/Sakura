<p class="title1">谦恭</p>
<p class="date">德国，一个冬天的童话 · 歌德</p>
<br>
<div class="content">谦恭<a id="w14"></a>
 <a href="text00008.html#m14">
<sup>[14]</sup>
</a>
</h2>
<p class="center">我观看大师们的创作，</p>
<p class="center">我就看到，他们做了些什么；</p>
<p class="center">我察看我的身边用具，</p>
<p class="center">就看到，我本来该做些什么。</p>
</div>
