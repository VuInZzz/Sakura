<p class="title1">守望者之歌</p>
<p class="date">德国，一个冬天的童话 · 歌德</p>
<br>
<div class="content">守望者之歌<a id="w16"></a>
 <a href="text00008.html#m16">
<sup>[16]</sup>
</a>
</h2>
<p class="center">为观看而降生，</p>
<p class="center">为瞭望而工作，</p>
<p class="center">我置身于望楼，</p>
<p class="center">为宇宙而欢乐。</p>
<p class="center">我眺望远方，</p>
<p class="center">我俯视近处，</p>
<p class="center">望月亮和星辰，</p>
<p class="center">视树林和麋鹿。</p>
<p class="center">我在宇宙万象中</p>
<p class="center">看见永恒的装饰，</p>
<p class="center">正如我喜爱它们，</p>
<p class="center">我也喜爱自己。</p>
<p class="center">你们幸福的眼睛，</p>
<p class="center">你们目光所及，</p>
<p class="center">不论是些什么，</p>
<p class="center">都是这样美丽！</p>
</div>
