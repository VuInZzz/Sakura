<p class="title1">我要潜步走到家家门旁……</p>
<p class="date">德国，一个冬天的童话 · 歌德</p>
<br>
<div class="content">我要潜步走到家家门旁……<a id="w11"></a>
 <a href="text00008.html#m11">
<sup>[11]</sup>
</a>
</h2>
<p class="center">我要潜步走到家家门旁，</p>
<p class="center">我站立着，规矩而静寂，</p>
<p class="center">慈悲的手将要递给食粮，</p>
<p class="center">并且我将要往下走去。</p>
<p class="center">每个人都将要显得幸福，</p>
<p class="center">若是我在他的面前站立；</p>
<p class="center">他将要落下来一滴泪珠，</p>
<p class="center">我不知道他为什么哭泣。</p>
</div>
