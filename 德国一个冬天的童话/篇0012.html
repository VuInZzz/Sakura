<p class="title1">谁不曾和泪吃他的面包……</p>
<p class="date">德国，一个冬天的童话 · 歌德</p>
<br>
<div class="content">谁不曾和泪吃他的面包……<a id="w6"></a>
 <a href="text00008.html#m6">
<sup>[6]</sup>
</a>
</h2>
<p class="center">谁不曾和泪吃他的面包，</p>
<p class="center">谁不曾坐在他的床上哭泣，</p>
<p class="center">度过些苦恼重重的深宵，</p>
<p class="center">就不会认识你们苍天的威力。</p>
<p class="center">你们引导我们走入人间，</p>
<p class="center">你们让可怜的人罪孽深造，</p>
<p class="center">随即把他交给痛苦熬煎；</p>
<p class="center">因为一切罪孽都在现世轮报。</p>
</div>
