<p class="title1">豹</p>
<p class="date">德国，一个冬天的童话 · 里尔克</p>
<br>
<div class="content"><p class="center">——在巴黎植物园</p>
<p class="center">它的目光被那走不完的铁栏</p>
<p class="center">缠得这般疲倦，什么也不能收留。</p>
<p class="center">它好像只有千条的铁栏杆，</p>
<p class="center">千条的铁栏后便没有宇宙。</p>
<p class="center">强韧的脚步迈着柔软的步容，</p>
<p class="center">步容在这极小的圈中旋转，</p>
<p class="center">仿佛力之舞围绕着一个中心，</p>
<p class="center">在中心一个伟大的意志昏眩。</p>
<p class="center">只有时眼帘无声地撩起——</p>
<p class="center">于是有一幅图像浸入，</p>
<p class="center">通过四肢紧张的静寂——</p>
<p class="center">在心中化为乌有。</p>
<p class="right">1903年</p>
</div>
