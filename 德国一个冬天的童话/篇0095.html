<p class="title1">村里这个痴童会三支歌曲……</p>
<p class="date">德国，一个冬天的童话 · 格奥尔格</p>
<br>
<div class="content"><p class="center">村里这个痴童会三支歌曲，</p>
<p class="center">他若来了歌声就不断轮环：</p>
<p class="center">一支曲像坟里祖先的气息；</p>
<p class="center">他们在生前已经委身于神坛。</p>
<p class="center">另一支曲含有贞洁的奉献，</p>
<p class="center">好像是纺车旁的姊妹歌唱</p>
<p class="center">还是女孩子们在许多年前</p>
<p class="center">形成长的行列在晚间的街上。</p>
<p class="center">第三支曲在威胁——罪孽和仇恨——</p>
<p class="center">用天蓝色剑鞘里的短剑，</p>
<p class="center">用些血族里传留下的苦难，</p>
<p class="center">用笼罩一些房顶的邪恶星辰。</p>
</div>
