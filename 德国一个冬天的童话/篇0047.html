<p class="title1">当我向着旁人的……</p>
<p class="date">德国，一个冬天的童话 · 海涅</p>
<br>
<div class="content"><p class="center">当我向着旁人的、</p>
<p class="center">旁人的宝贝窥探，</p>
<p class="center">焦灼地走来走去</p>
<p class="center">在生疏的爱的门前；</p>
<p class="center">旁人们也许正在</p>
<p class="center">另外的地方逡巡，</p>
<p class="center">在我自己的窗前</p>
<p class="center">把我的宝贝勾引。</p>
<p class="center">人就是这样！天上的神</p>
<p class="center">保佑我们一切的道路！</p>
<p class="center">天上的神给我们大家，</p>
<p class="center">给大家幸福和祝福！</p>
</div>
