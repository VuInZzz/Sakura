<p class="title1">谁有一颗心……</p>
<p class="date">德国，一个冬天的童话 · 海涅</p>
<br>
<div class="content"><p class="center">谁有一颗心，心里有着爱，</p>
<p class="center">就被人弄得半死不活，</p>
<p class="center">我如今躺在这里，</p>
<p class="center">被人堵住口，绑着绳索——</p>
<p class="center">一旦我死了，舌头也会</p>
<p class="center">被人从尸体上割掉；</p>
<p class="center">因为他们怕我说说讲讲</p>
<p class="center">又走出地府阴曹。</p>
<p class="center">死者在墓穴里边，</p>
<p class="center">将要无声无息地腐朽，</p>
<p class="center">对我施展的可笑的罪行，</p>
<p class="center">我永久不会泄露。</p>
</div>
