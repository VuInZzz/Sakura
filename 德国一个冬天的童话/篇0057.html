<p class="title1">给赫尔威</p>
<p class="date">德国，一个冬天的童话 · 海涅</p>
<br>
<div class="content">给赫尔威<a id="w34"></a>
 <a href="text00010.html#m34">
<sup>[34]</sup>
</a>
</h2>
<p class="center">赫尔威，你这铁云雀，</p>
<p class="center">你欢叫着高高飞起，</p>
<p class="center">向着圣洁的阳光！</p>
<p class="center">冬天是否真正消逝？</p>
<p class="center">德国是否真正春花怒放？</p>
<p class="center">赫尔威，你这铁云雀，</p>
<p class="center">因为你飞入高空，</p>
<p class="center">你眼里就看不见</p>
<p class="center">地上事物——只在你的诗中</p>
<p class="center">存在着你歌唱的春天。</p>
<p class="right">1841</p>
