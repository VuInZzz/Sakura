<p class="title1">星星们动也不动……</p>
<p class="date">德国，一个冬天的童话 · 海涅</p>
<br>
<div class="content">星星们动也不动……<a id="w1"></a>
 <a href="text00010.html#m1">
<sup>[1]</sup>
</a>
</h2>
<p class="center">星星们动也不动，</p>
<p class="center">高高地悬在天空，</p>
<p class="center">千万年彼此相望，</p>
<p class="center">怀着爱情的苦痛。</p>
<p class="center">它们说着一种语言，</p>
<p class="center">这样丰富，这样美丽；</p>
<p class="center">却没有一个语言学家</p>
<p class="center">能明白这种言语。</p>
<p class="center">但是我学会了它，</p>
<p class="center">我永久不会遗忘；</p>
<p class="center">而我使用的语法</p>
<p class="center">是我爱人的面庞。</p>
