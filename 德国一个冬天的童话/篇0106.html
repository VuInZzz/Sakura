<p class="title1">题一个中国的茶树根狮子</p>
<p class="date">德国，一个冬天的童话 · 布莱希特</p>
<br>
<div class="content"><p class="center">坏人惧怕你的利爪。</p>
<p class="center">好人喜欢你的优美。</p>
<p class="center">我愿意听人</p>
<p class="center">这样</p>
<p class="center">谈我的诗。</p>
</div>
