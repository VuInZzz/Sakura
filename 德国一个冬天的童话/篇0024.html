<p class="title1">神秘的合唱</p>
<p class="date">德国，一个冬天的童话 · 歌德</p>
<br>
<div class="content">神秘的合唱<a id="w17"></a>
 <a href="text00008.html#m17">
<sup>[17]</sup>
</a>
</h2>
<p class="center">一切无常的</p>
<p class="center">只是一个比喻；</p>
<p class="center">不能企及的</p>
<p class="center">这里成为事迹；</p>
<p class="center">不能描述的</p>
<p class="center">这里已经完成；</p>
<p class="center">引渡我们的</p>
<p class="center">是永恒的女性。</p>
</div>
