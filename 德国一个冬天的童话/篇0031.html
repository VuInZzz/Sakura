<p class="title1">一个青年爱一个姑娘……</p>
<p class="date">德国，一个冬天的童话 · 海涅</p>
<br>
<div class="content"><p class="center">一个青年爱一个姑娘，</p>
<p class="center">姑娘却相中另外一个人；</p>
<p class="center">这个人又爱另一个姑娘，</p>
<p class="center">并且和她结了婚。</p>
<p class="center">这个姑娘一时气愤，</p>
<p class="center">嫁给她偶然遇到的</p>
<p class="center">任何的一个男人；</p>
<p class="center">这青年十分苦闷。</p>
<p class="center">这是一个古老的故事，</p>
<p class="center">可是它永久新鲜；</p>
<p class="center">谁正巧碰到这样的事，</p>
<p class="center">他的心就裂成两半。</p>
</div>
