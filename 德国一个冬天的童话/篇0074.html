<p class="title1">世道</p>
<p class="date">德国，一个冬天的童话 · 海涅</p>
<br>
<div class="content"><p class="center">如果有许多财物，</p>
<p class="center">得到的便越来越多。</p>
<p class="center">若只有很少的财物，</p>
<p class="center">很少的财物也被抢夺。</p>
<p class="center">但如果你一无所有，</p>
<p class="center">啊，就让人家埋葬你——</p>
<p class="center">因为只是有些财物的人</p>
<p class="center">才有一个生存的权利。</p>
</div>
