<p class="title1">每逢我在清晨……</p>
<p class="date">德国，一个冬天的童话 · 海涅</p>
<br>
<div class="content"><p class="center">每逢我在清晨</p>
<p class="center">从你的房前走过，</p>
<p class="center">我看见你在窗内，</p>
<p class="center">亲爱的，我就快乐。</p>
<p class="center">你探索着凝视着我，</p>
<p class="center">用你深褐的眼睛：</p>
<p class="center">“你这他乡多病的人，</p>
<p class="center">你是谁，你有什么病？”</p>
<p class="center">“我是一个德国诗人，</p>
<p class="center">在德国的境内闻名；</p>
<p class="center">说出那些最好的名姓，</p>
<p class="center">也就说出我的姓名。</p>
<p class="center">“我跟一些人一样，</p>
<p class="center">在德国感到同样的痛苦；</p>
<p class="center">说出那些最剧烈的苦痛，</p>
<p class="center">也就说出我的痛苦。”</p>
</div>
