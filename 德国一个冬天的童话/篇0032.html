<p class="title1">他们使我苦恼……</p>
<p class="date">德国，一个冬天的童话 · 海涅</p>
<br>
<div class="content"><p class="center">他们使我苦恼，</p>
<p class="center">气得我发青发白，</p>
<p class="center">一些人用他们的恨，</p>
<p class="center">一些人用他们的爱。</p>
<p class="center">给我的面包掺上毒药，</p>
<p class="center">给我的酒杯注入毒鸩，</p>
<p class="center">一些人用他们的爱，</p>
<p class="center">一些人用他们的恨。</p>
<p class="center">可是她，她最使我</p>
<p class="center">苦恼、气愤和悲哀，</p>
<p class="center">她从来对我没有恨，</p>
<p class="center">也从来对我没有爱。</p>
</div>
