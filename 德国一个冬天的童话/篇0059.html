<p class="title1">调换来的怪孩子</p>
<p class="date">德国，一个冬天的童话 · 海涅</p>
<br>
<div class="content">调换来的怪孩子<a id="w37"></a>
 <a href="text00010.html#m37">
<sup>[37]</sup>
</a>
</h2>
<p class="center">一个孩子有个大葫芦头，</p>
<p class="center">浅黄的髭须，苍老的发辫，</p>
<p class="center">蜘蛛般的长臂可是很强健，</p>
<p class="center">有巨大的胃，肠子却又小又短——</p>
<p class="center">这是一个排长<a id="w38"></a>
 <a href="text00010.html#m38">
<sup>[38]</sup>
</a>
 把婴儿偷去，</p>
<p class="center">调换来一个怪孩子，</p>
<p class="center">偷偷地放在我们的摇篮里——</p>
<p class="center">这个畸形儿，也许就是</p>
<p class="center">所多玛的老人<a id="w39"></a>
 <a href="text00010.html#m39">
<sup>[39]</sup>
</a>
 用谎话，</p>
<p class="center">用他喜爱的欺诈造成的——</p>
<p class="center">我不用说出这怪物的名字——</p>
<p class="center">你们都应该把他淹死或烧死！</p>
</div>
