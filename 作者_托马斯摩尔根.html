<p class="title1">托马斯·亨特·摩尔根</p>
<p class="date">简体文字版 · OCR 整理</p>
<br>
<blockquote><font color="#000066">美国遗传学家、胚胎学家，经典遗传学的奠基人（1866—1945）。生于肯塔基州，获约翰斯·霍普金斯大学博士学位，长期任教于哥伦比亚大学与加州理工学院。他以果蝇为实验材料，发现基因的连锁与交换规律，证明基因位于染色体上并呈线性排列，建立了染色体遗传学说，使遗传学成为一门精确的实验科学。1933 年获诺贝尔生理学或医学奖，代表作《基因论》。以下为本站收录的中文著作。</font></blockquote>
