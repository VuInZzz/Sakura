<p class="title1">马克·吐温</p>
<p class="date">简体文字版 · OCR 整理</p>
<br>
<blockquote><font color="#000066">美国作家、幽默大师、现实主义文学的代表人物（1835—1910），原名塞缪尔·兰亨·克莱门斯。生于密苏里州，早年在密西西比河上当过领航员，后从事记者与写作，以《卡拉韦拉斯县驰名的跳蛙》成名。代表作有长篇小说《汤姆·索亚历险记》《哈克贝利·费恩历险记》，中篇《百万英镑》，以及大量短篇与游记。他以口语化的幽默讽刺社会虚伪、种族歧视与拜金主义，被誉为"美国文学中的林肯"，是美国民族文学的奠基者之一。以下为本站收录的中文著作。</font></blockquote>
