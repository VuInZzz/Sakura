<p class="title1">阿尔伯特·爱因斯坦</p>
<p class="date">简体文字版 · OCR 整理</p>
<br>
<blockquote><font color="#000066">出生于德国的犹太裔美国理论物理学家，相对论的创立者，现代物理学的奠基人之一（1879—1955）。生于乌尔姆，求学于苏黎世联邦理工学院，曾在瑞士专利局任职。1905 年发表四篇划时代论文，涉及光电效应、布朗运动、狭义相对论与质能关系；1915 年完成广义相对论，预言光线弯曲与引力波。1933 年因纳粹迫害移居美国并入美国籍，任职于普林斯顿高等研究院。1921 年因解释光电效应获诺贝尔物理学奖。以下为本站收录的中文著作。</font></blockquote>
