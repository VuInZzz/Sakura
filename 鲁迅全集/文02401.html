<p class="title1">350811</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350811<sup>①</sup> 致曹靖华</h3>

<p class="left">汝珍兄：</p>

<p>七日信收到。给西谛信当与此信同时发出。</p>

<p>致青一笺，乞转交。</p>

<p>前给E.信，请他写德文，他竟写了俄文来了，大约他误以为回信是我自己写的。今寄上，乞兄译示为感。</p>

<p>上海已较凉，我们都好的。</p>

<p>专此布达，即请</p>

<p class="left">暑安。</p>

<p class="right"><b>弟</b>豫 上 <b>八月十一日</b></p>

</div>
