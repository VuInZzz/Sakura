<p class="title1">330214 致李小峰</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content"><p class="left">小峰兄：</p>

<p>校稿<sup class="notelink"><a href="#m52">[52]</a></sup>寄上，但须再看一回。上面还有两页，不知何以抽去，须即补排。</p>

<p>前次面谈拟自备纸张印一百部，现在不想印了，并闻。</p>

<p class="right">迅 上 <b>二月十四日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[52] <b>校稿</b> 指《两地书》的校稿。</p>
