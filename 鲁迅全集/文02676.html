<p class="title1">361012</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">361012<sup>②</sup> 致赵家璧</h3>

<p class="left">家璧先生：</p>

<p>靖华所译小说，曾记先生前函，谓须乘暑中排完，但今中秋已过，尚无校稿见示。不知公司是否确已付排，或是否确欲出版，希便中示及为荷。</p>

<p>此布，并请</p>

<p class="left">撰安。</p>

<p class="right">迅 上 <b>十月十二日</b></p>

</div>
