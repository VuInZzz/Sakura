<div class="content">360929<sup>②</sup> 致黄源</h3>

<p class="left">河清先生：</p>

<p>有几篇稿子，想交与孟十还先生，还有一些话。可否请先生莅寓一谈，再为转达，至幸。</p>

<p>专此布达，即请</p>

<p class="left">著安</p>

<p class="right">迅 上 <b>九月廿九日</b></p>
