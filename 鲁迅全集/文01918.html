<p class="title1">331228</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content">331228<sup>①</sup> 致陶亢德</h3>

<p class="left">亢德先生：</p>

<p>附上稿子两种<sup class="notelink"><a href="#m499">[499]</a></sup>，是一个青年托我卖钱的，横览九洲，觉得于《论语》或尚可用，故不揣冒昧，寄上一试。犯忌之处，改亦不妨。但如不要，则务希费 神寄还，因为倘一失去，则文章之价值即增，而我亦将赔不起也。此布即请</p>

<p class="left">著安。</p>

<p class="right">鲁迅 上 <b>十二月廿八夜</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[499] <b>稿子两种</b> 指王志之托鲁迅设法发表的两篇稿子：《幽默年大事记》和《刷浆糊与拍马屁》。</p>
