<p class="title1">340727</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">340727<sup>④</sup> 致罗清桢</h3>

<p class="left">清桢先生：</p>

<p>惠示谨悉。前日因在大风中睡了一觉，遂发大热，不能久坐，一时恐难即愈。</p>

<p>先生归期又如此之促，以致不能招待，真是抱歉得很。诸希谅察为幸。</p>

<p>专此布复，并请</p>

<p class="left">暑安。</p>

<p class="right">迅 上 <b>七月廿七日</b></p>

</div>
