<p class="title1">270207 致李霁野</p>
<p class="date">第12卷 · 一九二七年</p>
<br>
<div class="content"><p class="left">季野兄：</p>

<p>一月十五日来信已到。漱园病已愈否？</p>

<p>《每日评论》<sup class="notelink"><a href="#m28">[28]</a></sup>附赠《莽原》，很像附送“美女月份牌”之类，我以为不合适。有麟<sup class="notelink"><a href="#m29">[29]</a></sup>曾函问我，我亦如此答复他。</p>

<p>兄所需学费，已在厦门汇出，想已到了？</p>

<p class="right">迅 <b>二，七</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[28] <b> 《每日评论》</b> 当时在北京出版的报纸，荆有麟编辑。</p>
<p class="noteitem">[29] <b>有麟</b> 即荆有麟。参看310205信注〔1〕。</p>
</div></div>
