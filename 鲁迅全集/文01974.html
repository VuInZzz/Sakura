<p class="title1">340331</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">340331<sup>②</sup> 致台静农</h3>

<p class="left">静农兄：</p>

<p>日内当寄书<sup class="notelink"><a href="#m150">[150]</a></sup>五本。其一本奉览，余四本希便中转交霁野，维钧，天行，沈观为感。</p>

<p>此布，即颂</p>

<p class="left">时绥。</p>

<p class="right">隼 上 <b>三月卅一日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[150] 指《南腔北调集》。</p>
