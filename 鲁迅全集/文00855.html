<p class="title1">题赠冯蕙熹</p>
<p class="date">第8卷 · 一九三〇年</p>
<br>
<div class="content">题赠冯蕙熹<sup class="notelink"><a href="#m539">[539]</a></sup></h4>

<p class="center">杀人有将，救人为医。</p>

<p class="center">杀了大半，救其孑遗。</p>

<p class="center">小补之哉，乌乎　噫嘻！<sup class="notelink"><a href="#m540">[540]</a></sup></p>

<p class="right">鲁迅</p>

<p class="right">一九三十年九月一日，上海</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[539] 本篇据手迹编入，原无标题。<br/><b>冯蕙熹</b>，广东南海人，许广平的表妹。当时是北平协和医学院学生。</p>
<p class="noteitem">[540] <b>小补之哉</b> 语出《孟子·尽心（上）》：“夫君子所过者化，所存者神，上下与天地同流，岂曰小补之哉！”</p>
