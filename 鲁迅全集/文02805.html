<p class="title1">二</p>
<p class="date">第14卷 · 5 致钱杏邨</p>
<br>
<div class="content"><p>至于书面篆字，实非太炎先生作，而是陈师曾所书，他名衡愙，义宁人，陈三立先生之子，后以画名，今已去世了。</p>
