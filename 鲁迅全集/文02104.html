<p class="title1">340814</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">340814<sup>①</sup> 致郑振铎</h3>

<p class="left">西谛先生：</p>

<p>七日函并取书<sup class="notelink"><a href="#m462">[462]</a></sup>条一张，存根二张，早已收到，惟书尚未到，这是照例要迟一些的。</p>

<p>先生此次南来，希将前回给我代刻的印章携来为祷。</p>

<p>余容面罄，即请</p>

<p class="left">旅安。</p>

<p class="right">隼 顿首 <b>八月十四夜。</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[462] 指《北平笺谱》再版本。</p>
