<p class="title1">340101 致梁以俅</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">340101 致梁以俅<sup class="notelink"><a href="#m1">[1]</a></sup></h3>

<p class="left">以俅先生：</p>

<p>昨晚因有事，迟去了一点，先生已来过，真是抱歉之至。</p>

<p>今日下午往蔡宅<sup class="notelink"><a href="#m2">[2]</a></sup>，和管门人说不清楚，只得废然而返。</p>

<p>如先生尚留沪，希于四日午后两点钟仍至原处书店，我当自二点至三点止，在那里相候。</p>

<p>此上，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 启 <b>一月一日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[1] <b>梁以俅</b>（1906—？） 广东南海人，美术工作者。当时因事自北平去上海时，曾由姚克介绍往访鲁迅。</p>
<p class="noteitem">[2] <b>蔡宅</b> 梁以俅的亲戚家。</p>
