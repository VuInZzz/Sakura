<p class="title1">350602</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350602<sup>②</sup> 致萧军</h3>

<p class="left">刘军兄：</p>

<p>前信早收到。文学社陆续寄来了两篇稿费的单子，今寄上。</p>

<p>金人的稿子，由我寄出了两篇，都不见登出；在手头的还有三篇。《搭客》已登，大约稿费单也快送来了，那时当和金人的译稿一同放在书店里。但那寄出了的两篇，要收回不？望便中通知我。</p>

<p>此布，即请</p>

<p class="left">俪安。</p>

<p class="right">豫 上 <b>六月三[二]夜。</b></p>
