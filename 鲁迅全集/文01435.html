<p class="title1">261113</p>
<p class="date">第11卷 · 一九二六年</p>
<br>
<div class="content">261113<sup>②</sup> 致李小峰<sup class="notelink"><a href="#m660">[660]</a></sup></h4>

<p class="left">小峰兄：</p>

<p>有一篇《坟》的跋，不知《语丝》要一印否？如要，请即发表。排后并请将原稿交还漱园兄，并嘱手民<sup class="notelink"><a href="#m661">[661]</a></sup>，勿将原稿弄脏。</p>

<p class="right">迅 十一，十三</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[660] <b>李小峰</b>（1897—1971） 江苏江阴人。北京大学哲学系毕业，新潮社和语丝社成员，北新书局主持人。</p>
<p class="noteitem">[661] <b>手民</b> 排字工人。</p>
