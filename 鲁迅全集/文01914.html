<p class="title1">331226</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content">331226<sup>①</sup> 致李小峰</h3>

<p class="left">小峰兄：</p>

<p>这是一个不相识者<sup class="notelink"><a href="#m492">[492]</a></sup>寄来的，因为来路远，故为介绍，不知北新刊物上，有发表的地方否？倘发表，就请将刊物给我一本，以便转寄。否则，<span class="u">务乞寄还原稿</span>，因为倘一失少，我就不得了了。</p>

<p class="right">迅 上 <b>十二月廿六日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[492] <b>不相识者</b> 指王熙之。</p>
