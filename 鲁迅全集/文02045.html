<p class="title1">340606</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">340606<sup>②</sup> 致黎烈文</h3>

<p class="left">烈文先生：</p>

<p>我们想谈谈闲天，本星期六（九日）午后五点半以后，六点以前之间，请 先生到棋盘街商务印书馆编辑处（即在发行所的楼上）找周建人，同他惠临敝寓，除谈天外，且吃简单之夜饭。</p>

<p>另外还有玄先生<sup class="notelink"><a href="#m350">[350]</a></sup>一人，再无别个了。</p>

<p>专此布达，并请</p>

<p class="left">道安。</p>

<p class="right">迅 顿首 <b>六月六日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[350] <b>玄先生</b> 指沈雁冰。</p>
