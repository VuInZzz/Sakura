<p class="title1">310911 致李小峰</p>
<p class="date">第12卷 · 一九三一年</p>
<br>
<div class="content"><p class="left">小峰兄：</p>

<p>昨遇舍弟，谈及种种，甚慰。</p>

<p>《小说史略》未知已出版否？出时希见赠二十本。</p>

<p>《旧时代之死》<sup class="notelink"><a href="#m53">[53]</a></sup>之作者之家族，现颇窘，几个友人为之集款存储，作孩子读书之用。该书八月应结版税，希为结算示知，或由我代取，或当由其旧友走取均可。</p>

<p class="right">迅 上 <b>九月十一日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[53] <b> 《旧时代之死》</b> 长篇小说，柔石著，1929年10月上海北新书局出版。</p>
