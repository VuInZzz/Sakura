<p class="title1">340731</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">340731<sup>②</sup> 致陶亢德</h3>

<p class="left">亢德先生：</p>

<p>来信谨悉。闲斋久无稿来，但我不知其住址，无从催起，只得待之而已。</p>

<p>此复，即颂</p>

<p class="left">夏祉。</p>

<p class="right">迅 顿首 <b>七月三十一日</b></p>
