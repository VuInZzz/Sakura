<p class="title1">350713 致赵家璧</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content"><p class="left">家璧先生：</p>

<p>晚得惠函，并《小说二集》一本，甚感。</p>

<p>我并没有《弥洒》，选小说时所用的几本，还是先生替我借来的。我想，也许是那里的图书馆的藏本。我用后，便即送还了，但我记得一二两卷也并不全。</p>

<p>专此布复，即请</p>

<p class="left">撰安。</p>

<p class="right">迅 上 <b>七月十三夜。</b></p>

</div>
