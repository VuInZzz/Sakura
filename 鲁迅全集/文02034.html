<p class="title1">340529</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">340529<sup>①</sup> 致何白涛</h3>

<p class="left">白涛先生：</p>

<p>木刻刀三套，早由书店寄出，想已收到。前日又寄赠《引玉集》一本，印工尚佳，不知能收到否？</p>

<p>现拟印中国木刻一本，前函已经提及，昨纸已购好，可即开手。 先生之原版，务希早日寄下，以便印入为祷。</p>

<p>专此布达，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>五月二十九日</b></p>
