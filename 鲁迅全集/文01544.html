<p class="title1">280331</p>
<p class="date">第12卷 · 一九二八年</p>
<br>
<div class="content">280331<sup>①</sup> 致李霁野</h3>

<p class="left">霁野兄：</p>

<p>《朝华夕拾》封面，今天陶君已画来，但系三色，怕北京印不好，便托他去印，计二千，成即寄上。不知够否？倘不够，当续印。其款当向北新去取，于未名社书款中扣除。</p>

<p>该书第一页上，望加上“陶元庆作书面”字样。</p>

<p class="right">迅 <b>三，卅一。</b></p>
