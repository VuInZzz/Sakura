<p class="title1">340607 致徐懋庸</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">懋庸先生：</p>

<p>六日信顷收到。</p>

<p>本星期六（九日）午后两点钟，希驾临北四川路底（第一点[<b>路</b>]电车终点）内山书店，当在其地相候。</p>

<p>此布即请</p>

<p class="left">刻安。</p>

<p class="right">迅 上 <b>六月七夜。</b></p>

</div>
