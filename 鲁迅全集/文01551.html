<p class="title1">280601 致李小峰</p>
<p class="date">第12卷 · 一九二八年</p>
<br>
<div class="content">280601 致李小峰<sup class="notelink"><a href="#m41">[41]</a></sup></h3>

<p>收到印品及洋百元。谢谢。</p>

<p>附上语丝稿两种，又寄语堂信等一件，请转送为荷，此上小峰先生。</p>

<p class="right">六月一日</p>

<hr>
