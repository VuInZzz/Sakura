<p class="title1">321106 致郑伯奇</p>
<p class="date">第12卷 · 一九三二年</p>
<br>
<div class="content"><p class="left">君平先生：</p>

<p>《竖琴》已校毕，今奉上，其中错误太多，改正之后，最好再给我看一遍（但必须连此次校稿，一同掷下）。</p>

<p>又，下列二点，希一并示知：</p>

<p>1.内缺目录。不知是有意删去，抑系遗失？</p>

<p>2.顶上或有横线（最初数页），或无，何故？</p>

<p>此上，即请</p>

<p class="left">著安。</p>

<p class="right">迅 启 <b>十一月六日</b></p>

</div>
