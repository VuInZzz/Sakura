<p class="title1">340404 致陶亢德</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">亢德先生：</p>

<p>惠示收到。照相若由我觅便人带上，恐需时日。今附上一函，一面将照相放在内山书店，社中想有送信人，请嘱其持函往取为幸。</p>

<p>此复，即请</p>

<p class="left">著安。</p>

<p class="right">迅 顿首 <b>四月四夜</b></p>

</div>
