<p class="title1">291116</p>
<p class="date">第12卷 · 一九二九年</p>
<br>
<div class="content">291116<sup>②</sup> 致韦丛芜</h3>

<p class="left">丛芜兄：</p>

<p>十日信收到。素园兄又吐些血，实在令我忧念，我想他应该什么事也不问，首先专心静养才是。</p>

<p>《奔流》是停滞着，二卷五期，现已陆续付印了，此后大约未必能月出一期，因为北新不能按期付给稿费。</p>

<p>我毫没有做什么值得提起的事，仍是打杂；也不想往北平去。周刊的事，我一点都不知道。</p>

<p class="right">迅 上 <b>十一月十六夜</b></p>
