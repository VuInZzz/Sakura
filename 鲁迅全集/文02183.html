<p class="title1">341205</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">341205<sup>①</sup> 致郑振铎</h3>

<p class="left">西谛先生：</p>

<p>日前上一函，说内山豫约《十竹斋笺谱》二十部，现在他又要加添十部，那么，连我的共有四十部了，特此声明。</p>

<p>记得《博古牌子》的裱本，序跋有些乱，第一页则似倒置卷末，这回复印，似应移正。</p>

<p>此布，即请</p>

<p class="left">撰安。</p>

<p class="right">迅 顿首 <b>十二月五日</b></p>
