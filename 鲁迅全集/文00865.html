<p class="title1">题《外套》</p>
<p class="date">第8卷 · 一九三二年</p>
<br>
<div class="content">题《外套》<sup class="notelink"><a href="#m591">[591]</a></sup></h4>

<p>此素园病重时特装相赠者，岂自以为将去此世耶，悲夫！越二年余，发箧见此，追记之。三十二年四月三十日，迅。</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[591] 本篇据手迹编入，原无标题。<br/><b>《外套》</b>，俄国作家果戈理的中篇小说，韦素园译。1926年9月未名社初版，1929年再版，为《未名丛刊》之一。1929年7月韦素园以布面精装本一册寄赠鲁迅。</p>
