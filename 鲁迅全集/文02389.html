<p class="title1">350722</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350722<sup>③</sup> 致李霁野</h3>

<p class="left">霁野兄：</p>

<p>十五信收到已数日，前日遇许先生，则云英文教员已聘定，亦无另外钟点，所以杨先生事，遂无从谈起。</p>

<p>日前为静兄向暨南大学有所图，亦不成，中国步步荆棘。</p>

<p>刘文贞君译稿已登出，现已暑假，不知译者是否仍在校，稿费应寄何处，希即示知。</p>

<p>此布，即颂</p>

<p class="left">时绥。</p>

<p class="right">豫 顿首 <b>七月廿二日</b></p>
