<p class="title1">281229 致翟永坤</p>
<p class="date">第12卷 · 一九二八年</p>
<br>
<div class="content"><p class="left">永坤兄：</p>

<p>得十一月廿六日来信，迟复为歉。惠函所云小说，惟《盛夏之夜》一篇，遍觅未见，但另□□□□<sup class="notelink"><a href="#m101">[101]</a></sup>一篇，亦系草稿，或尚未用，今已和《断碣》等四篇一并另封挂号寄上。我因居处不大，所以书籍稿件，无法布置，至于常易散失，实为困难。所以成集之稿，希暂勿见寄，因虑失落也。</p>

<p>陶冶公我是熟识的，现在想已全愈了罢。</p>

<p class="right">鲁迅 <b>十二月廿九日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[101] 此处原件缺损。</p>
