<p class="title1">340505 致陶亢德</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">亢德先生：</p>

<p>惠示谨悉。《泥沙杂拾》之作者，实即以种种笔名，在《自由谈》上投稿，为一部分人疑是拙作之人，然文稿则确皆由我转寄。作者自言兴到辄书，然不常见访，故无从嘱托，亦不能嘱托。今手头但有杂感三篇，皆《自由谈》不敢登而退还者，文实无大碍，然亦平平。今姑寄奉，可用则用，太触目处删少许亦不妨，不则仍希掷还为荷。此请</p>

<p class="left">文安。</p>

<p class="right">迅 顿首 <b>五月五夜</b></p>

</div>
