<p class="title1">360209 致姚克</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content"><p class="left">莘农先生：</p>

<p>前日挂号寄奉王君信，想已达。</p>

<p>日本在上海演奏者，系西洋音乐，其指挥姓近卫，为禁中侍卫之意，又原是公爵，故误传为宫中古乐，其实非也。</p>

<p>专此布达，并颂</p>

<p class="left">春禧。</p>

<p class="right">迅 顿首 <b>二月九日</b></p>

</div>
