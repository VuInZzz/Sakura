<p class="title1">360509 致吴朗西</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content"><p class="left">朗西先生：</p>

<p>昨天内山说要批发精装《死魂灵百图》五本，希便中送给他为荷。</p>

<p>专此布达，即请</p>

<p class="left">日安。</p>

<p class="right">鲁迅 <b>五月九日</b></p>
