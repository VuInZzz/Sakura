<p class="title1">341127</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">341127<sup>②</sup> 致萧军、萧红</h3>

<p class="left">刘吟先生：</p>

<p>本月三十日（星期五）午后两点钟，你们两位可以到书店里来一趟吗？小说<sup class="notelink"><a href="#m602">[602]</a></sup>如已抄好，也就带来，我当在那里等候。</p>

<p>那书店，坐第一路电车可到。就是坐到终点（靶子场）下车，往回走，三四十步就到了。</p>

<p>此布，即请</p>

<p class="left">俪安。</p>

<p class="right">迅 上 <b>十一月二十七日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[602] <b>小说</b> 指《八月的乡村》稿。</p>
</div></div>
