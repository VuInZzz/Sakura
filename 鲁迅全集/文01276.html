<p class="title1">170513 致蔡元培</p>
<p class="date">第11卷 · 一九一七年</p>
<br>
<div class="content">170513 致蔡元培<sup class="notelink"><a href="#m117">[117]</a></sup></h4>

<p>鹤庼先生左右：谨启者：起孟于前星期发热，后渐增。今日延医诊视，知是瘄子<sup class="notelink"><a href="#m118">[118]</a></sup>。此一星期内不能外出受风，希</p>

<p>赐休暇为幸。专此，敬请</p>

<p class="left">道安。</p>

<p class="right">晚周树人谨状 五月十三日</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[117] 此信原无标点。</p>
<p class="noteitem">[118] <b>瘄子</b> 疹子。周作人自5月7日夜出疹子，至6月初始愈。</p>
