<p class="title1">350331 致母亲</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content"><p>母亲大人膝下，敬禀者，廿三的信，早收到了。小包一个，亦于前日收到，当即分出一半，送与老三。其中的干菜，非常好吃，孩子们都很爱吃，因为他们是从来没有吃过这样干菜的。</p>

<p>大人的胃病，近来不知如何，万乞千万小心调养为要。寓中均好，惟男较忙，前给海婴种了四粒痘，都没有灌浆，医生云，可以不管，至十多岁再种了。</p>

<p>专此布达，恭请</p>

<p class="left">金安。</p>

<p class="right"><b>男</b>树 叩上 广平海婴同叩 <b>三月三十一日</b></p>

</div>
