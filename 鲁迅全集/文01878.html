<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content">331112<sup>①</sup> 致吴渤</h3>

<p class="left">吴渤先生：</p>

<p>来稿已看过，并序文及较详的回信<sup class="notelink"><a href="#m367">[367]</a></sup>，都作一包，放在内山书店，暇时希往一取为幸。</p>

<p>此致即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>十一月十二日</b></p>

<hr>
