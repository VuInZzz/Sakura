<p class="title1">330426 致李小峰</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content"><p class="left">小峰兄：</p>

<p>《杂感选集》已批好，希店友于便中来寓一取。又，序文亦已寄来，内中有稍激烈处，但当无妨于出版，兄阅后仍交还，当于本文印好后与目录一同付印刷局也。</p>

<p class="right">迅 上 <b>四月廿六夜。</b></p>
