<p class="title1">260727</p>
<p class="date">第11卷 · 一九二六年</p>
<br>
<div class="content">260727<sup>②</sup> 致陶元庆</h4>

<p class="left">璇卿兄：</p>

<p>《沈钟》<sup class="notelink"><a href="#m582">[582]</a></sup>的大小，是和附上的这一张纸一样。他们想于八月十日出版，不知道可以先给一画否？</p>

<p class="right">迅上 七月二十七日</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[582] <b>《沉钟》</b> 文艺刊物，沉钟社编辑。1925年10月在北京创刊，初为周刊，共出十期。次年8月起改为半月刊，中经休刊、复刊，1934年2月出至三十四期停刊。陶元庆曾为它绘制封面。</p>
