<p class="title1">340331</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">340331<sup>①</sup> 致曹靖华</h3>

<p class="left">汝珍兄：</p>

<p>二十八日寄上一函寄至学校并洋八十元，未知已到否？顷已收到肖兄寄来之《文学报》约十张，拟寄上，但未知以寄至何处为宜，希示地址。又，挂呈则收信人须有印，并乞以有印之名见告为荷。此上即请</p>

<p class="left">春安。</p>

<p class="right"><b>弟</b>豫 顿首 <b>三月卅一日</b></p>
