<p class="title1">290123 致孙用</p>
<p class="date">第12卷 · 一九二九年</p>
<br>
<div class="content">290123 致孙用<sup class="notelink"><a href="#m17">[17]</a></sup></h3>

<p class="left">孙用先生：</p>

<p>蒙寄译诗，甚感。但极希望 先生许我从中择取四首<sup class="notelink"><a href="#m18">[18]</a></sup>于《奔流》中发表，余二首附回，希 谅察为幸。</p>

<p class="right">鲁迅 <b>一月廿三日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[17] <b>孙用</b>（1902—1983） 原名卜成中，浙江杭州人。当时是杭州邮局职员，业余从事翻译工作。</p>
<p class="noteitem">[18] <b>择取四首</b> 指莱蒙托夫作的《帆》、《天使》、《我出来》、《三棵棕榈树》，曾以《莱芒托夫诗四首》为题，载《奔流》月刊第一卷第九期（1929年2月）。</p>
