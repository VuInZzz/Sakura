<p class="title1">360417</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">360417<sup>②</sup> 致罗清桢</h3>

<p class="left">清桢先生：</p>

<p>顷得惠函并木刻种种，感谢之至。</p>

<p>E.君<sup class="notelink"><a href="#m189">[189]</a></sup>并无信来，是不能寄到，或没有评论，均不可知。至于交换木刻，则因为我和那边的木刻家，均无直接交际，忽有此举，似稍嫌唐突，故亦无报命，尚希 鉴原为幸。</p>

<p>专此布复，并颂</p>

<p class="left">时绥。</p>

<p class="right">鲁迅 <b>四月十七日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[189] <b>E.君</b> 即巴惠尔·艾丁格尔。</p>
