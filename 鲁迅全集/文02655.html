<p class="title1">360921</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">360921<sup>②</sup> 致黎烈文</h3>

<p>烈文先生：昨所说的那一篇，已抄讫，今寄上。上午又作了一则《立此存照》，一同附奉，<sup class="notelink"><a href="#m344">[344]</a></sup>希能见于第三期。但太长；同是“存照”，而相度其长短，或补白，或不补白，何如？专此布达，并颂</p>

<p class="left">撰安。</p>

<p class="right">迅 顿首 <b>九月二十一日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[344] 指《“立此存照”》（三）、《“立此存照”》（四），后均收入《且介亭杂文末编》。</p>
