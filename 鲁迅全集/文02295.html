<p class="title1">350317</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350317<sup>①</sup> 致萧红</h3>

<p class="left">悄吟太太：</p>

<p>来信并稿两篇，已收到。</p>

<p>前天，孩子的脚给沸水烫伤了，因为虽有人，而不去照管他。伤了半只脚，看来要有半个月才会好。等他能走路，我们再来看您罢。</p>

<p>专此布复，并请</p>

<p class="left">双安。</p>

<p class="right">豫 上 <b>三月十七日</b></p>
