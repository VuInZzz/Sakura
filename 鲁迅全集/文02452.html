<p class="title1">351022</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">351022<sup>②</sup> 致徐懋庸</h3>

<p>请转</p>

<p class="left">徐先生：</p>

<p>信并剪报<sup class="notelink"><a href="#m550">[550]</a></sup>都收到。又给杂事岔开，星期四以前交不出稿子了。只得以后再说。</p>

<p>靖华寄来一笺，今附上。</p>

<p>专此布达，即颂</p>

<p class="left">时绥。</p>

<p class="right">豫 上 <b>十月廿二日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[550] <b>剪报</b> 指1935年10月19日《时事新报·每周文学》第六期。该期载有海洛的书评《“俄罗斯的童话”》。</p>
