<p class="title1">350525</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350525<sup>①</sup> 致赵家璧</h3>

<p class="left">家璧先生：</p>

<p>惠函收到。版税单想系指春季结算的那一项，那么，不但收到，而且用掉了。中央怕《竖琴》前记，<sup class="notelink"><a href="#m327">[327]</a></sup>真是胆小如鼷，其实并无害，因此在别一面，也没有怎样的益，有无都无关紧要，只是以装门面而已。现在剪去以免重印重装，我同意于公司的办法，并无异议也。</p>

<p>专此布复，顺颂</p>

<p class="left">文安。</p>

<p class="right">鲁迅 上 <b>五月廿五日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[327] 指《〈竖琴〉前记》被删事，参看341210<sup>②</sup>信注〔2〕。</p>
