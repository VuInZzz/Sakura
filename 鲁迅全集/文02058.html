<p class="title1">340618</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">340618<sup>②</sup> 致杨霁云</h3>

<p class="left">霁云先生：</p>

<p>日来自患胃病，眷属亦罹流行感冒，所约文<sup class="notelink"><a href="#m369">[369]</a></sup>遂止能草草塞责，歉甚。今姑寄呈，能用与否，希酌定。</p>

<p>又，倘能用，而须检查，则草稿殊不欲送去，自又无法托人抄录，敢乞 先生觅人一抄，而以原稿见还为祷。</p>

<p>此布即请</p>

<p class="left">道安。</p>

<p class="right">迅 上 <b>六月十八夜</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[369] 指《倒提》，后收入《花边文学》。据收信人回忆，因他拟编的杂志未出成，后遂将该稿退还作者。</p>
