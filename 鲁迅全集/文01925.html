<p class="title1">340108 致何白涛</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">白涛先生：</p>

<p>来函并木刻收到。这幅木刻，我看是好的，很可见中国的特色。我想，现在的世界，环境不同，艺术上也必须有地方色彩，庶不至于千篇一律。</p>

<p>先生要我设法旅费<sup class="notelink"><a href="#m9">[9]</a></sup>，我是可以的，但我现在手头没有现钱。所以附上一函，请于十五日<span class="u">自己</span>拿至内山书店，我当先期将款办好，放在那里，托他们转交。</p>

<p>此复，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>一月八夜</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[9] <b>旅费</b> 何百涛当时在上海新华艺术专科学校毕业之后失业，向鲁迅借旅资三十元回广东。</p>
