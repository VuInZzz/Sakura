<p class="title1">350317</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350317<sup>③</sup> 致孟十还</h3>

<p class="left">十还先生：</p>

<p>我在给《世界文库》译果戈理的《死魂灵》，不知先生有这书的插画本否？倘有，乞借给我一用，照出后即奉还，如能将图下的题句译示，尤感。</p>

<p>此书如有，希直交文学社黄先生。</p>

<p>专此布达，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>三月十七日</b></p>

</div>
