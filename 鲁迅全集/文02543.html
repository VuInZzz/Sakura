<p class="title1">360224 致夏传经</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content"><p class="left">传经先生：</p>

<p>日前匆复一函，想已达。顷偶翻书箱，见有三种存书，为先生所缺，因系自著，毫无用处，不过以饱蟫蠹，又《竖琴》近出第四版，以文网稍疏，书店已将序文补入，送来一册，自亦无用，已于上午托书店寄上，谨以奉赠。此在我皆无用之物，毫无所损，务乞勿将书款寄下，至祷至祷。</p>

<p>专此布达，并颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>二月二十四日</b></p>

</div>
