<p class="title1">360914</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">360914<sup>①</sup> 致吴朗西</h3>

<p class="left">朗西先生：</p>

<p>顷面托排印之说明<sup class="notelink"><a href="#m334">[334]</a></sup>，已抄好底稿，今寄奉，乞便中付与印刷局为荷。校好之后，除打纸板外，并乞令在较厚的白纸<b>（光道林）</b>上精印五六张。专此布达，并颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>九月十四夜</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[334] 指当时《凯绥·珂勒惠支版画选集》改版重印时，在每幅画下所加的题目（初版本无画题）。</p>
