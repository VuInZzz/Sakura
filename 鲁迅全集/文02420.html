<p class="title1">350908</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350908<sup>②</sup> 致黄源</h3>

<p class="left">河清先生：</p>

<p>后记及订正<sup class="notelink"><a href="#m474">[474]</a></sup>，今寄上。</p>

<p>陈节<sup class="notelink"><a href="#m475">[475]</a></sup>译的各种，如页数已够，我看不必排进去了，因为已经并不急于要钱。乞即使书店跑路的带下为托。</p>

<p>专此布达，即请</p>

<p class="left">撰安。</p>

<p class="right">迅 上 <b>九月八日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[474] 指《〈村妇〉译后附记》和《给〈译文〉编者订正的信》，现均编入《集外集拾遗补编》。</p>
<p class="noteitem">[475] <b>陈节</b> 即瞿秋白。</p>
