<p class="title1">350430 致母亲</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content"><p>母亲大人膝下敬禀者，四月廿四日来示，已经收到，第二次所寄小包，也早收到了。上海报载廿六日起，北平大风，未知寓中如何，甚以为念。大人胃病初愈，尚无力气，尚希加意静养为要。上海天气亦不甚顺，近来已晴，想可向暖。寓中均安，海婴亦好，可请释念。男身体尚好，但因琐事不少，故不免稍忙，时亦觉得无力耳，但有些文章，为朋友及生计关系，亦不能不做也。专此布达，恭请</p>

<p class="left">金安。</p>

<p class="right"><b>男</b>树 叩上 广平及海婴同叩 <b>四月三十日</b></p>

</div>
