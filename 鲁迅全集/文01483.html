<p class="title1">270303 致刘随</p>
<p class="date">第12卷 · 一九二七年</p>
<br>
<div class="content">270303 致刘随<sup class="notelink"><a href="#m42">[42]</a></sup></h3>

<p class="left">前度先生：</p>

<p>惠函敬悉。讲演稿自然可以答应 先生在日报发表，今寄还。其中僭改了几处，乞鉴原为幸。顺祝</p>

<p class="left">康健</p>

<p class="right">鲁迅 <b>三月三日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[42] <b>刘随</b> 又名前度，鲁迅讲演《老调子已经唱完》记录者。记录稿后来未能在香港报纸发表。</p>
