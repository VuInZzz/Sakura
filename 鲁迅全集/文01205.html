<p class="title1">八〇</p>
<p class="date">第11卷 · 第二集 厦门——广州</p>
<br>
<div class="content"><p class="left">迅师：</p>

<p>兹寄上图章一个，夹在绒背心内，但外面则写围巾一条。你打开时小心些，图章落地易碎的。今早我曾寄出一信，计算起来近日写去的信颇详细了。现时刚吃完早饭，就要上课，下次再谈罢。</p>

<p>蛇足的写这封信，是使你见信好向邮局索包裹。这包长可七寸，阔五寸，高四寸左右。</p>

<p class="right">H.M.十一月十七日。</p>
