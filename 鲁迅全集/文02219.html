<p class="title1">341227</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">341227<sup>②</sup> 致孟十还</h3>

<p class="left">十还先生：</p>

<p>惠函收到。《译文》稿费，每月有一定，而每期页数，有多有少，所以虽然案页计算，而每月不同（页数少的时候稿费较多，多则反是），并且生出小数，弄得零零碎碎了。</p>

<p>《五月夜》昨天曾面询黄先生，他还不能决定，因为须看别人来稿，长短如何。但我看未必这次来稿，恰巧都是短的居多，而《译文》目录，至少总得有十种左右，所以十之九是要分成两期的。</p>

<p>专复，并颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>十二月廿七夜。</b></p>
