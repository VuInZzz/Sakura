<p class="title1">五</p>
<p class="date">第14卷 · 4 致刘岘</p>
<br>
<div class="content"><p>バルバン和ハスマツケール<sup class="notelink"><a href="#m12">[12]</a></sup>的作品，我也仅在《世界美术全集》中见过，据说明，则此二人之有名，乃因能以浓淡，表现出原画的色彩来（他们大抵是翻刻别人的作品的）；而且含有原画上所无之一种特色，即木刻的特色。当铜版术尚未盛行之时，这种木刻家是也能出名的。但他们都不是<span class="u">创作的木刻家</span>。</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[12] <b>バルバン和ハスマツケール</b> 据收信人回忆，即巴蓬和哈斯马格耳，两人均为法国版画复制家。</p>
