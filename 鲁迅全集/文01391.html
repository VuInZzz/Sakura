<div class="content">260727<sup>①</sup> 致章廷谦</h4>

<p>书目<sup class="notelink"><a href="#m581">[581]</a></sup>中可用之处，已经抄出，今奉还，可以还给图书馆了。</p>

<p class="right">迅 七，二七</p>
