<p class="title1">340809 致唐弢</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">唐弢先生：</p>

<p>内山书店的关于日文书籍的目录，今寄上。上用箭头的是书店老版所推举的；我以为可缓买或且不买的，就上面不加圈子。</p>

<p>内山书店店员有中国人，无须用日语。</p>

<p>学校我说不出好的来，但我想，放弃发音，却很不好。不如就近找一个学校（不管好坏）或个人，学字母正音及拼法，学完之后，才自修。无论怎样骗钱的学校，教拼音之类，也拖不到两个月的。</p>

<p>此复，即颂</p>

<p class="left">时绥。</p>

<p class="right"><b>名</b>知 顿首 <b>八月九夜。</b></p>

</div>
