<p class="title1">361009</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">361009<sup>②</sup> 致黄源</h3>

<p class="left">河清先生：</p>

<p>寄上广告草稿<sup class="notelink"><a href="#m370">[370]</a></sup>，不知本月的《译文》上，还赶得及登出否？在《作家》上，却下月也不妨。</p>

<p>专此布达，并请</p>

<p class="left">撰安。</p>

<p class="right">迅 上 <b>十月九日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[370] 指《绍介〈海上述林〉上卷》，现编入《集外集拾遗补编》。</p>
