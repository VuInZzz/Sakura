<p class="date">第12卷 · 一九二九年</p>

<div class="content">291116<sup>①</sup> 致李霁野</h3>

<p class="left">霁野兄：</p>

<p>有寄靖华兄一笺，托他一些事情，不知地址，今寄上，希兄转寄为荷。日前寄上《文学与批评》一包，并还作者像片一枚，想已收到了罢。</p>

<p class="right">迅 上 <b>十一，十六</b></p>
