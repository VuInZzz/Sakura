<p class="title1">260730 致章廷谦</p>
<p class="date">第11卷 · 一九二六年</p>
<br>
<div class="content"><p class="left">矛尘兄：</p>

<p>得廿八日信，知道你又摔坏了脚，这真是出于我的“意表之外”，赶紧医，而且小心不再摔坏罢。</p>

<p>我的薪水送来了，钱以外是一张收条，自己签名。这样看来，似乎并非代领，而是会计科送来的。但无论如何，总之已经收到了，是谁送来的，都不成其为问题。</p>

<p>至于你写给北新小板<sup class="notelink"><a href="#m583">[583]</a></sup>的收书条，我至今没有见。</p>

<p class="right">迅 七，卅</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[583] <b>小板</b> 老板的戏称，指李小峰。</p>
</div></div>
