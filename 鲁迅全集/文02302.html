<p class="title1">350322</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350322<sup>③</sup> 致张慧</h3>

<p class="left">张慧先生：</p>

<p>委写书面<sup class="notelink"><a href="#m217">[217]</a></sup>，已写好，请择用其一，如果署名，恐怕反而不好，所以不署了。如先生一定要用，则附上一印，可以剪下，贴在相宜的地方。</p>

<p>因为忘却了通信地址，所以只能托 罗先生转寄。</p>

<p>专达，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>三月二十二日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[217] 指为张慧自费手印木刻集题写“张慧木刻画”书名。</p>
</div></div>
