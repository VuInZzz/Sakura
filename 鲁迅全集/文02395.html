<p class="title1">350729</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350729<sup>③</sup> 致徐懋庸</h3>

<p class="left">茂荣先生：</p>

<p>木刻查了一遍，没有相宜的。要紧的一层，是刻者近来不知如何，无从查考，所以还是不用的好。</p>

<p>モンタニ的译本<sup class="notelink"><a href="#m414">[414]</a></sup>，便中当为一查。此书他们先前已曾有过一种译本，但大约不如这回的好。</p>

<p>此复，即请</p>

<p class="left">撰安。</p>

<p class="right">迅 上 <b>七月廿九日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[414] <b>モンタニ的译本</b> 即《蒙田随想录》，关根秀雄译，1935年东京白水社出版。蒙田，参看340522<sup>①</sup>信注〔1〕。</p>
