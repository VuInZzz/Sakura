<p class="title1">340109 致萧剑青</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">340109 致萧剑青<sup class="notelink"><a href="#m10">[10]</a></sup></h3>

<p class="left">剑青先生：</p>

<p>来函诵悉。我因为闲暇太少，实在没法看稿作序了。抱歉之至。</p>

<p>专复，即颂</p>

<p class="left">时绥。</p>

<p class="right">鲁迅 <b>一月九日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[10] <b>萧剑青</b> 东南亚华侨，原籍广东。当时在上海世界书局任职，曾将所著诗文、木刻合集《灰色集》送请鲁迅作序。</p>
