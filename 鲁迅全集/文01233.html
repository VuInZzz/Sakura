<p class="title1">一〇八</p>
<p class="date">第11卷 · 第二集 厦门——广州</p>
<br>
<div class="content"><p class="left">MY DEAR TEACHER：</p>

<p>十六日信是告诉你寄信的地址的，十九日信面上就没有详写。但你廿四的信封上光写高第街，却居然也寄到了。我住的是街中间，叫作“高第街中约”，倘加上“旧门牌一七九号”，就更为妥当。</p>

<p>你十六，廿一的信，都收到了，惟寄校之另一封未见，我想是就会到的，因我已托人代收，或不致失少。</p>

<p>现在是下午六时，快要晚餐；八时还要外出，稍缓再详谈罢。</p>

<p>祝你新年。</p>

<p class="right">YOUR H.M.十二月三十下午六时。</p>

</div>
