<p class="title1">351221</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">351221<sup>①</sup> 致赵家璧</h3>

<p class="left">家璧先生：</p>

<p>数日前寄奉一函，想已达。近来常有关于我的谣言，谓要挤出何人，打倒何人，研究语气，颇知谣言之所从出，所以在文坛之闻人绅士所聚会之阵营中，拟不再投稿，以省闲气，前回说过的那一个短篇<sup class="notelink"><a href="#m629">[629]</a></sup>，也不寄奉了。</p>

<p>专此布达，即请</p>

<p class="left">著安。</p>

<p class="right">鲁迅 <b>十二月二十一日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[629] 指短篇小说集《故事新编》。</p>
</div></div>
