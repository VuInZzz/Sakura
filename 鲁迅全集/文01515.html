<p class="title1">271020 致李霁野</p>
<p class="date">第12卷 · 一九二七年</p>
<br>
<div class="content"><p class="left">霁野兄：</p>

<p>《小约翰》封面铜板已做好，已托北新代寄，大约数日后可到。今将标本寄上，纸用黄色，图用紫色。</p>

<p>孙春台病已愈，《朝华夕拾》封面已将开始绘画。书之第一页后可以印上“孙福熙作书面”字样了。</p>

<p class="right">迅 <b>十，廿。</b></p>

<p>板费五元请便中交西三条密斯许。</p>
