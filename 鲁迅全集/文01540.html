<p class="title1">280306</p>
<p class="date">第12卷 · 一九二八年</p>
<br>
<div class="content">280306<sup>②</sup> 致章廷谦</h3>

<p class="left">矛尘兄：</p>

<p>午后寄一信，想已到。现续查得“河东节”的意思如下：——</p>

<p>“河东节”，一名“江户节”；江户者，东京之旧称也。乃江户人十寸见姓河东名所创唱戏的腔调。然则河东乃是人名，犹中国之有梅派，谭派<sup class="notelink"><a href="#m8">[8]</a></sup>矣。</p>

<p class="right">迅 <b>三，六</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[8] <b>梅派</b> 京剧演员梅兰芳所创“正旦”表演艺术的流派。谭派，京剧演员谭鑫培所创“<img class="inline" alt="" src="./images/image06577.jpeg"/>生”表演艺术的流派。</p>
