<p class="title1">350301</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350301<sup>②</sup> 致母亲</h3>

<p>母亲大人膝下，敬禀者：上午刚寄出一函，午后即得二月二十五日来示，备悉一切。男的意思，以为女仆还是不带，因为南北习惯不同，彼此话也听不懂，不见得有什么用处，而且闲暇的时候，和这里的用人闲谈，一知半解，说不定倒会引出麻烦的事情来的。余已详前函，兹不赘。</p>

<p>专此布复，恭请</p>

<p class="left">金安。</p>

<p class="right"><b>男</b>树 叩上 <b>三月一日下午。</b></p>

</div>
