<p class="title1">350711 致楼炜春</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content"><p class="left">炜春先生：</p>

<p>六月二十四日信早到，因病未能即复为歉。</p>

<p>《自选集》<sup class="notelink"><a href="#m390">[390]</a></sup>出普及本事，我是可以同意的。附上印证壹千，希察收为荷。</p>

<p>专此布复，即请</p>

<p class="left">暑安。</p>

<p class="right">鲁迅 上 <b>七月十一日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[390] <b>《自选集》</b> 指《鲁迅自选集》。1933年天马书店出版，1935年出版普及版。</p>
