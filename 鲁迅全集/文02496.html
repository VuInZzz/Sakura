<p class="title1">351223</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">351223<sup>②</sup> 致赵景深</h3>

<p class="left">景深先生：</p>

<p>示敬悉。附呈一短文<sup class="notelink"><a href="#m641">[641]</a></sup>，系自己译出，似尚非无关系文字，可用否乞 裁酌。</p>

<p>倘若录用，希在第二期再登，因为我畏与天下文坛闻人，一同在第一期上耀武扬威也。<sup class="notelink"><a href="#m642">[642]</a></sup></p>

<p>专此布复，即请</p>

<p class="left">撰安。</p>

<p class="right">迅 顿首 <b>十二月二十三日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[641] 指《陀思妥耶夫斯基的事》，后收入《且介亭杂文二集》。</p>
<p class="noteitem">[642] 《青年界》第九卷第一期（1936年1月）曾载有“青年作文指导特辑”专栏。</p>
