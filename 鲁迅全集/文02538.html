<p class="title1">360219</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">360219<sup>②</sup> 致陈光尧<sup class="notelink"><a href="#m88">[88]</a></sup></h3>

<p class="left">光尧先生：</p>

<p>两蒙惠书，谨悉一切。先生辛勤之业，闻之已久，夙所钦佩。惟于简字一道，未尝留心，故虽惊于浩汗，而莫赞一辞，非不愿，实不能也。敢布下怀，诸希谅察为幸。</p>

<p>专此奉复，顺请</p>

<p class="left">撰安。</p>

<p class="right">鲁迅 上 <b>二月十九日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[88] <b>陈光尧</b>（1906—1972） 陕西城固人。曾任北平研究院助理员，长期从事语言、文字研究工作。</p>
