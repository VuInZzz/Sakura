<p class="title1">340606</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">340606<sup>③</sup> 致王志之</h3>

<p class="left">思远兄：</p>

<p>雁先生为《文史》而作的稿子<sup class="notelink"><a href="#m351">[351]</a></sup>已交来，今寄上，希收转为荷。</p>

<p>小说稿两篇已收到，并闻。</p>

<p>此布，即颂</p>

<p class="left">时绥</p>

<p class="right">豫 顿首 <b>六月六日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[351] 指《莎士比亚与现实主义》，作者署名“味茗”，载北平《文史》第一卷第三号（1934年8月）。</p>
