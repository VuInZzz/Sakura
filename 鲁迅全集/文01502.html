<p class="title1">270731 致章廷谦</p>
<p class="date">第12卷 · 一九二七年</p>
<br>
<div class="content"><p class="left">矛尘兄：</p>

<p>廿九日寄一函，已达否？鼻在杭盖已探得我八月中当离粤，今日得其来信，阅之不禁失笑，即作一复，给他小开玩笑。今俱录奉<sup class="notelink"><a href="#m140">[140]</a></sup>，以作笑资。季黻尚无信来，兄如知其住址，乞转送一阅为荷。</p>

<p class="right">迅 <b>七，卅一</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[140] 顾颉刚来信及鲁迅的复信，参看《三闲集·辞顾颉刚教授令“候审”》。</p>
