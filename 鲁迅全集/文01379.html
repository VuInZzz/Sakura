<p class="title1">260310 致翟永坤</p>
<p class="date">第11卷 · 一九二六年</p>
<br>
<div class="content">260310 致翟永坤<sup class="notelink"><a href="#m551">[551]</a></sup></h4>

<p class="left">永坤先生：</p>

<p>二月份有稿费两元，应送至何处，请示知，以便送上。</p>

<p class="right">鲁迅 三月十日</p>

<p class="right">西四、宫门口、西三条、二十一号</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[551] <b>翟永坤（1900—1959）</b> 字资生，河南信阳人。1925年在北京法政大学读书，1926年转入北京大学。因投稿《国民新报》副刊认识鲁迅。</p>
