<p class="title1">350306 致赵家璧</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content"><p class="left">家璧先生：</p>

<p>序文总算弄好了，连抄带做，大约已经达到一万字；但“江山好改，本性难移”，无论怎么小心，总不免发一点“不妥”的议论。如果有什么麻烦，请 先生随宜改定，不必和我商量了，此事前已面陈，兹不多赘。</p>

<p>序文的送检，我想还是等选本有了结果之后，以免他们去对照，虽然他们也未必这么精细，忠实，但也还是预防一点的好罢。</p>

<p>“不妥”的印，问文学社，云并无其事。是小报上造出来的。</p>

<p>专此布达，即请</p>

<p class="left">撰安。</p>

<p class="right">迅 上 <b>三月六夜。</b></p>

</div>
