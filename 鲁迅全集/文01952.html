<p class="title1">340304</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">340304<sup>①</sup> 致黎烈文</h3>

<p class="left">烈文先生：</p>

<p>“此公”<sup class="notelink"><a href="#m92">[92]</a></sup>稿二篇呈上，颇有佛气，但《自由谈》本不拘一格，或无妨乎？</p>

<p>“此公”脾气颇不平常，不许我以原稿径寄，其实又有什么关系，而今则需人抄录，既费力，又费时，忙时殊以为苦。不知馆中有人抄写否？倘有，则以抄本付排，而以原稿还我，我又可以还“此公”。此后即不必我抄，但以原稿寄出，稍可省事矣。如何？便中希示及。</p>

<p>此上，即请</p>

<p class="left">道安。</p>

<p class="right">迅 顿首 <b>三月四夜</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[92] “<b>此公</b>” 指徐诗荃。</p>
