<p class="title1">260920</p>
<p class="date">第11卷 · 一九二六年</p>
<br>
<div class="content">260920<sup>①</sup> 致韦素园</h4>

<p class="left">素园兄：</p>

<p>寄上稿子<sup class="notelink"><a href="#m596">[596]</a></sup>四张，请察收。</p>

<p>《关于鲁迅……》及《出了象牙之塔》，请各寄三本来，用挂号为妥。</p>

<p>到此地也并不较闲，再谈罢。</p>

<p class="right">迅 九，二十</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[596] 指《从百草园到三味书屋》，后收入《朝花夕拾》。</p>
