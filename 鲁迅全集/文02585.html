<p class="title1">360424</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">360424<sup>②</sup> 致段干青</h3>

<p class="left">干青先生：</p>

<p>顷收到廿日信。木刻二集<sup class="notelink"><a href="#m198">[198]</a></sup>早收到，谢谢！</p>

<p>木刻由普遍而入于消沈，这是因为没有技法上的指导者的缘故，于是无法上达，即使有很好的题材，也不能表现出来了。</p>

<p>我自己不会刻，不过绍介过一点外国作品，近来又因为杂务和生病，连绍介的事也放下了，但不久还想翻印一点。至于理论和技法，我其实是外行的。</p>

<p>专此布复，即颂</p>

<p class="left">时绥。</p>

<p class="right">鲁迅 <b>四月廿四日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[198] <b>木刻二集</b> 指《干青木刻二集》，系手印出版。</p>
