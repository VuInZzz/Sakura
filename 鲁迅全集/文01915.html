<p class="title1">331226</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content">331226<sup>②</sup> 致王熙之</h3>

<p class="left">熙之先生：</p>

<p>惠函收到。儿歌曾绍介给北新书局，但似未发表。此次寄来的较多，也只好仍寄原处，因为我和书店很少往来。</p>

<p>大作的诗，有几首是很可诵的，但内容似乎旧一点，此种感兴，在这里是已经过去了。现并我的一本杂感集<sup class="notelink"><a href="#m493">[493]</a></sup>，一并挂号寄上。</p>

<p>《自由谈》的编辑者是黎烈文先生，我只投稿，但自十一月起，投稿也不能登载了。此复即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>十二月廿六日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[493] <b>杂感集</b> 指《伪自由书》。</p>
