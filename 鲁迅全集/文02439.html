<p class="title1">351002 致萧军</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content"><p class="left">刘兄：</p>

<p>《羊》已登出，稿费单今日寄到，现转上。</p>

<p>《译文》出了岔子；但我仍忙；前天起，伏案太久，颈子痛了。</p>

<p>匆匆，再谈。</p>

<p>即请</p>

<p class="left">俪安。</p>

<p class="right">豫 上 <b>十月二夜。</b></p>

</div>
