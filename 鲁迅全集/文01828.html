<p class="title1">330807 致赵家璧</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content"><p class="left">家璧先生：</p>

<p>为《一个人的受难》<sup class="notelink"><a href="#m198">[198]</a></sup>写了一点序，姑且寄上，如不合用，或已太迟，请抛掉就是，因为自己看看，也觉得太草率了。</p>

<p>此上，即请</p>

<p class="left">著安。</p>

<p class="right">迅 启 <b>八月七日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[198] <b>《一个人的受难》</b> 比利时麦绥莱勒（F.Masereel，1889—1972）所作木刻故事连环图画。1933年9月由上海良友图书印刷公司出版。</p>
