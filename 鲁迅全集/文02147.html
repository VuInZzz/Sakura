<p class="title1">341022</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">341022<sup>②</sup> 致徐懋庸</h3>

<p class="left">懋庸先生：</p>

<p>Sheherazade<sup class="notelink"><a href="#m540">[540]</a></sup>这字，在我的古旧的人地名字典上查不出，又无神话学字典，无法可想。但我疑心这也许是《天方夜谈》里的人名。</p>

<p>此复，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上<b>〔十月〕二十二日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[540] Sheherazade 舍海尔萨德。《天方夜谭》（《一千零一夜》）中的人物。</p>
