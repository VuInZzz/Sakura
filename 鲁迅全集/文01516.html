<p class="title1">271021</p>
<p class="date">第12卷 · 一九二七年</p>
<br>
<div class="content">271021<sup>①</sup> 致江绍原</h3>

<p class="left">绍原先生：</p>

<p>两日不见，如隔六秋。</p>

<p>季茀<sup class="notelink"><a href="#m190">[190]</a></sup>有信来，先以奉阅。我想此事<sup class="notelink"><a href="#m191">[191]</a></sup>于兄相宜，因为与人斗争之事或较少。但不知薪水可真拿得到否耳。</p>

<p class="right">迅 顿首 <b>十月廿一日</b></p>

<p class="left">太太前乞叱名请安。</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[190] <b>季茀</b> 即许寿裳。时任南京国民政府大学院秘书。</p>
<p class="noteitem">[191] 指大学院院长蔡元培意欲聘鲁迅、江绍原等任该院特约撰述员。</p>
</div></div>
