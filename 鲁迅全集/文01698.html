<p class="title1">320423</p>
<p class="date">第12卷 · 一九三二年</p>
<br>
<div class="content">320423<sup>②</sup> 致台静农</h3>

<p class="left">静农兄：</p>

<p>久未问候，因先前之未名社中人，我已无一个知道住址了。社址大约已取消，无法可转。今日始在无意中得知 兄之住址，甚喜。有致霁野兄一笺，乞转寄为感。我年必逃走一次<sup class="notelink"><a href="#m33">[33]</a></sup>，但身体顽健如常，可释远念也。此上，即颂</p>

<p class="left">近祉。</p>

<p class="right">迅 上 <b>四月廿三夜</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[33] <b>年必逃走一次</b> 鲁迅于1930年3月因参加发起中国自由运动大同盟事被通缉，1931年1月因柔石等人被捕，1932年1月因一·二八事变，均曾离寓暂避。</p>
