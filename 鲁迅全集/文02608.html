<p class="title1">360528 致吴朗西</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content"><p class="left">朗西先生：</p>

<p>《版画》<sup class="notelink"><a href="#m241">[241]</a></sup>序校稿，已另封挂号寄上，请饬印刷局于照改后，打清样两份寄下，当将此清样贴在宣纸上，再行寄奉，然后照印也。</p>

<p>专此布达，即请</p>

<p class="left">日安。</p>

<p class="right">鲁迅 <b>五月二十八日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[241] <b>《版画》</b> 指《凯绥·珂勒惠支版画选集》。</p>
</div></div>
