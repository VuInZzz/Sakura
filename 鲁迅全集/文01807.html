<p class="title1">330619 致赵家璧</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content"><p class="left">家璧先生：</p>

<p>蒙惠书并赐《白纸黑字》一册，甚感。</p>

<p>兹奉上印证四千枚，以应有一收条见付。此上，即颂著祺。</p>

<p class="right">鲁迅 <b>六月十九日</b></p>
