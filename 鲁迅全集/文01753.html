<p class="title1">330116 致赵家璧</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content"><p class="left">家璧先生：</p>

<p>稿<sup class="notelink"><a href="#m16">[16]</a></sup>已校毕，今送上。其中还有些错字，应改正。但这回只要请尊处校对先生一看就可以，不必再寄给我了。此布，即请</p>

<p class="left">著安。</p>

<p class="right">鲁迅 上 <b>一月十六日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[16] 指《一天的工作》。</p>
