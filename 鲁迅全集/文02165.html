<p class="title1">341112</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">341112<sup>②</sup> 致徐懋庸</h3>

<p class="left">懋庸先生：</p>

<p>曹先生<sup class="notelink"><a href="#m583">[583]</a></sup>的住址，记不真切了，大约和先生只差三四号，附笺请代交去为感。</p>

<p>此托，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>十二日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[583] <b>曹先生</b> 指曹聚仁。当时住在上海金神父路花园坊（今瑞金二路129弄）107号。</p>
