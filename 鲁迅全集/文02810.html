<p class="title1">二</p>
<p class="date">第14卷 · 9 致端木蕻良</p>
<br>
<div class="content"><p>但肺病对于青年是险症；一到四十岁以上，它却不能怎样发展，因为身体组织老了，对于病菌的生活也不利的……五十岁以上的人，只要小心一点，带着肺病活十来年，并非难事，那时即使并非肺病，也得死掉了，所以不成问题的……</p>
