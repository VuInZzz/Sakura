<p class="title1">7 致刘</p>
<p class="date">第14卷</p>
<br>
<div class="content">7 致刘<img class="inline" alt="" src="./images/image06697.jpeg"/>鄂<sup class="notelink"><a href="#m16">[16]</a></sup></h3>

<p>木刻究竟是刻的绘画，所以基础仍在素描及远近，明暗法，这基础不打定，木刻也不会成功。</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[16] 此则据唐诃作《鲁迅先生和中国新兴木刻运动》一文（载1936年北平中国大学《文艺动态》创刊号）所引编入。据鲁迅日记，此信当写于1934年3月22日。<b>刘<img class="inline" alt="" src="./images/image06697.jpeg"/>鄂</b>（1913—1938），刘<img class="inline" alt="" src="./images/image06697.jpeg"/>，字<img class="inline" alt="" src="./images/image06698.jpeg"/>鄂，河南信阳人。当时是上海美术专科学校学生。</p>
