<p class="title1">341006</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">341006<sup>①</sup> 致何白涛</h3>

<p class="left">白涛先生：</p>

<p>《木刻纪程》已印出，即托书店寄奉四本，不知已收到否？此次付印，颇费心力，经费亦巨，而成绩并不好，颇觉懊丧。第二本能否继续，不可知矣。</p>

<p>木版亦当于数日内作小包寄还，至希检收。铁耕兄之两块，亦附在内的。</p>

<p>专此布达，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>十月六日</b></p>

</div>
