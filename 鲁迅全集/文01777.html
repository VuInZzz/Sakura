<p class="title1">330322 致姚克</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content"><p class="left">姚克先生：</p>

<p>来信收到。廿四日我于晚六时起有事情，但想来两个钟头也够谈的了。我于上海路很不熟，所以极希望 先生于是日三点半到内山书店来，一同前去<sup class="notelink"><a href="#m82">[82]</a></sup>。此复，即颂</p>

<p class="left">文安。</p>

<p class="right">鲁迅 上 <b>三月廿二日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[82] 鲁迅1933年3月24日日记：“下午姚克邀往蒲石路访客兰恩夫人。”</p>
