<p class="title1">340328</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">340328<sup>①</sup> 致许寿裳<sup class="notelink"><a href="#m142">[142]</a></sup></h3>

<p class="left">季巿兄：</p>

<p>久未闻消息，想一切康适为念。</p>

<p>《笺谱》<sup class="notelink"><a href="#m143">[143]</a></sup>已印成，留一部在此，未知何时返禾<sup class="notelink"><a href="#m144">[144]</a></sup>，尔时希见过为幸。</p>

<p>此布，即颂</p>

<p class="left">曼福。</p>

<p class="right"><b>弟</b>飞 顿首 <b>三月廿八夜</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[142] 此信据许寿裳亲属录寄副本编入。</p>
<p class="noteitem">[143] <b>《笺谱》</b> 即《北平笺谱》。</p>
<p class="noteitem">[144] <b>禾</b> 即浙江嘉兴。</p>
