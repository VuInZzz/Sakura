<p class="title1">351104</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">351104<sup>①</sup> 致郑振铎</h3>

<p class="left">西谛先生：</p>

<p>拟印之稿件<sup class="notelink"><a href="#m564">[564]</a></sup>已编好，第一部纯为关于文学之论文，约三十余万字，可先付排。</p>

<p>简单的办法，我想先生可指定一时间和地点（如书店或印刷所），在那里等候，我当挟稿届时前往，一同付与印刷者，并接洽校对的办法。</p>

<p>但指定之信发出时，希比指定之日期早三四天，以免我接到来信时，已在所约的日期之后也。</p>

<p>专此布达，即请</p>

<p class="left">撰安。</p>

<p class="right">迅 顿首 <b>十一月四日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[564] 指《海上述林》。</p>
