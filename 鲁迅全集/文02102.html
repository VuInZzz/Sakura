<p class="title1">340812</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">340812<sup>②</sup> 致李小峰</h3>

<p class="left">小峰兄：</p>

<p>关于半农的文章，写了这一点，今呈上。</p>

<p>作者的署名，现在很有些人要求我用旧笔名，或者是没有什么大关系了。但我不明白底细，请 兄酌定。改用唐俟亦可。</p>

<p>此布即颂</p>

<p class="left">时绥</p>

<p class="right">迅 上 <b>八月十二日</b></p>
