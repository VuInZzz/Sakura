<p class="title1">330420</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content">330420<sup>②</sup> 致李小峰</h3>

<p class="left">小峰兄：</p>

<p>《杂感选集》的格式，本已用红笔批了大半，后来一想，此书有十七万余字（连序一万五千在内），若用每版十二行，行卅六字印，当有四百余页，未免太厚，不便于翻阅。所以我想不如改为横行，格式全照《两地书》，则不到三百页可了事，也好看。不知兄以为何如，俟 示办理。此上，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 启上 <b>四月二十晚。</b></p>
