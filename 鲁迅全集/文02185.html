<p class="title1">341205</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">341205<sup>③</sup> 致杨霁云</h3>

<p class="left">霁云先生：</p>

<p>顷奉到四日信，始知已在上海。七日（星期五）午后二时，希惠临书店，当在其地奉候，并携交 先生所要之《北平笺谱》及《木刻纪程》。</p>

<p>欲将删遗的文字付印，倘不至于对不住读者，本人却无异议。如不急急，亦可自校一遍，惟近几日却难，因生病将近一月，尚无力气也。</p>

<p>专此布复，即请</p>

<p class="left">文安。</p>

<p class="right">迅 顿首 <b>十二月五夜。</b></p>

</div>
