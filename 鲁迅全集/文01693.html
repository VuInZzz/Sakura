<p class="title1">320406 致李小峰</p>
<p class="date">第12卷 · 一九三二年</p>
<br>
<div class="content"><p class="left">小峰兄：</p>

<p>搬回后已两星期余，虽略失窃，而损失殊有限，亦无甚不便，但买小菜须远行耳。</p>

<p>因颇拮据，故本月版税，希见付。或送来，或函知日时地点，走取亦可。折子并希结算清楚，一并交下为荷。</p>

<p class="right">迅 上 <b>四月六日</b></p>
