<p class="title1">350328 致郑振铎</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content"><p class="left">西谛先生：</p>

<p>得北归消息后，即奉一函，寄海甸<sup class="notelink"><a href="#m226">[226]</a></sup>，想已达。兹寄上印画等款项百五十元，请便中一取，并转付。画<sup class="notelink"><a href="#m227">[227]</a></sup>印成后，乞每种各寄下一幅，当排定次序，并序文纸板，寄上，仍乞费神付装订也。</p>

<p>《世界文库》新办法，书店方面仍无消息来。</p>

<p>专此布达，并颂</p>

<p class="left">著安。</p>

<p class="right">迅 顿首 <b>三月二十八日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[226] <b>海甸</b> 北京西郊的地名，当时燕京大学所在地。</p>
<p class="noteitem">[227] 指《博古页子》。</p>
