<p class="title1">360215</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">360215<sup>①</sup> 致母亲</h3>

<p>母亲大人膝下，敬禀者，有答善先的一封信附上，请便中转交。上海这几天暖起来了，我们都很好，男仍忙，但身体却好，可请勿念。</p>

<p>海婴已上学，不过近地的幼稚园，因为学生少，似乎未免模模糊糊，不大认真。秋天也许要另换地方的。</p>

<p>紫佩生日，送了十元礼，他写信来客气了一通。</p>

<p>余容后禀，专此，恭请</p>

<p class="left">金安。</p>

<p class="right"><b>男</b>树 叩上 广平海婴同叩 <b>二月十五日</b></p>

</div>
