<p class="title1">321113</p>
<p class="date">第12卷 · 一九三二年</p>
<br>
<div class="content">321113<sup>①</sup> 致许广平</h3>

<p class="left">乖姑：</p>

<p>我已于十三日午后二时到家<sup class="notelink"><a href="#m130">[130]</a></sup>，路上一切平安，眠食有加。</p>

<p>母亲是好的，看起来不要紧。自始至现在，止看了两回医生，我想于明天再请来看看。</p>

<p>你及海婴好吗，为念。</p>

<p class="right">迅 上 <b>十一月十三下午</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[130] <b>到家</b> 指回到北平旧寓，鲁迅此去为探望母病。</p>
