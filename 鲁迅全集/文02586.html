<p class="title1">360424</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">360424<sup>③</sup> 致吴朗西<sup class="notelink"><a href="#m199">[199]</a></sup></h3>

<p class="left">朗西先生：</p>

<p>昨日内山谈起，《死魂灵百图》初出时，他就面托送书的人，要二十部，至今没有送给他云云。我想这一定是那人忘记了。便中送给他罢。</p>

<p>专布，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>四月廿四夜。</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[199] <b>吴朗西</b>（1904—1992） 四川开县人，翻译工作者。当时任文化生活出版社经理。</p>
