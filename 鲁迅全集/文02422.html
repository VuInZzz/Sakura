<p class="title1">350908</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350908<sup>④</sup> 致徐懋庸</h3>

<p class="left">徐先生：</p>

<p>午后寄出一信后，往书店定书，他们查账，则已早有一部<sup class="notelink"><a href="#m480">[480]</a></sup>（二本？）送交新生活书店的陈先生收了，只名字不同，疑是名和字之分，而其实却是一人。所以当时并未定实，希查复后，再定。</p>

<p>附上稿费收据三张，为印刷之用，<sup class="notelink"><a href="#m481">[481]</a></sup>乞便中往店一取为感。</p>

<p>此布即颂</p>

<p class="left">时绥。</p>

<p class="right">豫 上 <b>九月八日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[480] 指《蒙田随想录》。</p>
<p class="noteitem">[481] 此系鲁迅给“左联”机关刊物《文艺群众》的捐款。</p>
