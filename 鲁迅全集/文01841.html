<p class="title1">330908 致开明书店</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content"><p>径启者：未名社之第三期款项，本月中旬似已到期，该社</p>

<p>亦已将收条寄来，但仍未填准确日期及数目。仍希</p>

<p>贵店一查见示，以便填入，如期领取为荷。</p>

<p>此请</p>

<p class="left">开明书店大鉴。</p>

<p class="right">鲁迅 启 <b>九月八日</b></p>

<p>回函仍寄</p>

<p>北四川路底，内山书店转周豫才收。 又及。</p>

</div>
