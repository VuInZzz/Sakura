<p class="title1">331220</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content">331220<sup>②</sup> 致郑野夫<sup class="notelink"><a href="#m470">[470]</a></sup></h3>

<p class="left">野夫先生：</p>

<p>木刻作品，我想选取五十种，明年付印是真的，无论如何，此事一定要做。</p>

<p>《水灾》<sup class="notelink"><a href="#m471">[471]</a></sup>能否出版，此刻不容易推测，大约怕未必有书店敢收受罢。但如已刻成，不妨去试问一下。此颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>十二月廿日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[470] <b>郑野夫</b>（1909—1973） 原名郑诚芝，浙江乐清人。曾在上海美术专科学校学习，并参加木刻艺术团体“一八艺社”及“野风画会”。</p>
<p class="noteitem">[471] <b>《水灾》</b> 木刻画，郑野夫作。</p>
