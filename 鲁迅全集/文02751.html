<p class="title1">341111（日） 致内山完造</p>
<p class="date">第14卷 · 致外国人士部分</p>
<br>
<div class="content"><p class="block">昨晚、熱が出てうごくかがない。疲瘆の爲めだろーと思ひます。</p>

<p class="block">須藤先生に今日の午後に診察にいらしゃって下さる様に賴して下さい。</p>

<p class="block1">L 上<b>〔十一月十一日〕</b></p>

<p class="left">内山先生几下</p>

<p class="left"><b>[译文]</b></p>

<p>昨晚发烧，不能行动。想系疲劳所致。拜托你请须藤先生于今日午后来为诊视。</p>

<p class="right">L 上<b>〔十一月十一日〕</b></p>

<p class="left">内山先生几下</p>
