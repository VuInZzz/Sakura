<p class="date">第13卷 · 一九三四年</p>

<div class="content">341009<sup>①</sup> 致罗清桢</h3>

<p class="left">清桢先生：</p>

<p>有复张慧先生一信，而忘其确实之通信地址，乞费神转寄，不胜感荷。</p>

<p>此布，即请</p>

<p class="left">秋安。</p>

<p class="right">迅 上 <b>十月九日</b></p>
