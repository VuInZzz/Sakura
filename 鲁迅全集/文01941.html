<p class="title1">340212 致姚克</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">姚克先生：</p>

<p>昨方寄一函（第一），想已到。顷接第四号信，备悉一切。Sakamoto（=坂本）系领事馆情报处人员，其实也可以说是一种广义的侦探，不必与之通信，或简直不必以通信地址告之也。</p>

<p>上海已颇温暖，我们均好，请释念。</p>

<p>此复即颂</p>

<p class="left">时绥。</p>

<p class="right">豫 顿首 <b>二月十二夜</b></p>

</div>
