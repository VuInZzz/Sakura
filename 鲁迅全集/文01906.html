<p class="title1">331219</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content">331219<sup>②</sup> 致吴渤</h3>

<p class="left">吴渤先生：</p>

<p>木刻一卷并信，已收到。</p>

<p>某女士<sup class="notelink"><a href="#m440">[440]</a></sup>系法国期刊《Vu》的记者，听说她已在上海，但我未见，大约她找我不到，我也无法找她。倘使终于遇不到，我可以将木刻直接寄到那边去的。</p>

<p>此复，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>十二，十九。</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[440] <b>某女士</b> 指绮达·谭丽德。</p>
