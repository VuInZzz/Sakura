<p class="title1">350901</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350901<sup>②</sup> 致赵家璧</h3>

<p class="left">家璧先生：</p>

<p>今日下午，知《新小说》已决停刊，且闻郑君平先生亦既[？]离开公司。我曾代寄萧军作《军中》一篇，且已听得编入“革新”后一期中，今既停止，当然无用，可否请先生代为一查，抽出寄下，使我对于作者，可以有一交代，不胜感幸。</p>

<p>专此布达，并请</p>

<p class="left">撰安。</p>

<p class="right">鲁迅 上 <b>九月一夜。</b></p>

</div>
