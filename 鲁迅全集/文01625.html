<p class="title1">291110 致陈君涵</p>
<p class="date">第12卷 · 一九二九年</p>
<br>
<div class="content"><p class="left">君涵先生：</p>

<p>前天才收到来信。那一篇《鬼沼》<sup class="notelink"><a href="#m137">[137]</a></sup>译本，询问数处，均未能出版。因为不知道 先生那时的回乡，是暑假还是毕业，所以不敢乱寄。今得来信，知仍在南京，午后已挂号寄上了，到希 察收。延搁多日，歉甚歉甚。</p>

<p class="right">鲁迅 <b>十一月十日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[137] <b>《鬼沼》</b> 通译《魔沼》，中篇小说，法国女作家乔治·桑著。</p>
