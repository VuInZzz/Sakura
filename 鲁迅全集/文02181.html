<p class="title1">341202 致郑振铎</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">西谛先生：</p>

<p>装好之《清人杂剧》二集早收到，感谢之至。</p>

<p>《十竹斋笺谱》内山豫约二十部，我要十部，共希留下三十部为感。</p>

<p>底本<sup class="notelink"><a href="#m605">[605]</a></sup>如能借出，我想，明年一年中，出老莲画集一部，更以全力完成《笺谱》，已有大勋劳于天下矣。</p>

<p>专此布达，即请</p>

<p class="left">撰安。</p>

<p class="right">迅 顿首 <b>十二月二夜。</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[605] <b>底本</b> 指周子兢所藏的《水浒叶子》。</p>
</div></div>
