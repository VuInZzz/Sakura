<p class="title1">340414 致黎烈文</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">烈文先生：</p>

<p>顷收到十三日函并原稿六篇，费神甚感。“此公”是先生之同乡，年未“而立”，看文章，虽若世故颇深，实则多从书本或推想而得，于实际上之各种困难，亲历者不多。对于投稿之偶有删改，已曾加以解释，想不至有所误解也。</p>

<p>日前又收到一篇，今附上。</p>

<p>此布，即请</p>

<p class="left">道安。</p>

<p class="right">迅 顿首 <b>四月十四日</b></p>

</div>
