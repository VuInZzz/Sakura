<p class="title1">341119</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">341119<sup>①</sup> 致金性尧<sup class="notelink"><a href="#m593">[593]</a></sup></h3>

<p class="left">惟[<b>性</b>]尧先生：</p>

<p>惠函收到。但面谈一节，在时间和环境上，颇不容易，因为敝寓不能招待来客，而在书店约人会晤，则虽不过平常晤谈，也会引人疑是有什么重要事件的，因此我只好竭力少见人，尚希谅察为幸。</p>

<p>专此布复，并颂</p>

<p class="left">时绥。</p>

<p class="right">鲁迅 十一月十九日</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[593] <b>金性尧</b> 笔名文载道，浙江定海人，当时在上海中华煤球公司当文书。</p>
