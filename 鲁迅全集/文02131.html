<p class="title1">341009</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">341009<sup>②</sup> 致张慧</h3>

<p class="left">张慧先生：</p>

<p>蒙赐函及木刻，甚感。拜观各幅，部分尽有佳处，但以全体而言，却均不免有未能一律者。如《乞丐》，树及狗皆与全图不相称，且又不见道路，以致难云完全。弟非画家，不敢妄说，惟以意度之，木刻当亦与绘画无异，基本仍在素描，且画面必须统一也。</p>

<p>专此布复，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>十月九日</b></p>

</div>
