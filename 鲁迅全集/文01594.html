<p class="title1">290528 致陶冶公</p>
<p class="date">第12卷 · 一九二九年</p>
<br>
<div class="content">290528 致陶冶公<sup class="notelink"><a href="#m70">[70]</a></sup></h3>

<p class="block">明日已约定赴北大讲演，后日须赴西山，<sup class="notelink"><a href="#m71">[71]</a></sup>此后便须南返，盛意只得谨以心领矣。</p>

<p class="block">望潮兄</p>

<p class="right">周树人 上 <b>廿八日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[70] 此信写于印有周树人三字的名片上。</p>
<p class="noteitem">[71] <b>赴北大讲演</b> 1929年5月29日，鲁迅应北京大学国文学会之邀，往该校第二院（后改在第三院）演讲，讲稿佚。<b>赴西山</b>，指赴西山疗养院探视韦素园。</p>
