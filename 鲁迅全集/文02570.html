<p class="title1">360403 致费慎祥</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content"><p class="left">慎祥兄：</p>

<p>昨天的《申报》上有个出让《四部丛刊》的广告，今附上，<sup class="notelink"><a href="#m160">[160]</a></sup>请 兄去看一看。如合于下列四种条件，希即通知，同去商量购买。</p>

<p>一、完全；二、白纸印的；</p>

<p>三、很新；四、价（连箱）在四百元以下。</p>

<p>如有一条不合，便作罢论。</p>

<p>专此布达，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>四月三日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[160] 所附广告剪报文为：“初编四部丛刊出让 2112册书本均新配有最富丽书柜四个愿廉价出让接洽处威海卫路583弄21号”。</p>
