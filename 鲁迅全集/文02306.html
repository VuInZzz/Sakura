<p class="title1">350326</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350326<sup>①</sup> 致黄源</h3>

<p class="left">河清先生：</p>

<p>小说译稿<sup class="notelink"><a href="#m225">[225]</a></sup>已取回，希便中莅寓一取，但亦不必特别苦心孤诣，设法回避吃饭也。</p>

<p>专此布达，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>三月廿六日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[225] <b>小说译稿</b> 指鲁迅所译西班牙巴罗哈的短篇小说《促狭鬼莱哥羌台奇》，载《新小说》第一卷第三期（1935年4月），后收入《山民牧唱》。</p>
