<p class="title1">330115 致李小峰</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content"><p class="left">小峰兄：</p>

<p>昨交上《两地书》稿上半，是横排的，我想此书不必与《呐喊》等一律。但版式恐怕不宜太小，因为一小，则本子就太厚，不成样子了。总之，以怎样大为好看，请兄酌定就是。</p>

<p>后半还在抄，大约须二月初（阳历）才完。</p>

<p>印的时候，我想用较好的纸，另印一百本，自备经费。纸用黄的，如北新有纸样，希便中带下一看，印后也不必装订，只要托装订局叠好，由我自己去订去。</p>

<p class="right">迅 上 <b>一月十五日</b></p>
