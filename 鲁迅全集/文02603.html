<p class="title1">360518</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">360518<sup>②</sup> 致吴朗西</h3>

<p class="left">朗西先生：</p>

<p>校样收到。未见纸板，不知已打否？如未打，有三处要改正，改后再打。如已打好，那就算了。希将纸板交下。</p>

<p>宣纸于今日托纸铺送上。但校样大约还得改几回。</p>

<p>专此布达，即请</p>

<p class="left">日安。</p>

<p class="right">鲁迅 上 <b>五月十八日</b></p>

</div>
