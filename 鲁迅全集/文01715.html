<p class="title1">320805 致李霁野、台静农、韦丛芜</p>
<p class="date">第12卷 · 一九三二年</p>
<br>
<div class="content"><p><img class="inline" alt="" src="./images/image06601.jpeg"/>：</p>

<p>顷收到八月二日来信，知道素园兄已于一日早晨逝世，这使我非常哀痛，我是以为我们还可以见面的，春末曾想一归北平，还想到仍坐汽车到西山去，而现在是完了。</p>

<p>说起信来，我非常抱歉。他原有几封信在我这里，很有发表的价值的，但去年春初我离开寓所时，防信为别人所得，使朋友麻烦，所以将一切朋友的信全都烧掉了，至今还是随得随毁，什么也没有存着。</p>

<p>我现在只好希望你们格外保重。</p>

<p class="right">迅 上 <b>八月五日</b></p>
