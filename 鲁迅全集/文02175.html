<p class="title1">341124 致金性尧</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">惟[<b>性</b>]尧先生：</p>

<p>来信早收到。在中国做人，一向是很难的，不过现在要算最难，我先前没有经验过。有些“文学家”，今年都做了检查官了，你想，变得快不快。</p>

<p>《新语林》上的关于照相的一篇文章<sup class="notelink"><a href="#m598">[598]</a></sup>，是我做的。公汗也是我的一个化名，但文章有时被检查官删去，弄得有头没尾，不成样子了。</p>

<p>此复，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>十一月廿四日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[598] 即《从孩子的照相说起》，后收入《且介亭杂文》。</p>
