<p class="title1">360523</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">360523<sup>①</sup> 致赵家璧</h3>

<p class="left">家璧先生：</p>

<p>顷得惠函，并书报，谢谢。</p>

<p>发热已近十日，不能外出；今日医生始调查热型，那么，可见连什么病也还未能断定。何时能好，此刻更无从说起了。</p>

<p>《版画》<sup class="notelink"><a href="#m238">[238]</a></sup>如不久印成，那么，在做序之前，只好送给书店，再转给我看一看。假使那时我还能写字，序也还是做的。</p>

<p>专此布复，即请</p>

<p class="left">撰安。</p>

<p class="right">鲁迅 <b>五月廿三日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[238] <b>《版画》</b> 指《苏联版画集》。</p>
