<p class="title1">360223 致萧军</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content"><p class="left">刘兄：</p>

<p>义军的事情<sup class="notelink"><a href="#m94">[94]</a></sup>，急于应用，等通信恐怕来不及，所以请你把过去二三年中的经过（用回忆记的形式就好），撮要述给他们，<span class="u">愈快愈好</span>，可先写给一二千字，余续写。</p>

<p>见胡风时，望转告：那一篇文章，是写给外国人看的，只记事，不发议论，二三千字就够，但要快。</p>

<p class="right">迅 上 <b>二月二十三日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[94] 指萧军为英文刊物《中国呼声》撰写的《东北义勇军》，后载该刊第一卷第六期（1936年6月1日）。</p>
