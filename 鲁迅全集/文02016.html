<p class="title1">340518</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">340518<sup>①</sup> 致陶亢德</h3>

<p class="left">亢德先生：</p>

<p>惠示谨悉，蒙设法询嘉业堂书买法，甚感。以敝“指谬”拖为“古香斋”尾巴，自无不可，但署名希改为“中头”，倘嫌太俳，则“準”亦可。《论语》虽先生所编，但究属盛家赘婿<sup class="notelink"><a href="#m277">[277]</a></sup>商品，故殊不愿与之太有瓜葛也。</p>

<p>专此布复，即请</p>

<p class="left">文安。</p>

<p class="right">迅 上 <b>五月十八日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[277] <b>盛家赘婿</b> 指邵洵美，《论语》半月刊当时系由他开办的时代图书印刷公司发行。</p>
