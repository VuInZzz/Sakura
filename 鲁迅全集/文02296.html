<p class="title1">350317</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350317<sup>②</sup> 致黄源</h3>

<p class="left">河清先生：</p>

<p>上午寄上一函，想已达。今寄上“论坛”两篇，译稿一篇<sup class="notelink"><a href="#m211">[211]</a></sup>，希察收。</p>

<p>其《死魂灵》译稿，原拟同寄，但下午又闻《世界文库》是否照原定计画印行，尚在不可知之数，故暂且不寄，也乐得省去一点邮票也。</p>

<p>专此布达，并颂</p>

<p class="left">春祺。</p>

<p class="right">迅 上 <b>三月十七夜</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[211] 指金人所译左琴科的《少年维特之烦恼》。</p>
