<p class="title1">360330 致姚克</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content"><p class="left">莘农先生：</p>

<p>蒙见访的那天，即得惠函，因为琐务，未即奉答为歉。</p>

<p>那本书的目录很好，但每篇各摘少许，是美国书的通病。翻译起来，还是全照原样，不加增补的好；否则，问题便多起来。不过出版处恐不易得。</p>

<p>答 E君信<sup class="notelink"><a href="#m139">[139]</a></sup>，附上信稿并来信，，乞便中一译，掷下，至感至感。</p>

<p>《毁灭》已由书店取来，当俟便呈上。</p>

<p>专此布达，并请</p>

<p class="left">著安。</p>

<p class="right">迅 顿首 <b>三月卅日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[139] <b>答 E君信</b> 即360330（德）致艾丁格尔信。</p>
