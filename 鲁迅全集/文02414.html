<p class="title1">350831</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350831<sup>②</sup> 致母亲</h3>

<p>母亲大人膝下，敬禀者，八月十日来示，早已收到，写给海婴的信，也收到了。</p>

<p>上海天气已渐凉，夜间可盖夹被，男痱子已愈，而仍颇忙，但身体尚好；害马亦好，均可请释念。海婴亦好，但变成瘦长了。从二十日起，已将他送进幼稚园去，地址很近，每日关他半天，使家中可以清静一点而已。直到现在，他每天都很愿意去，还未赖学也。</p>

<p>专此布达，恭请</p>

<p class="left">金安。</p>

<p class="right"><b>男</b>树 叩上 广平及海婴同叩 <b>八月卅一日</b></p>
