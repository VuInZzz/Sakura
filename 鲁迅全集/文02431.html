<p class="title1">350919</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350919<sup>①</sup> 致曹靖华</h3>

<p class="left">汝珍兄：</p>

<p>久未得来信，想起居俱佳。</p>

<p>七月份应结算之良友公司版税，至昨天才得取来，兄应得二十五元，今汇上，请便中赴分馆一取。</p>

<p>半年之中，据云卖去五百本<sup class="notelink"><a href="#m518">[518]</a></sup>，其实是也许更多的，但他们只随便给作者一点，营业一坏，品格也随之而低。九月在卖半价，明年倘收版税，也要折半了。</p>

<p>我们都好的，请勿念。</p>

<p>专此布达，即请</p>

<p class="left">文安。</p>

<p class="right"><b>弟</b>豫 上 <b>九月十九日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[518] 指《星花》。</p>
</div></div>
