<p class="title1">260913 致许广平</p>
<p class="date">第11卷 · 一九二六年</p>
<br>
<div class="content">260913 致许广平<sup class="notelink"><a href="#m593">[593]</a></sup></h4>

<p>（明信片背面）</p>

<p>从后面（南普陀）所照的厦门大学全景。</p>

<p>前面是海，对面是鼓浪屿。</p>

<p>最右边的是生物学院与国学院，第三层楼上有*记的便是我所住的地方。</p>

<p>昨夜发飓风，拔木发屋，但我没有受损害。</p>

<p class="right">迅 九，十一。</p>

<p>（明信片正面）</p>

<p>想已到校；已开课否？此地二十日上课。</p>

<p class="right">十三日</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
