<p class="title1">290309 致章廷谦</p>
<p class="date">第12卷 · 一九二九年</p>
<br>
<div class="content"><p class="left">矛尘兄：</p>

<p>久违了。这回是要托你仍在“翁隆盛”买三斤茶，计开：——</p>

<p>上上贡龙　　一斤　　二元二角四分</p>

<p>龙井雨前　　一斤　　一元三角六分</p>

<p>龙井芽茶　　一斤　　一元二角</p>

<p>但这回恐怕未必这样凑巧，马巽伯又要到上海来，由他拎到寓所。我想，该茶叶店如也可以代寄，那就托他们代寄罢。否则，如无便人，托你付邮。</p>

<p class="right">迅 上 <b>三月九日</b></p>

<p>斐君兄均此致候。</p>

</div>
