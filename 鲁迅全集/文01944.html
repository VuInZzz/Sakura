<p class="title1">340217 致黎烈文</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">烈文先生：</p>

<p>“古历”元旦前后，陆续寄奉“此公”<sup class="notelink"><a href="#m70">[70]</a></sup>短评数篇，而开年第一次，竟将拙作<sup class="notelink"><a href="#m71">[71]</a></sup>取列第一，不胜感幸。但文中似亦雕去不少，以至短如胡羊尾巴，未尝留稿，自亦不复省记是何谬论，倘原稿尚在，希检还以便补入，因将来尚可重编卖钱也。此布即请道安。</p>

<p class="right">迅 顿首 <b>二月十七日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[70] “<b>此公</b>” 指徐诗荃。</p>
<p class="noteitem">[71] 指《过年》，后收入《花边文学》。</p>
</div></div>
