<p class="title1">四</p>
<p class="date">第14卷 · 4 致刘岘</p>
<br>
<div class="content"><p>欧洲木刻，在十九世纪中叶，原是画者一人，刻者又是一人，自画自刻，仅是近来的事。现在来刻别人的画，自然无所不可。但须有一目的：或为了使其画流的更广；或于原画之外，加以雕刀之特长。</p>
