<p class="title1">340112 致台静农</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">静农兄：</p>

<p>《北平笺谱》大约已将订成，兄所要之一部，已函西谛兄在北平交出，另一部则托其交与天行兄，希就近接洽。这两部都是我送的，无须付钱。倘天行兄已豫约，则可要求西谛退款，豫约而不得者尚有人，他毫不为难也。专此，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 顿首 <b>一月十二日</b></p>

<p>我们都好的。 又及</p>
