<p class="title1">340930 致黎烈文</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">烈文先生：</p>

<p>日译法朗士小说一本及肚围二枚，已于一星期前送往申报馆，托梓生转交。昨晚始知道 先生并不常到馆去，然则函件不知梓生已为设法转致否？殊念。如未收到，希往馆一问为幸。</p>

<p>专此布达，即请</p>

<p class="left">道安。</p>

<p class="right">迅 顿首 <b>九月卅夜。</b></p>

</div>
