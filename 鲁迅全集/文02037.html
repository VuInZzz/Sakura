<p class="title1">340531</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">340531<sup>①</sup> 致郑振铎</h3>

<p class="left">西谛先生：</p>

<p>前几日寄上《引玉集》一本，想已达。</p>

<p>拙文<sup class="notelink"><a href="#m328">[328]</a></sup>附上，真是“拙”极，已经退化，于此可见，倘能厕“散文随笔”之末，则幸甚矣。</p>

<p>专此布达，即请</p>

<p class="left">道安</p>

<p class="right">迅 顿首 <b>五月卅一日</b></p>

<p>近正在收集中国新作家之木刻，拟以二十幅印成一本，名之曰《木刻纪程》，存案，以觇此后之进步与否。 又及。</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[328] 即《看图识字》。刊登于1934年7月1日出版的《文学季刊》第一卷第三期“散文随笔”专栏。</p>
