<p class="title1">330420</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content">330420<sup>①</sup> 致姚克</h3>

<p class="left">莘农先生：</p>

<p>昨奉一柬，约于星期六（二十二日）下午六时驾临大马路石路知味观杭菜馆第七座一谈，未知已到否？届时务希与令弟<sup class="notelink"><a href="#m89">[89]</a></sup>一同惠临为幸。专此布达，顺请</p>

<p class="left">文安。</p>

<p class="right">迅 启上 <b>四月二十日下午</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[89] <b>令弟</b> 即姚志曾，字省吾，浙江余杭人。当时是上海东吴大学学生，后在上海中国实业银行任职，曾为鲁迅和在北平的姚克转递信件。</p>
