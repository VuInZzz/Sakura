<p class="title1">260225 致许寿裳</p>
<p class="date">第11卷 · 一九二六年</p>
<br>
<div class="content"><p class="left">季巿兄：</p>

<p>昨得洙邻<sup class="notelink"><a href="#m547">[547]</a></sup>兄函，言：“案<sup class="notelink"><a href="#m548">[548]</a></sup>已于昨日开会通过完全胜利大约办稿呈报得批登公报约尚须两星期也”云云。特以奉闻，并希以电话告知幼渔兄为托。</p>

<p class="right">树人 二月二十五日</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[547] <b>洙邻</b> 寿鹏飞（1873—1961），字洙邻，浙江绍兴人。鲁迅塾师寿镜吾次子。当时在平政院任记录科主任兼文牍科办事书记。</p>
<p class="noteitem">[548] 指鲁迅在平政院控告章士钊非法免佥事职一事。</p>
</div></div>
