<p class="title1">331206</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content">331206<sup>①</sup> 致陈铁耕</h3>

<p class="left">铁耕先生：</p>

<p>前日寄上一函，想已到。今有复吴先生<sup class="notelink"><a href="#m433">[433]</a></sup>一信，乞即转寄为感。此颂</p>

<p class="left">文祺。</p>

<p class="right">迅 上 <b>十二月六日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[433] <b>吴先生</b> 指吴渤，参看331109信注〔1〕。</p>
