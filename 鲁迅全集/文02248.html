<p class="title1">350121</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350121<sup>①</sup> 致赵家璧</h3>

<p class="left">家璧先生：</p>

<p>《尼采自传》的译者，昨天已经看见过，他说，他的译本，是可以放在丛书<sup class="notelink"><a href="#m68">[68]</a></sup>里面的。</p>

<p>特此奉告，并请</p>

<p class="left">撰安。</p>

<p class="right">迅 上 <b>一月二十一日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[68] 指《良友文库》。</p>
