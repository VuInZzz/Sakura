<p class="title1">360114 致萧军</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content"><p class="left">刘军兄：</p>

<p>曹<sup class="notelink"><a href="#m19">[19]</a></sup>有信来，今转上。你的旧诗比新诗好，但有些地方有名士气。我在编集去年的杂感<sup class="notelink"><a href="#m20">[20]</a></sup>，想出版。</p>

<p>我们想在旧历年内，邀些人吃一回饭。一俟计画布置妥帖，当通知也。</p>

<p>专此布达，并贺</p>

<p class="left">年禧。</p>

<p class="right">豫 上 <b>一月十四日</b></p>

<p>太太均此请安。</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[19] <b>曹</b> 指曹聚仁。</p>
<p class="noteitem">[20] 指《且介亭杂文二集》。</p>
