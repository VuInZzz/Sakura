<p class="date">第6卷 · 一九三五年</p>
<br>
<div class="content"><img class="inline" alt="" src="./images/image05796.jpeg"/>田诚一墓记<sup class="notelink"><a href="#m211">[211]</a></sup></h4>

<p>君以一九三〇年三月至沪，出纳图书，既勤且谨，兼修绘事，斐然有成。中遭艰巨，笃行靡改，扶危济急，公私两全。越三三年七月，因病归国休养，方期再造，展其英才，而药石无灵，终以不起，年仅二十有八。呜呼，昊天难测，蕙荃早摧，晔晔青春，永<img class="inline" alt="" src="./images/image05797.jpeg"/>玄壤，忝居友列，衔哀记焉。</p>

<p>一九三五年四月二十二日，会稽鲁迅撰。</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[211] 本篇在收入本书前未在报刊上发表过。<br/><b><img class="inline" alt="" src="./images/image05796.jpeg"/>田诚一</b>（1905—1934），日本人，内山书店职员。参看本书《后记》。</p>
