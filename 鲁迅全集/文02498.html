<p class="title1">351224 致谢六逸</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content"><p class="left">六逸先生：</p>

<p>惠示诵悉。看近来稍稍直说的报章，天窗满纸，华北虽然脱体<sup class="notelink"><a href="#m648">[648]</a></sup>，华南却仍旧箝口可知，与其吞吞吐吐以冀发表而仍不达意，还不如一字不说之痛快也。</p>

<p>专此布复，并请</p>

<p class="left">撰安</p>

<p class="right">鲁迅 顿首 <b>十二月廿四日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[648] <b>华北脱体</b> 参看351203<sup>③</sup>信注〔1〕。</p>
