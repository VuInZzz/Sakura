<p class="title1">340721 致徐懋庸</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">懋庸先生：</p>

<p>顷得某君信，谓前寄我之克女士德文稿一篇<sup class="notelink"><a href="#m437">[437]</a></sup>，今以投《新语林》，嘱我译出，或即以原文转寄，由 先生另觅人翻译云云。我德文既不好，手头又无一本字典，无法可想，只得以原文转寄，希察收。</p>

<p>又新得闲斋文一篇，似尚可用，一并寄呈。</p>

<p>此布，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>七月二十一日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[437] 指《睡着了的上海》，莉莉·珂贝作，惠天译，载《新语林》第四期（1934年8月20日）。</p>
