<p class="title1">350818 致赖少麒</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content"><p class="left">少麒先生：</p>

<p>十一日信收到。我没有收到插图，所以并没有送到商务馆去。书店里好像也没有。究竟是怎么一回事，还是请 先生先写信问一问您的朋友罢。</p>

<p>专复，即请</p>

<p class="left">时绥。</p>

<p class="right">干 上 <b>八月十八日</b></p>

</div>
