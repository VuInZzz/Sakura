<p class="title1">351018 致母亲</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content"><p>母亲大人膝下敬禀者，十月十一日来信，早已收到，藉知 大人一切安好，甚慰。上海寓中亦均安好，但因忙于翻译，且亦并无要事，所以不常寄信。</p>

<p>海婴亦好，他只是长起来，却不胖。已上幼稚园，但有时也要赖学，有时却急于要去；爱穿洋服，与<b>男</b>之衣服随便者不同。今天，下门牙活动，要换牙齿了。</p>

<p>上海晴天尚暖，阴天则夹袄已觉不够，市面景象，年不如年，和<b>男</b>初到时大两样了。</p>

<p>专此布复，恭叩</p>

<p class="left">金安。</p>

<p class="right"><b>男</b>树 叩 广平及海婴随叩 <b>十月十八日</b></p>

</div>
