<p class="title1">350510</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350510<sup>①</sup> 致赵家璧</h3>

<p class="left">家璧先生：</p>

<p>上午收到九日信并《尼采自传》两本。</p>

<p>小说稿<sup class="notelink"><a href="#m291">[291]</a></sup>除原可不登者全数删去外，又删去了五篇，大约再也不会溢出豫算页数之外的了。</p>

<p>目录仍寄上。</p>

<p>专此布复，即请</p>

<p class="left">著安。</p>

<p class="right">迅 上 <b>五月十夜。</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[291] 指《中国新文学大系·小说二集》稿。</p>
