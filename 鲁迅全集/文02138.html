<p class="title1">341016</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">341016<sup>①</sup> 致吴渤</h3>

<p class="left">吴渤先生：</p>

<p>五日的信，十六日才收到的。《木刻纪程》已出，五六天前曾寄一本，托铁耕先生转交，不知道收到了没有？</p>

<p>中国木刻，已在巴黎展览过，那边的作家团体有一封信给中国作者，但并无批评，不过是鼓励的话。这信现在也没法发表。</p>

<p>《木刻法》<sup class="notelink"><a href="#m524">[524]</a></sup>的稿子，暂时还难以出版，因为上海的出版界，真是艰难极了。</p>

<p>专此布复，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>十月十六日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[524] <b>《木刻法》</b> 即《木刻创作法》。</p>
