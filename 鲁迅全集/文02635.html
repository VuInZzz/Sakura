<p class="title1">360820</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">360820<sup>①</sup> 致唐弢</h3>

<p class="left">唐弢先生：</p>

<p>十八日函收到；前两函也收到的。《珂勒惠支画集》印造不多，存寓定为分送者，早已净尽，无以报命，至歉，容他日设法耳。</p>

<p>我的号，可用周豫才，多人如此写法，但邮局当亦知道，不过比鲁迅稍不触目而已。至于别种笔名，恐书店不详知，易将信失落，似不妥。</p>

<p>专此布复，并请</p>

<p class="left">暑安。</p>

<p class="right">鲁迅 上 <b>八月二十日</b></p>

</div>
