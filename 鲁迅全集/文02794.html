<p class="title1">1 致叶绍钧</p>
<p class="date">第14卷 · 附录一</p>
<br>
<div class="content">1 致叶绍钧<sup class="notelink"><a href="#m1">[1]</a></sup></h3>

<p>聊印数书，以贻同气，所谓相濡以沫<sup class="notelink"><a href="#m2">[2]</a></sup>，殊可哀也。</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[1] 此则据收信人所作《挽鲁迅先生》诗（载1936年11月《作家》第二卷第二号）后自注编入。原无标点。<b>叶绍钧</b>，字圣陶，江苏吴县人，作家、文学研究会成员。著有长篇小说《倪焕之》及短篇小说多种。</p>
<p class="noteitem">[2] <b>相濡以沫</b> 语见《庄子·天运》。</p>
</div></div>
