<p class="title1">340519 致李小峰</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">小峰兄：</p>

<p>再版《伪自由书》印证收条，与《呐喊》等合为一纸，今检出寄上，请改写寄下可也。</p>

<p>此布即请</p>

<p class="left">刻安。</p>

<p class="right">迅 上 <b>五月十九日</b></p>
