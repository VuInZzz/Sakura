<p class="title1">350312 致费慎祥</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350312 致费慎祥<sup class="notelink"><a href="#m200">[200]</a></sup></h3>

<p class="left">慎祥兄：</p>

<p>新出的一本<sup class="notelink"><a href="#m201">[201]</a></sup>，在书店的已售完，来问者尚多，未知再版何时可出？又，上月奉托之《引玉集》序，似乎排得太慢，可否去一催，希即见示为荷。</p>

<p>此上，即颂</p>

<p class="left">时绥</p>

<p class="right">迅 <b>三月十二日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[200] <b>费慎祥</b>（1913—约1951） 江苏无锡人。原为北新书局职员，1933年成立野草书社，1934年自办联华书局（后曾化名同文书局、兴中书局）。</p>
<p class="noteitem">[201] 指《准风月谈》。</p>
