<p class="title1">340124 致黎烈文</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">烈文先生：</p>

<p>有一友人<sup class="notelink"><a href="#m43">[43]</a></sup>，无派而不属于任何翼，能作短评，颇似尼采，今为绍介三则，倘能用，当能续作，但必仍由我转也。此上即请</p>

<p class="left">著安。</p>

<p class="right">迅 顿首 <b>一月廿四夜。</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[43] <b>友人</b> 指徐诗荃。参看350817信注〔1〕。</p>
