<p class="title1">《魏子》序</p>
<p class="date">第10卷</p>
<br>
<div class="content">《魏子》序<sup class="notelink"><a href="#m109">[109]</a></sup></h3>

<p>《隋志》：《魏子》三卷，后汉会稽人魏朗撰。《唐志》同。马总《意林》作十卷，当由后人析分，或“十”字误。朗字少英，上虞人，桓帝时为尚书，被党议免归，复被急征，行至牛渚自杀。见《后汉书》《党锢传》。</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[109] 本篇据手稿编入，写作时间未详。原无标点。<br/><b>《魏子》</b>，鲁迅辑本封面题作《魏朗子》，正文题作《魏子》，一卷。据《意林》、《太平御览》、《艺文类聚》、《事类赋》注、《文选》李善注、《路史·余论》校录而成，共十八则。未印行。</p>
