<p class="title1">261019 致韦素园</p>
<p class="date">第11卷 · 一九二六年</p>
<br>
<div class="content"><p class="left">漱园兄：</p>

<p>今天接十月十日信片，知已迁居<sup class="notelink"><a href="#m620">[620]</a></sup>。</p>

<p>我于本月八日寄出稿子一篇，十六日又寄两篇（皆挂号），而皆系寄新开路，未知可不至于失落否？甚念，如收到，望即示知。</p>

<p>否则即很为难，因我无草稿也。</p>

<p class="right">迅 十，十九</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[620] 指未名社自新开路五号迁至西老胡同一号。</p>
