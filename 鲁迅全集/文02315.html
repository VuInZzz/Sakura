<p class="title1">350402</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350402<sup>②</sup> 致萧军</h3>

<p class="left">刘军兄：</p>

<p>二日信收到。内云“同一条路，只是门牌改了号数”，这回是没有什么“里”的么？那么，莫非屋子是临街的？</p>

<p>还有较详的信，怕寄失，所以先问一问，望即回信。</p>

<p class="right">豫 上 <b>四月二夜</b></p>

<p>《八月》已看过，序已作好。</p>
