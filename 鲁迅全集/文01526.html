<p class="title1">271122 致陶元庆</p>
<p class="date">第12卷 · 一九二七年</p>
<br>
<div class="content"><p class="left">璇卿兄：</p>

<p>《唐宋传奇集》书面用之赭色样本，今日送来了。今并原样一同寄上。对否？希示复。</p>

<p class="right">鲁迅 <b>十一月廿二。</b></p>
