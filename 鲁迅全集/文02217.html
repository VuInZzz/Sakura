<p class="title1">341226</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">341226<sup>③</sup> 致许寿裳</h3>

<p class="left">季巿兄：</p>

<p>医药费帐已送来。世瑒兄共七元五角，此款可于便中交紫佩，因弟在托其装修旧书也，并请嘱其倘有余款，不必送往寓中，应暂存其处，为他日续修破书之用。陶小姐为十六元，帐单乞转寄，还款不必急急，因弟并无急需也。</p>

<p><b>弟</b>前患病，现已复原；妇孺亦安，可抒锦注耳。</p>

<p>匆此布达，即请</p>

<p class="left">文安。</p>

<p class="right"><b>弟</b>飞 顿首 <b>十二月二十六夜</b></p>
