<p class="center">——新闻记者先生所供给的</p>

<p>毒蛇化鳖——“特志之以备生物学家之研究焉。”<sup class="notelink"><a href="#m713">[713]</a></sup></p>

<p>乡妇产蛇——“因识之以供生理学家之参考焉。”</p>
