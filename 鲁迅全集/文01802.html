<p class="title1">330530 致曹聚仁</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content"><p class="left">聚仁先生：</p>

<p>生丁斯世，言语道断<sup class="notelink"><a href="#m117">[117]</a></sup>，为守常先生的遗文写了几句，塞责而已。可用与否，伏候</p>

<p class="left">裁定。此布，并请</p>

<p class="left">著安。</p>

<p class="right">鲁迅 启上 <b>五月三十日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[117] <b>言语道断</b> 佛家语。不可言说，无话可说的意思。《璎珞经》：“言语道断，心行处灭。”</p>
