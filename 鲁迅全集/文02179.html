<p class="title1">341128</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">341128<sup>①</sup> 致金性尧</h3>

<p class="left">维[<b>性</b>]尧先生：</p>

<p>稿子<sup class="notelink"><a href="#m603">[603]</a></sup>并无什么不通或强硬处，只是孩子对理发匠说的话似乎太近文言，不像孩子，最好是改一改。</p>

<p>另外有几个错字，也无关紧要，现在都改正了。</p>

<p>此复，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>十一月廿八日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[603] 该稿后未发表。</p>
