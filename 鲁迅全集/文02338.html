<p class="title1">350509</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350509<sup>②</sup> 致赵家璧</h3>

<p class="left">家璧先生：</p>

<p>百五十元期票一纸，昨已收到，甚感。</p>

<p>《尼采自传》译者，久无消息，只能听其自来；周文稿子<sup class="notelink"><a href="#m290">[290]</a></sup>出版的迟早，我看是没有关系的罢。</p>

<p>专此布复，即请</p>

<p class="left">撰安。</p>

<p class="right">迅 启上 <b>五月九日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[290] <b>周文稿子</b> 即何谷天的《父子之间》。</p>
