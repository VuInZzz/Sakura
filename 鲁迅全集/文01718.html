<p class="date">第12卷 · 一九三二年</p>
<br>
<div class="content">320815<sup>②</sup> 致李小峰</h3>

<p class="left">小峰兄：</p>

<p>印花已备好，可随时来取。</p>

<p>《三闲集》想不久可以出版，此书虽未有合同，但仍希送我二十本为幸。</p>

<p class="right">迅 上 <b>八月十五日</b></p>
