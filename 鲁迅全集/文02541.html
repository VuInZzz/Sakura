<p class="title1">360222 致黄源</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content"><p class="left">河清先生：</p>

<p>靖华稿<sup class="notelink"><a href="#m93">[93]</a></sup>已看毕，昨午托胡风转交。下午即收到原本，内有插图十七幅，因原本即须寄还，晚间吴朗西适见访，因即托其制版，约下星期一将样张交下，而版则仍放在他那里，直接交与先生。</p>

<p>所以那译稿不如迟几天付印，以便将插图同时排入，免得周折，因为有几幅是并非单张，而像《表》的插画一样，要排在文章里的。</p>

<p>专此布达，即颂</p>

<p class="left">著安</p>

<p class="right">迅 上 <b>二月廿二日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[93] 指《远方》译稿。</p>
</div></div>
