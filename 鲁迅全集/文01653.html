<p class="title1">301020 致章廷谦</p>
<p class="date">第12卷 · 一九三〇年</p>
<br>
<div class="content"><p>矛尘兄足下：启者，昨获 惠示，备悉种种。书单<sup class="notelink"><a href="#m74">[74]</a></sup>前已见过，后又另见一种，计有百种之多，但一时不易搜集，因出版所等，难以详知，故未能著手也。 嫂夫人想已日就痊可，但务希保重。弟粗安，可释锦注，孩子则已学步矣。专此奉达，顺请</p>

<p class="left">秋安。</p>

<p class="right"><b>弟</b>俟 顿首<b>十月廿日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[74] <b>书单</b> 据收信人回忆，这是指国民党当局准备逮捕的革命进步人士的名单。</p>
