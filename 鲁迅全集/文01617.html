<p class="title1">291004 致李霁野</p>
<p class="date">第12卷 · 一九二九年</p>
<br>
<div class="content"><p class="left">霁野兄：</p>

<p>三十元款取得期票，即付开明，当即取得收条，今寄上，希察收。</p>

<p class="right">迅 上 <b>十月四日</b></p>
