<p class="title1">280301 致李霁野</p>
<p class="date">第12卷 · 一九二八年</p>
<br>
<div class="content"><p class="left">霁野兄：</p>

<p>译稿狠好，今寄还。我想，以后来稿，大可不必寄来看，以免多费周折。《未名》一期未见。</p>

<p>此外，廿二来信中的问题，前信均已答复了，此不赘。</p>

<p class="right">迅 <b>三，一。</b></p>

<p>《坟》我这里已无，如须改正，最好寄一本给我。</p>

</div>
