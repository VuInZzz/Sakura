<p class="title1">330501 致施蛰存</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content">330501 致施蛰存<sup class="notelink"><a href="#m90">[90]</a></sup></h3>

<p class="left">蛰存先生：</p>

<p>来信早到。近因搬屋及大家生病，久不执笔，《现代》第三卷第二期上，恐怕不及寄稿了。以后倘有工夫坐下作文，我想，在第三期上，或者可以投稿。此复，即请</p>

<p class="left">著安。</p>

<p class="right">鲁迅 启上 <b>五月一日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[90] 此信据《现代作家书简》所载编入。<br/><b>施蛰存</b>（1905—2003），浙江杭州人，作家，当时在上海现代书局任《现代》月刊编辑。</p>
