<p class="title1">360202</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">360202<sup>①</sup> 致沈雁冰</h3>

<p class="left">明甫先生：</p>

<p>找人枪替的材料<sup class="notelink"><a href="#m47">[47]</a></sup>，已经取得，今寄上；但给 S女士<sup class="notelink"><a href="#m48">[48]</a></sup>时，似应声明一下：这并不是我写的。</p>

<p>专此布达，并颂</p>

<p class="left">春禧</p>

<p class="right">树 顿首 <b>二月二夜。</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[47] <b>找人枪替的材料</b> 参看360105<sup>②</sup>信。科举时代代人考试叫“枪替”。</p>
<p class="noteitem">[48] <b>S女士</b> 指史沫特莱。</p>
