<p class="title1">330302 致许寿裳</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content">330302 致许寿裳<sup class="notelink"><a href="#m67">[67]</a></sup></h3>

<p class="left">季巿兄：</p>

<p>二月廿七日手书敬悉。关于儿童心理学书，内山书店中甚少，只见两种，似亦非大佳，已嘱其径寄，并代付书价矣。大约此种书出版本不多，又系冷色<sup class="notelink"><a href="#m68">[68]</a></sup>，必留意广告而特令寄取，始可耳。</p>

<p>旧邮票集得六枚，并附呈。</p>

<p>此复，顺颂</p>

<p class="left">安康。</p>

<p class="right"><b>弟</b>飞 顿首<b>三月二日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[67] 此信据许寿裳亲属录寄副本编入。</p>
<p class="noteitem">[68] <b>冷色</b> 这里指冷门货。</p>
