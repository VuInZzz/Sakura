<p class="title1">330511 致姚克</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content"><p class="left">莘农先生：</p>

<p>十五日以后可有闲空。只要请先生指定一个日期及时间（下午），我当案时在内山书店相候。此复，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 启上 <b>五月十一日</b></p>

</div>
