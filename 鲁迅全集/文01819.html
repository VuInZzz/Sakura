<p class="title1">330718</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content">330718<sup>②</sup> 致施蛰存</h3>

<p class="left">蛰存先生：</p>

<p>十日惠函，今日始收到。</p>

<p>近日大热，所住又多蚊，几乎不能安坐一刻，笔债又积欠不少，因此本月内恐不能投稿，下月稍凉，当呈教也。</p>

<p>此复并请</p>

<p class="left">著安。</p>

<p class="right">迅 启上 <b>七月十八夜。</b></p>

</div>
