<p class="title1">290215 致孙用</p>
<p class="date">第12卷 · 一九二九年</p>
<br>
<div class="content"><p class="left">孙用先生：</p>

<p>来信收到，诗句已照改了，于《奔流》九期上可以登出。</p>

<p>译诗<sup class="notelink"><a href="#m19">[19]</a></sup>能见寄一观，或择登期刊，都可以的。惟绍介全部出版稍难，因为现在诗之读者不多，所以书店不大踊跃。但我可以向北新问一问，倘他们愿印，当再奉告，此后可以直接交涉也。</p>

<p class="right">鲁迅 <b>二月十五日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[19] <b>译诗</b> 指孙用编译的一部世界诗选，题为《异香集》。此书后来没有出版，也没有在刊物上择登，原稿遗失。</p>
