<p class="title1">《书籍》译者附记</p>
<p class="date">第10卷 · 《现代小说译丛》</p>
<br>
<div class="content">《书籍》译者附记<sup class="notelink"><a href="#m114">[114]</a></sup></h4>

<p>这一篇是一九〇一年作，意义很明显，是颜色黯澹的铅一般的滑稽，二十年之后，才译成中国语，安特来夫已经死了三年了。</p>

<p>一九二一年九月十一日，译者记。</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[114] 本篇连同《书籍》的译文，均收入《现代小说译丛》第一集。</p>
