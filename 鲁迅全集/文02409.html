<p class="title1">350823 致楼炜春</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content"><p class="left">炜春先生：</p>

<p>廿二日信收到；前一信也收到的，因为别的琐事，把回信压下了，抱歉得很。</p>

<p>译文社的事很难说，因为现在是“今朝不知明朝”事，假如小说<sup class="notelink"><a href="#m448">[448]</a></sup>译成的时候，译文社仍在进行，也没有外界所加的特别困难，那当然可以出版的。</p>

<p>此复，即请</p>

<p class="left">暑安</p>

<p class="right">迅 顿首 <b>八月廿三日</b></p>

<p>附还明信片一张。</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[448] 指高尔基的《在人间》。当时楼适夷正在狱中翻译，拟请鲁迅介绍给译文社出版。</p>
