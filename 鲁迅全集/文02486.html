<p class="title1">351212</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">351212<sup>②</sup> 致杨霁云</h3>

<p class="left">霁云先生：</p>

<p>久疏问候，想动定一切佳胜？</p>

<p>前嘱作书，顷始写就，<sup class="notelink"><a href="#m623">[623]</a></sup>拙劣如故，视之汗颜，但亦只能姑且寄奉，所谓塞责焉耳。埋之箱底，以施蟫鱼，是所愿也。专此布达，并请</p>

<p class="left">道安。</p>

<p class="right">迅 顿首 <b>十二月十二日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[623] 指鲁迅应杨霁云之请所写集《离骚》句的对联“望崦嵫而勿迫；恐鹈<img class="inline" alt="" src="./images/image06639.jpeg"/>之先鸣”，和明画家项圣谟（1597—1658）所作题画诗的直幅“风号大树中天立，日薄沧溟四海孤。杖策且随时旦暮，不堪回首望孤蒲”。</p>
