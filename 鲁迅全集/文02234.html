<p class="title1">350109</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350109<sup>②</sup> 致许寿裳</h3>

<p class="left">季巿兄：</p>

<p>去年寄奉一函并医院帐目，想早达览。近闻郑君振铎，颇有不欲久居燕大之意，此君热心好学，世所闻知，倘其投闲，至为可惜。因思今天[<b>年</b>]秋起，学院中不知可请其教授文学否？既无色采，又不诡随，在诸生间，当无反对者。以是不揣冒昧，贡其愚忱，倘其有当，尚希采择，将来或直接接洽，或由弟居中绍介，均无不可。如何之处，且希示复也。专此布达，并请</p>

<p class="left">教安。</p>

<p class="right"><b>弟</b>飞 顿首 <b>一月九夜。</b></p>

</div>
