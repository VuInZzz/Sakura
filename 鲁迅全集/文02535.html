<p class="title1">360217</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">360217<sup>③</sup> 致孟十还</h3>

<p class="left">十还先生：</p>

<p>从三郎太太口头，知道您颇喜欢精印本《引玉集》，大有“爱不忍释”之概。尝闻“红粉赠佳人，宝剑赠壮士”，那么，好书当然该赠书呆子。寓里尚有一本，现在特以奉赠，作为“孟氏藏书”，待到五十世纪，定与拙译《死魂灵》，都成为希世之宝也。</p>

<p>专此布达，并颂</p>

<p class="left">春禧。</p>

<p class="right">迅 上 <b>二月十七日</b></p>

</div>
