<p class="title1">340315</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">340315<sup>②</sup> 致母亲</h3>

<p>母亲大人膝下，敬禀者，久未得来示为念。近闻天津报上，有登<b>男</b>生脑炎症者，全系谣言，请勿念为要。害马亦好，惟海婴于十日前患伤风发热，即经延医诊治，现已渐愈矣。和荪<sup class="notelink"><a href="#m121">[121]</a></sup>兄不知已动身否？至今未见其来访也。专此布达，恭请</p>

<p class="left">金安。</p>

<p class="right">男树 叩上。广平及海婴随叩 <b>三月十五夜</b>。</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[121] <b>和荪</b> 即阮和孙（1880—1959），鲁迅大姨之子。</p>
