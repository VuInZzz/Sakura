<p class="title1">360603 致唐弢</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">360603 致唐弢<sup class="notelink"><a href="#m243">[243]</a></sup></h3>

<p class="left">唐弢先生：</p>

<p>来信收到，刊物不编甚好，省却许多麻烦。</p>

<p>我病加重，连字也不会写了，但也许就会好起来。</p>

<p>偶见书评<sup class="notelink"><a href="#m244">[244]</a></sup>一则，剪下附呈。专此布达</p>

<p>即请</p>

<p class="left">日安！</p>

<p class="right">鲁迅 <b>六月三日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[243] 此信系鲁迅口授，许广平代笔。</p>
<p class="noteitem">[244] <b>书评</b> 指《读〈推背集〉》，罗荪作，载1936年5月3日《北平新报·绒线软语》。</p>
