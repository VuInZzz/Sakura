<p class="title1">350212 致萧军</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content"><p class="left">刘先生：</p>

<p>十，十一两信俱收到。印书的事<sup class="notelink"><a href="#m153">[153]</a></sup>，我现在不能答复，因为还没有探听，计划过。</p>

<p>地图<sup class="notelink"><a href="#m154">[154]</a></sup>在内山书店没有寄卖，因为这是海关禁止入口，一看见就没收的。</p>

<p>此复，即颂</p>

<p class="left">时绥。</p>

<p class="right">豫 上 <b>二，二〔一〕二</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[153] 指《八月的乡村》出版事。</p>
<p class="noteitem">[154] 据收信人回忆，指日本出版的伪满洲国地图。</p>
