<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350104<sup>④</sup> 致赵家璧、郑伯奇</h3>

<p class="left">家璧 君平先生：</p>

<p>先想看一看《新青年》及《新潮》，倘能借得，乞派人送至书店为感。</p>

<p>专此布达，即请</p>

<p class="left">著安。</p>

<p class="right">迅 上 <b>一月四日</b></p>
