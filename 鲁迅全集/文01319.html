<p class="title1">211015 致宫竹心</p>
<p class="date">第11卷 · 一九二一年</p>
<br>
<div class="content"><p class="left">竹心先生：</p>

<p>来信收到了。本星期日的下午，我大约在寓，可以请来谈。</p>

<p>《救急法》<sup class="notelink"><a href="#m382">[382]</a></sup>可以姑且送到商务馆去试一试，也请一并带来。</p>

<p>馆<b>［余］</b>面谈。</p>

<p class="right">周树人 十月十五日</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[382] <b>《救急法》</b> 宫竹心友人所译的一本医学书。</p>
