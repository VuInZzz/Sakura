<p class="title1">360504</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">360504<sup>③</sup> 致吴朗西</h3>

<p class="left">朗西先生：</p>

<p>《珂勒惠支版画选集》序二篇<sup class="notelink"><a href="#m224">[224]</a></sup>之后，拟用自笔署名，今寄上字稿，乞费神代制锌版，制成后版留尊处，寄下印本，当于校时粘入，由</p>

<p>先生并版交与印刷局也。</p>

<p>专此布达，并颂</p>

<p class="left">春祺。</p>

<p class="right">鲁迅 上 <b>五月四夜。</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[224] <b>《珂勒惠支版画选集》序二篇</b> 即史沫特莱的《凯绥·珂勒惠支——民众的艺术家》和鲁迅的《〈凯绥·珂勒惠支版画选集〉序目》。鲁迅文后收入《且介亭杂文末编》。</p>
