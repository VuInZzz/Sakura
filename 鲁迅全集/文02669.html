<p class="title1">361006</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">361006<sup>①</sup> 致汤咏兰<sup class="notelink"><a href="#m365">[365]</a></sup></h3>

<p class="left">咏兰先生：</p>

<p>来信收到。</p>

<p>肺病又兼伤风，真是不大好，但我希望伤风是不久就可以医好的。</p>

<p>有钱五十元，放在书店里。今附上一笺，请持此笺，前去一取为荷。</p>

<p>专此布复，即颂</p>

<p class="left">时绥。</p>

<p class="right">豫 上 <b>十月六日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[365] <b>汤咏兰</b> 湖南益阳人，叶紫夫人。</p>
