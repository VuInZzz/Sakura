<p class="title1">341010 致杨霁云</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">霁云先生：</p>

<p>中国新作家的木刻二十四幅，已经印出，名《木刻纪程》；又再版《北平笺谱》亦已到沪，不及初版，我可以换一部初版的给 先生的。但不知寄到府上，还是俟 先生来沪时自取好呢？大约邮寄是有小小损毁之虑的。希示为幸。</p>

<p>此布，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>十月十日</b></p>
