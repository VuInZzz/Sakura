<p class="title1">350309</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350309<sup>①</sup> 致赵家璧</h3>

<p class="left">家璧先生：</p>

<p>六日信收到。梵澄的来，很不一定，所以那《尼采自传》，至今还搁在我寓里。我本来可以代他校一下，但这几天绝无工夫，须得十五以后才可以有一点余暇。假如在这之前，他终于没有来，那么，当代校一遍送上，只得请印刷所略等一下。但即使他今天就来，我相信也不会比我从十五以后校起来更快。</p>

<p>尼采像是真的，当同校稿一起送上。</p>

<p>专复，即请</p>

<p class="left">撰安。</p>

<p class="right">迅 上 <b>三月九日</b></p>

</div>
