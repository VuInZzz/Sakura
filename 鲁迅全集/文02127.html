<p class="title1">341006</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">341006<sup>②</sup> 致罗清桢</h3>

<p class="left">清桢先生：</p>

<p>《木刻纪程》已订出，即托书店寄上四本，因所选先生画为四幅，故每幅以一本为报酬。</p>

<p>木版亦当于数日内作小包寄还，至希检收。</p>

<p>此次印工并不佳，而颇费手续，所费亦巨，故第二本何时可出，颇在不可知之数。先生之版，现仅留《五指山之松》一块在敝处，《在码头上》已见他处发表，似可不必复印，故一并附还耳。</p>

<p>专此布达，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>十月六日</b></p>
