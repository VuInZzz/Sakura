<p class="title1">350524</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350524<sup>②</sup> 致杨霁云</h3>

<p class="left">霁云先生：</p>

<p>十六日信早奉到。《集外集》也收到了，十本以外，又索得了八本，已够了。印工之类，在现在的出版界，总是如此的，我看将来还要低落下去。</p>

<p>纸张也已收到，如此拙字，写到宣纸上，真也自觉可笑，但先生既要我写，我是可以写的，但须拖延时日耳，因为须等一相宜的时候也。</p>

<p>纸内有两长条，是否对联？乞示知。若然，则一定写得极坏，因为我没有写过大字，所以字愈大，就愈坏。</p>

<p>专此布复，即请</p>

<p class="left">文安。</p>

<p class="right">迅 上 <b>五月廿四日</b></p>
