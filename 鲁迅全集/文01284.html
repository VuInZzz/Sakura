<p class="title1">190130 致钱玄同</p>
<p class="date">第11卷 · 一九一九年</p>
<br>
<div class="content"><p>明信片收到了。点句和署名两件事，都可照来信办理。昨天看见《新潮》第二册内《推霞》<sup class="notelink"><a href="#m176">[176]</a></sup>上面的小序，不禁不敬之心，油然而生，勃然而长；倘若跳舞再不高明，便要沛然莫之能御了。相应明信片达，请烦查照，至纫公谊。此致</p>

<p class="left">玄同兄</p>

<p class="right">树 一月卅日</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[176] <b>《推霞》</b> 独幕剧，德国苏德曼（1857—1928）作，宋春舫用文言翻译，载《新潮》第一卷第二号（1919年2月）。文前附有译者小序。</p>
</div></div>
