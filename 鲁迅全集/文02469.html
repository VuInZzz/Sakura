<p class="title1">351118</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">351118<sup>②</sup> 致赵家璧</h3>

<p class="left">家璧先生：</p>

<p>兹送上印证四千，《死魂灵》一本，希察入。又小书两本<sup class="notelink"><a href="#m587">[587]</a></sup>，不足道也，但顺便送上，并乞哂存为幸。</p>

<p>专此布达，并请</p>

<p class="left">撰安。</p>

<p class="right">鲁迅 十一月十八日</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[587] 指《伪自由书》、《准风月谈》。</p>
</div></div>
