<p class="title1">330311</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content">330311<sup>①</sup> 致开明书店</h3>

<p class="block">径启者：前得北平未名社广告稿一纸，嘱登沪报，即于二月廿八至三月二日共登《申报》紧要分类广告栏三天。顷复得该社员寄来北平《晨报》一张，内有同样广告；又收据一纸，计洋五百九十六元七角七分，嘱向</p>

<p class="block">贵局取款。此款不知于何时何地见付，希速赐示，以便遵办为荷。此请</p>

<p class="left">开明书店台鉴</p>

<p class="right">鲁迅 <b>三月十一日</b></p>

<p>通信处：北四川路底，内山书店转周豫才收。</p>
