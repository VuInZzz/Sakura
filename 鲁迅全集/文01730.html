<p class="title1">321025 致许寿裳</p>
<p class="date">第12卷 · 一九三二年</p>
<br>
<div class="content"><p class="left">季巿兄：</p>

<p class="block">孔若君在津，不问亦不释，<sup class="notelink"><a href="#m125">[125]</a></sup>霁野（以他自己名义）曾去见尔和，五次不得见，孔家甚希望兄给霁野一绍介信，或能见面，未知可否？倘可，希直寄霁野，或由“北平后门皇城根台静农转”亦可。弟阖寓均安，可告慰也。此颂</p>

<p class="left">曼福。</p>

<p class="right"><b>弟</b>树 顿首<b>十月廿五日</b></p>

<p>日耳曼邮票三枚附呈。</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[125] 指孔另境在津被捕后的情形。参看320817<sup>①</sup>信。</p>
