<p class="title1">351223</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">351223<sup>①</sup> 致李小峰</h3>

<p class="left">小峰兄：</p>

<p>惠示诵悉。《集外集拾遗》抄出大半，尚有数篇在觅期刊，编好须在明年了。</p>

<p>北新以社会情形和内部关系之故，自当渐不如前，但此非我个人之力所能如何，而况我亦年渐衰迈，体力已不如前哉？区区一二本书，恐无甚效，而北新又须选择，我的作品又很不平稳，如何是好。</p>

<p>附笺并稿一件，乞转交赵先生。</p>

<p class="right">迅 顿首 <b>十二月二十三日</b></p>
