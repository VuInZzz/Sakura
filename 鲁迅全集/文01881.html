<p class="title1">331113</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content">331113<sup>①</sup> 致陶亢德</h3>

<p class="left">亢德先生：</p>

<p>那一条新闻，登载与否在我是都可以的，不过我觉得这记事本身，实在也并无什么大意义，所以不如不要它。但倘以暴露杭州情形为目的，那么，登登也好的。</p>

<p>我在寓里不见客，此非他，因既见一客，后来势必至于非广见众客不可，将没有工夫偷懒也。此一节，乞谅察为幸。专复即请</p>

<p class="left">著安。</p>

<p class="right">迅 上 <b>十一月十三日</b></p>

</div>
