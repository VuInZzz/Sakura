<p class="title1">南京民谣</p>
<p class="date">第7卷 · 一九三一年</p>
<br>
<div class="content">南京民谣<sup class="notelink"><a href="#m347">[347]</a></sup></h4>

<p class="center">大家去谒灵，强盗装正经。<sup class="notelink"><a href="#m348">[348]</a></sup></p>

<p class="center">静默十分钟，各自想拳经。</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[347] 本篇最初发表于1931年12月25日《十字街头》第二期，未署名。</p>
<p class="noteitem">[348] <b>谒灵</b> 即谒陵。1931年12月23日《申报》报导，参加国民党四届一中全会的中央委员于当日上午八时全体拜谒孙中山的陵墓。</p>
