<p class="title1">330504</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content">330504<sup>②</sup> 致黎烈文</h3>

<p class="left">烈文先生：</p>

<p>晚间曾寄寸函，夜里又做一篇<sup class="notelink"><a href="#m97">[97]</a></sup>，原想嬉皮笑脸，而仍剑拔弩张，倘不洗心，殊难革面，真是呜呼噫嘻，如何是好。换一笔名，图掩人目，恐亦无补。今姑且寄奉，可用与否，一听酌定，希万勿客气也。</p>

<p>此上，即请</p>

<p class="left">著安。</p>

<p class="right">干 顿首 <b>五月四夜</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[97] 指《“多难之月”》，后收入《伪自由书》。</p>
