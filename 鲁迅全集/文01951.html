<p class="title1">340303</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">340303<sup>②</sup> 致郑振铎</h3>

<p class="left">西谛先生：</p>

<p>日前奉一函，系拟补印缺页者，未知已到否？</p>

<p>《北平笺谱》之在内山书店，销路极好，不到一星期，二十部全已卖完，内山谓倘若再版，他仍可要二三十部。不知中国方面，豫约者已有几人？如已及二十部倘有三十部，则可只给内山二十部，那就不妨开印了。</p>

<p>此书再版时，只要将末页改刻，于第一二行上，添“次年△月再版△△部越△月毕工”十四字，又，选定者之名，亦用木刻就好了。此布即请</p>

<p class="left">文安。</p>

<p class="right">迅 顿首 <b>三月三日</b></p>
