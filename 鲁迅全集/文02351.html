<p class="title1">350524</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350524<sup>③</sup> 致郑伯奇</h3>

<p class="left">伯奇先生：</p>

<p>下午得赵先生信，云将往北平，有事可与先生接洽；并有《小说二集序》排印稿二份。</p>

<p>这序里的错字可真不算少，今赶紧校出寄上，务希嘱其<span class="u">照改</span>为托。否则，颇觉得太潦草也。</p>

<p>专此布达，即请</p>

<p class="left">撰安。</p>

<p class="right">迅 上 <b>五月廿四夜</b></p>

<p>附校稿二份。</p>

</div>
