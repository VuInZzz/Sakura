<p class="title1">330503</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content">330503<sup>②</sup> 致李小峰</h3>

<p class="left">小峰兄：</p>

<p>今天奉上《两地书》印花五百中，似缺少一个，今补上。</p>

<p>前几天因为孩子生病及忙于为人译一篇论文<sup class="notelink"><a href="#m93">[93]</a></sup>，所以无暇做短评。现在又做起来了，告一段落，恐尚需若干时候也。</p>

<p class="right">迅 上 <b>五三之夜</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[93] <b>论文</b> 未详。</p>
