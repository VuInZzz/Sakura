<p class="title1">人与时</p>
<p class="date">第7卷 · 一九一八年</p>
<br>
<div class="content">人与时<sup class="notelink"><a href="#m91">[91]</a></sup></h4>

<p>一人说，将来胜过现在。</p>

<p>一人说，现在远不及从前。</p>

<p>一人说，什么？</p>

<p>时道，你们都侮辱我的现在。</p>

<p>　从前好的，自己回去。</p>

<p>　将来好的，跟我前去。</p>

<p>　这说什么的，</p>

<p>　我不和你说什么。</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[91] 本篇最初发表于1918年7月15日《新青年》第五卷第一号，署名唐俟。</p>
