<p class="title1">360922</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">360922<sup>②</sup> 致费慎祥</h3>

<p class="left">慎祥兄：</p>

<p>重排的《花边文学》，想必有一本清样，望便中带来。因为我想在较有力气时，标注这回付印的《杂文初集》<sup class="notelink"><a href="#m346">[346]</a></sup>，要看看格式。</p>

<p>那一个盘光华书局的人<sup class="notelink"><a href="#m347">[347]</a></sup>，在将《铁流》的纸板向人出卖，要五十块钱。</p>

<p>专此布达，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>廿二日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[346] <b>《杂文初集》</b> 即《且介亭杂文》。</p>
<p class="noteitem">[347] 指陈杏荪，浙江宁波人。当时任上海太平洋印刷所经理。</p>
