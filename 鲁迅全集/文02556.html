<p class="title1">360320</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">360320<sup>②</sup> 致陈光尧</h3>

<p class="left">光尧先生：</p>

<p>蒙惠书并眎大著<sup class="notelink"><a href="#m117">[117]</a></sup>，浩如河汉，拜服之至。倘有刊行者，则名利兼获，当诚如大札所云。但际此时会，具此卓见之书店，殊不可得，况以仆之寡陋，终年杜门，更不能有绍介之幸也。其实气魄较大，今固无逾于商务印书馆者耳。 专此布复，即请</p>

<p class="left">撰安。</p>

<p class="right">鲁迅 顿首 <b>三月二十日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[117] 指《中华简字选》稿。</p>
