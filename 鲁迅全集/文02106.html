<p class="title1">340820 致楼炜春</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">炜春先生：</p>

<p>适夷兄是那一年生的，今年几岁？因为有一个美国人<sup class="notelink"><a href="#m465">[465]</a></sup>译了他一篇小说<sup class="notelink"><a href="#m466">[466]</a></sup>，要附带讲起作者的事情，所以写信来问。先生如知道，希即示知，信寄“北四川路底内山书店转周豫才收”为荷。</p>

<p>此布即请</p>

<p class="left">暑安。</p>

<p class="right">迅 上 <b>八月二十日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[465] <b>美国人</b> 指伊罗生，曾任上海出版的中英文合印的刊物《中国论坛》编辑。当时拟编选中国短篇小说集。</p>
<p class="noteitem">[466] 指《盐场》。参看340921信注〔1〕。</p>
</div></div>
