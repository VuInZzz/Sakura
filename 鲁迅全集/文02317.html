<p class="date">第13卷 · 一九三五年</p>

<div class="content">350404<sup>①</sup> 致萧军</h3>

<p class="left">刘兄：</p>

<p>三日信收到。稿、序、并另有信，都作一包，放在书店里，附上一笺，乞拿以去取，但星期日上午，他们是休息的。</p>

<p class="right">豫 上 <b>四月四夜。</b></p>
