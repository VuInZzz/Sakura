<p class="title1">330607 致黎烈文</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content"><p class="left">烈文先生：</p>

<p>来函收到，甚感甚感。</p>

<p>夜间做了这样的两篇<sup class="notelink"><a href="#m121">[121]</a></sup>，虽较为滑头，而无聊也因而殊甚。不知通得过否？如以为可用，请一试。</p>

<p>此后也想保持此种油腔滑调，但能否如愿，却未详也。此上，顺颂</p>

<p class="left">著祺。</p>

<p class="right">迅 启 <b>六月七夜</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[121] <b>两篇</b> 指《夜颂》、《推》，后均收入《准风月谈》。</p>
</div></div>
