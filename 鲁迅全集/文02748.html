<p class="title1">340825（美） 致伊罗生</p>
<p class="date">第14卷 · 致外国人士部分</p>
<br>
<div class="content"><p class="left">伊先生：</p>

<p>前几天我们挂号寄上一信，想已收到。</p>

<p>蒋君的生年，现在查出来了，是一九〇一年；卒年不大明白，大约是一九三〇或三一年。</p>

<p>我此刻已不住在家里<sup class="notelink"><a href="#m166">[166]</a></sup>，只留下女人和孩子；但我想，再过几天，我可以回去的。</p>

<p>此布，即请</p>

<p class="left">暑安。</p>

<p class="right">L.S.启 <b>八月廿五日</b></p>

<p>姚女士前并此问好。</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[166] <b>已不住在家里</b> 参看340831<sup>②</sup>信注〔5〕。</p>
