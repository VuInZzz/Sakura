<p class="title1">360722 致孔另境</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content"><p class="left">若君先生：</p>

<p>霁野寄信来，信封上写“北平西温泉疗养院寄”，照此写去，不知是否可以寄到？又静农芜湖住址，先生如知道，并希示知。</p>

<p>专此布达，并请</p>

<p class="left">暑安。</p>

<p class="right">迅 上 <b>七月二十二日</b></p>

</div>
