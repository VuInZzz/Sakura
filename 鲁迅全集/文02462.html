<p class="title1">351111 致马子华</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">351111 致马子华<sup class="notelink"><a href="#m574">[574]</a></sup></h3>

<p class="left">子华先生：</p>

<p>来信收到。十来年前，我的确给人看过作品，但现在是体力和时间，都不许可了，所以实在无法实现何先生的希望，真是抱歉得很。</p>

<p>专此布复，并颂</p>

<p class="left">时绥。</p>

<p class="right">鲁迅 <b>十一月十一日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[574] <b>马子华</b>（1912—1996） 云南洱源人，“左联”成员。当时是上海光华大学中文系学生，作有长篇小说《他的子民们》。他曾请鲁迅为其同学何某校阅《安娜·卡列尼娜》译稿。</p>
