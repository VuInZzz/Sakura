<p class="title1">321002 致李小峰</p>
<p class="date">第12卷 · 一九三二年</p>
<br>
<div class="content"><p class="left">小峰兄：</p>

<p>今天看《申报》，知《朝花夕拾》已出版，望照旧例送给我二十本，于便中交下。</p>

<p>年来每月所收上海及北平版税，不能云少，但亦仅足开支。不幸上月全寓生病，至今尚在服药，所以我想于本月多取若干，以备急用，可否希即示复为幸。</p>

<p class="right">迅 上 <b>十月二日</b></p>
