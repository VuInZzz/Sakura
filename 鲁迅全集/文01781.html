<p class="title1">330405 致李小峰</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content"><p class="left">小峰兄：</p>

<p>《两地书》校稿，今先将序目寄上。第一页上，写“上海北新书局印行”，与末页不同，应否改成一律（青光……），请兄酌改。如改了，则封面亦应照改也。</p>

<p>其余校稿，三四日内再寄还。</p>

<p>我的《杂感选集》，选者还只送了一个目录来，须我自己拆出，抑他拆好送来，尚未知，且待数天罢。但付印时，我想先送他一注钱，即由我将来此书之版税中扣除，实亦等于买稿。能如此办否，希 示及。</p>

<p class="right">迅 上 <b>四月五日</b></p>

</div>
