<p class="title1">350409 致黄源</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content"><p class="left">河清先生：</p>

<p>插画本丛书的版心，我看每行还可以添两个字，那么，略成长方，比较的好看（《两地书》如此），照《奔流》式，过于狭长，和插画不能调和，因为插画是长方的居多。</p>

<p>此书请暂缓发排，索性等我全部看一遍后付印罢，我当于十五日以前看完。</p>

<p>专此，即请</p>

<p class="left">撰安。</p>

<p class="right">迅 上 <b>四月九日</b></p>

</div>
