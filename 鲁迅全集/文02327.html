<p class="title1">350422 致何白涛</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content"><p class="left">白涛先生：</p>

<p>先后两信均收到。先生谓欲以发表酬资偿书款，那当然无所不可的。</p>

<p>但画稿亦不宜乱投，此后当看机会，绍介于相宜之处，希勿念为幸。</p>

<p>匆此布复，并颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>四月廿二日</b></p>

</div>
