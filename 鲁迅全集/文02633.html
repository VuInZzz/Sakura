<p class="title1">360818</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">360818<sup>①</sup> 致王正朔<sup class="notelink"><a href="#m293">[293]</a></sup></h3>

<p class="left">正朔先生足下：</p>

<p>顷奉到八月十四日惠函，谨悉一切。其拓片一包，共六十七张，亦已于同日收到无误。桥<sup class="notelink"><a href="#m294">[294]</a></sup>基石刻，亦切望于水消后拓出，迟固无妨也。</p>

<p>知关锦念，特此奉闻，并颂</p>

<p class="left">时绥不尽</p>

<p class="right">周玉材 顿首 <b>八月十八日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[293] <b>王正朔</b>（1907？—1939） 河南内乡人。当时在南阳一带做中共党的地下工作，曾受托为鲁迅收集南阳汉画拓片。</p>
<p class="noteitem">[294] 指南阳市北关魏公桥。</p>
