<p class="title1">351228 致叶紫</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content"><p class="left">芷兄：</p>

<p>来信收到。账已算来，附上账单，拿这到书店<sup class="notelink"><a href="#m649">[649]</a></sup>，便可取款。</p>

<p>专此布达，即颂</p>

<p class="left">刻安。</p>

<p class="right">豫 上 <b>十二月二十八夜。</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[649] 指内山书店。该店曾代售《丰收》。</p>
