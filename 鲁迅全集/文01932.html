<p class="title1">340122 致赵家璧</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">家璧先生：</p>

<p>顷查得丁玲的母亲的通信地址，是：“湖南常德、忠靖庙街六号、蒋慕唐老太太”，如来信地址，与此无异，那就不是别人假冒的。</p>

<p>但又闻她的周围，穷本家甚多，款项<sup class="notelink"><a href="#m37">[37]</a></sup>一到，顷刻即被分尽，所以最好是先寄一百来元，待回信到后，再行续寄为妥也。专此布达，即请</p>

<p class="left">著安。</p>

<p class="right">迅 顿首 <b>一月二十二日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[37] <b>款项</b> 指丁玲《母亲》一书的稿费。该书出版后，作者已被捕，其母蒋慕唐向良友图书印刷公司索取稿费。</p>
