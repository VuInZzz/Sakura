<p class="title1">340601 致李小峰</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">小峰兄：</p>

<p>《两地书》印证已印好，因系长条，邮寄不便，希嘱店友于便中来寓一取。来时并携《两地书》三本，无印者即可，可在此贴上，而付出之印，则减为千四百九十七枚也。</p>

<p>《桃色的云》，《小约翰》纸板，亦希一并带来，因今年在故乡修坟，故须于端节前，设法集一笔现款，只好藉此设法耳。</p>

<p class="right">迅 上 <b>六月一夜。</b></p>
