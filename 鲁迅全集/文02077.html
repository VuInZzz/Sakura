<p class="title1">340708 致徐懋庸</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">懋庸先生：</p>

<p>此系闲斋寄来，不知可作《新语林》补白之用否？今姑寄上。<sup class="notelink"><a href="#m412">[412]</a></sup></p>

<p>此颂</p>

<p class="left">时绥。</p>

<p class="right">迅 顿首 <b>七月八夜</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[412] 指徐诗荃的诗《读小品文（将苏东坡读孟郊诗二章改窜作）》，作者署名“无名氏”，后载《新语林》第二期（1934年7月20日）。</p>
