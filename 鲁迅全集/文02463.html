<p class="title1">351114 致章锡琛</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">351114 致章锡琛<sup class="notelink"><a href="#m575">[575]</a></sup></h3>

<p class="left">雪村先生：</p>

<p>韦丛芜君版税，因还未名社旧款，由我收取已久，现因此项欠款，大致已清，所以拟不续收，此后务乞寄与韦君直接收下为祷。</p>

<p>专此布达，即请</p>

<p class="left">道安。</p>

<p class="right">鲁迅 上 <b>十一月十四日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[575] <b>章锡琛</b>（1889—1969） 字雪村，浙江绍兴人。曾任《妇女杂志》、《新女性》杂志编辑，当时任开明书店经理。</p>
