<p class="title1">341213</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">341213<sup>①</sup> 致曹聚仁</h3>

<p class="left">聚仁先生：</p>

<p>十一日函奉到。《集外集》那里出版，我毫无成见，群众<sup class="notelink"><a href="#m649">[649]</a></sup>当然可以；版税也不能要，这本子，我自己是全没有费过力的。惟一的条件，是形式最好和《热风》之类一样。</p>

<p>这本东西，印起来大约不至于犯忌，但内容不佳，卖起来大约也不至于出色。</p>

<p>专此布复，即请</p>

<p class="left">文安。</p>

<p class="right">迅 顿首 <b>十二月十三日</b></p>

<p>附二纸，希转交 杨先生。 又及。</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[649] <b>群众</b> 指上海群众图书公司。</p>
</div></div>
