<p class="title1">340209</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">340209<sup>①</sup> 致许寿裳<sup class="notelink"><a href="#m54">[54]</a></sup></h3>

<p class="left">季巿兄：</p>

<p>顷得惠函并有剪报，得读妙文，甚感。</p>

<p>卖脚气药处，系“上海大东门内大街，严大德堂”，药计二种，一曰脚肿丸，浮肿者服之；一曰脚麻丸，觉麻痹者服之。应视症以求药，每服似一元，大率二服便愈云。</p>

<p>上海天气渐温，敝寓均安好。此复，即颂</p>

<p class="left">曼福。</p>

<p class="right">弟飞 顿首 <b>二月九日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[54] 此信据许寿裳亲属录寄副本编入。</p>
