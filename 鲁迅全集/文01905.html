<p class="title1">331219</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content">331219<sup>①</sup> 致母亲</h3>

<p class="block">母亲大人膝下，敬禀者，十二月二日的来信，早已收到。心梅叔有信寄老三，云修坟已经动工，细账等完工后再寄。此项经费，已由男预先寄去五十元，大约已所差无几，请大人不必再向八道湾提起，免得因为一点小事，或至于淘气也。海婴仍不读书，专在家里捣乱，拆破玩具，但比上半年懂事得多，且较为听话了。男及害马均安好，并请勿念。上海天气渐冷，可穿棉袍，夜间更冷，寓中已于今日装置火炉矣。余容续禀，专此布达，恭请</p>

<p class="left">金安。</p>

<p class="right"><b>男</b>树 叩上<b>十二月十九日</b></p>

</div>
