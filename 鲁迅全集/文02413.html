<div class="content">350831<sup>①</sup> 致徐懋庸<sup class="notelink"><a href="#m464">[464]</a></sup></h3>

<p class="left">乞转徐先生</p>

<p>这篇批评，竭力将对于社会的意义抹杀，是歪曲的。但这是《小公园》一贯的宗旨。</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
