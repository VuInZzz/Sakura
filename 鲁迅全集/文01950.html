<p class="title1">340303</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">340303<sup>①</sup> 致曹靖华</h3>

<p class="left">汝珍兄：</p>

<p>日前将兄所要的书四本寄至学校，昨被寄回，上批云“本校并无此人”，我想必是门房胡闹（因为我并未写错姓名），书仍当寄上，但不知以寄至何处为宜，希即将地址及姓名见示。书须挂号，要有印的名字才好也。此布即颂</p>

<p class="left">时绥。</p>

<p class="right"><b>弟</b>豫 顿首 <b>三月三日</b></p>
