<p class="title1">340625 致徐懋庸</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">懋庸先生：</p>

<p>某君<sup class="notelink"><a href="#m393">[393]</a></sup>寄来二稿，其《古诗新改》，似不能用，恐《自由谈》亦不能用，因曾登此种译诗也。今姑扣留，寄上一阅，取半或全收均可。</p>

<p>专此即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>六月廿五夜。</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[393] <b>某君</b> 指徐诗荃。</p>
