<div class="content">270630<sup>②</sup> 致台静农</h3>

<p class="left">静农兄：</p>

<p>七日信早到。《白茶》至今未到，大约又不知怎么了罢，可叹。</p>

<p>京中传说，顾吉刚在广大也辞职，是为保持北大的地位的手段。顾吉刚们的言行如果能使我相信，我对于中国的前途还要觉得光明些。</p>

<p class="right">迅 <b>六，卅</b></p>

<p id="cloudFav" style="text-align:center;font-size:13px;margin:10px 0"><span id="cfMsg">云端书架：<a href="../我的书架.html">登录后可收藏本篇</a></span></p>
<script src="../cloud.js"></script>
<script>
(function(){
  var msg=document.getElementById("cfMsg");
  var meta={"bookKey": "鲁迅全集", "bookTitle": "鲁迅全集", "itemTitle": "270630", "itemUrl": "鲁迅全集/文01496.html"};
  function act(fav){
    msg.innerHTML = fav
      ? '★ 已收藏 · <a href="../我的书架.html">我的书架</a> ｜ <a href="javascript:;" id="cfBtn">取消收藏</a>'
      : '☆ <a href="javascript:;" id="cfBtn">收藏本篇到云端书架</a> ｜ <a href="../我的书架.html">我的书架</a>';
    document.getElementById("cfBtn").onclick=function(){
      if(fav){
        CloudShelf.listShelf("favorite").then(function(rows){
          var hit=rows.filter(function(r){return r.item_url===meta.itemUrl})[0];
          if(hit) return CloudShelf.removeShelf(hit.id);
        }).then(function(){act(false)}).catch(function(e){msg.textContent=e.message});
      }else{
        CloudShelf.saveShelf({bookKey:meta.bookKey,bookTitle:meta.bookTitle,
          itemTitle:meta.itemTitle,itemUrl:meta.itemUrl,kind:"favorite"})
          .then(function(){act(true);CloudShelf.saveShelf({bookKey:meta.bookKey,
            bookTitle:meta.bookTitle,itemTitle:meta.itemTitle,itemUrl:meta.itemUrl,kind:"progress"}).catch(function(){})})
          .catch(function(e){msg.textContent=e.message});
      }
    };
  }
  CloudShelf.getSession().then(function(res){
    if(!res||!res.data||!res.data.session) return;
    return CloudShelf.listShelf("favorite").then(function(rows){
      act(rows.some(function(r){return r.item_url===meta.itemUrl}));
    });
  }).catch(function(){});
})();
</script>
