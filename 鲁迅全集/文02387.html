<p class="title1">350722</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350722<sup>①</sup> 致台静农</h3>

<p class="left">青兄：</p>

<p>十六日函并拓片一张，顷收到。</p>

<p>山根阴险，早经领教，其实只知树势，祸学界耳。厦门亦非好地方，即成，亦未必能久居也。</p>

<p>向暨大曾一问，亦不成，上海学校，亦不复有干净土；尚当向他处一打听也。</p>

<p>上海已大热，贱躯尚安，可释远念。</p>

<p>此布，即颂</p>

<p class="left">时绥。</p>

<p class="right">豫 顿首 <b>七月二十二日</b></p>

</div>
