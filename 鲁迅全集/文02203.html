<p class="title1">341217 致萧军、萧红</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">刘吟先生：</p>

<p>本月十九日（星期三）下午六时，我们请你们俩到梁园豫菜馆吃饭，另外还有几个朋友<sup class="notelink"><a href="#m664">[664]</a></sup>，都可以随便谈天的。梁园地址，是广西路三三二号。广西路是二马路与三马路之间的一条横街，若从二马路弯进去，比较的近。</p>

<p>专此布达，并请</p>

<p class="left">俪安。</p>

<p class="right">豫广同具 <b>十二月十七日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[664] 据鲁迅日记，指沈雁冰、叶紫、聂绀弩夫妇、胡风夫妇（后未至）等。</p>
</div></div>
