<p class="title1">260719 致魏建功</p>
<p class="date">第11卷 · 一九二六年</p>
<br>
<div class="content"><p class="left">建功兄：</p>

<p>给我校对过的《太平广记》，都收到齐了，这样的热天做这样的麻烦事，实在不胜感谢。</p>

<p>到厦门，我总想拖延到八月中旬才动身，其实很有些琐事须小收束，也非拖到那时不可。不过如那边来催，非早去不可，便只好早走。</p>

<p class="right">迅上 七月十九日</p>
