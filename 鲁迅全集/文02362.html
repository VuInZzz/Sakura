<p class="title1">350610 致黄源</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content"><p class="left">河清先生：</p>

<p>今寄上《文学》“论坛”二篇，散文（？）稿<sup class="notelink"><a href="#m347">[347]</a></sup>一篇，乞转交傅先生。</p>

<p>数日前寄上一函，系索回前给《译文》之散文（别人译的）译稿，至今未得回音，务希费神一查，即予寄回，以便了此一件，为感。</p>

<p>此布，即请</p>

<p class="left">撰安。</p>

<p class="right">迅 上 <b>六月十日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[347] 指《“题未定”草》（一——三），后收入《且介亭杂文二集》。</p>
</div></div>
