<p class="title1">3 致高植</p>
<p class="date">第14卷 · 附录一</p>
<br>
<div class="content">3 致高植<sup class="notelink"><a href="#m4">[4]</a></sup></h3>

<p>我很抱歉，因为我不见访客已经好几年了。这也并非为了别的，只是那时见访的人多，分不出时间招待，又不好或见或不见，所以只得躲起来，现在还守着这老法子，希谅察为幸。</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[4] 此则据志淳作《鲁迅一事》（载1948年12月29日上海《大公报·大公园》）所引编入。原信写于1933年12月9日。<b>高植</b>（1910—1960），安徽芜湖人，翻译工作者。当时在南京中央大学就读，1934年毕业后在南京中山文化教育馆任编译员。</p>
