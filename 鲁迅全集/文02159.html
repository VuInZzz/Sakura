<p class="title1">341105</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">341105<sup>①</sup> 致徐懋庸</h3>

<p class="left">懋庸先生：</p>

<p>来信收到。我所见的关于O.W.<sup class="notelink"><a href="#m571">[571]</a></sup>的文章，却并不长，莫非后半段吗？稍暇当一查，倘相联的，当译补，再找黎先生校一下。</p>

<p>寄杜先生<sup class="notelink"><a href="#m572">[572]</a></sup>一笺，乞转寄为荷。</p>

<p>此上，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 顿首 <b>十一月五日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[571] O.W.指王尔德，参看340920信注〔2〕。</p>
<p class="noteitem">[572] <b>杜先生</b> 指窦隐夫。</p>
