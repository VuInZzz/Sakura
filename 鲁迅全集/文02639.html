<p class="title1">360826 致康小行</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">360826 致康小行<sup class="notelink"><a href="#m306">[306]</a></sup></h3>

<p class="left">小行先生：</p>

<p>来信收到。</p>

<p>《珂氏版面》印本无多，出版后即为预约及当地人士购去，现已无余，且不再版，故 来函所询之书未能奉寄，不胜抱歉！此复，敬候</p>

<p class="left">时绥</p>

<p class="right">树 上 <b>八月廿六</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[306] 此信由鲁迅口授，许广平代笔。<b>康小行</b>，未详。</p>
