<p class="title1">340423 致陈烟桥</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content"><p class="left">雾城先生：</p>

<p>廿一函并木刻二幅均收到。这回似乎比较的合理，但我以为烟还太小，不如索性加大，直连顶颠，而连黑边也不留，则恐怕还要有力。不知先生以为怎样。</p>

<p>MK木刻社已有信来，我想慢慢的印一本试试罢。</p>

<p>先生的作品，容我再看一回之后，仔细排定，然后再奉函借版。这回我想不必将版收罗完全，然后付印，凡入选之作，即可陆续印存，到得有二十余幅，然后订好发行的。</p>

<p>此复即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>二十三日</b></p>

</div>
