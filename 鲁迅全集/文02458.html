<p class="title1">351104</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">351104<sup>②</sup> 致萧军、萧红</h3>

<p class="left">刘兄 悄吟太太：</p>

<p>我想在礼拜三（十一月六日）下午五点钟，在书店等候，您们俩先去逛公园之后，然后到店里来，同到我的寓里吃夜饭。</p>

<p>专此，即祝</p>

<p class="left">俪祉。</p>

<p class="right">豫 上 <b>十一月四日</b></p>

</div>
