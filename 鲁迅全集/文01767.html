<p class="title1">330226 致李小峰</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content"><p class="left">小峰兄：</p>

<p>我需要《呐喊》，《彷徨》，《热风》，《华盖集》及《续编》，《而已集》各一部共六本，希于店友送校稿时一并携下，其代价则于版税中扣除为荷。</p>

<p>记得《坟》之纸版，似已由北新从未名社取来，但记不真切。未知是否，希便中示及。</p>

<p class="right">迅 上 <b>二月廿六日</b></p>
