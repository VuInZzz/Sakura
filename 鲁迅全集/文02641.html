<p class="title1">360828</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">360828<sup>①</sup> 致黎烈文</h3>

<p class="left">烈文先生：</p>

<p>昨在《立此存照》<sup class="notelink"><a href="#m313">[313]</a></sup>上所写笔名，究嫌太熟，倘还来得及，乞改为“晓角”是荷。</p>

<p>专此布达，并请</p>

<p class="left">著安。</p>

<p class="right">迅 顿首 <b>八月廿八晨</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[313] <b>《立此存照》</b> 即《立此存照》（一）、（二），后均收入《且介亭杂文末编》。</p>
