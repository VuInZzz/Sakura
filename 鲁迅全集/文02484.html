<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">351207<sup>②</sup> 致章锡琛</h3>

<p class="left">雪村先生：</p>

<p>惠书所说的里书和总目，其实正是本文的题目和分目。至于全书<sup class="notelink"><a href="#m621">[621]</a></sup>的小引（有无未定），总目和里书，还在我这里，须俟本文排完后交出，那时另用罗马字记页数，与本文不连。</p>

<p>所以现在就请将原稿的第一页，补排为1（2空白），目录补排为3。文章是5起，已在校样上改正了。</p>

<p>专此布复，并请</p>

<p class="left">道安。</p>

<p class="right">树 顿首 十二月七日</p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[621] 指《海上述林》。</p>
