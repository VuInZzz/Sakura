<p class="title1">四〇</p>
<p class="date">第11卷 · 第二集 厦门——广州</p>
<br>
<div class="content"><p>　　（明信片背面）</p>

<p class="left">从后面（南普陀）所照的厦门大学全景。</p>

<p>前面是海，对面是鼓浪屿。</p>

<p class="left">最右边的是生物学院和国学院，第三层楼上有<img class="inline" alt="" src="./images/image06450.jpeg"/>记的便是我</p>

<p>所住的地方。</p>

<p>昨夜发飓风，拔木发屋，但我没有受损害。</p>

<p class="right">迅。九，十一。</p>

<p>　　（明信片正面）</p>

<p>想已到校，已开课否？</p>

<p>此地二十日上课。</p>

<p class="right">十三日。</p>

</div>
