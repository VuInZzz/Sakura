<p class="title1">330830 致开明书店</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content"><p>径启者：顷得未名社来函并收条。函今寄奉；其收条上未</p>

<p>填数目及日期，希即由</p>

<p>贵局示知，以便填写并如期走领为荷。此请</p>

<p class="left">开明书店台鉴</p>

<p class="right">鲁迅 启 <b>八月卅日</b></p>

<p>回信请寄“北四川路底内山书店转周豫才收”。</p>

</div>
