<p class="title1">350525</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350525<sup>②</sup> 致黄源</h3>

<p class="left">河清先生：</p>

<p>《世界文库》已见过，《死魂灵》中错字不少，有几处自己还知道那一个字错，有些是连自己也不记得了。将来印起来，又要费一番查原本的工夫。</p>

<p>于是想，生活书店不知道能将排过之原稿还我否？那么，将来可以省力不少。所以想请 先生到校对先生那里去运动一下，每期把它取回来。大约书店是用不着这稿子的了。</p>

<p>专此布达，即请</p>

<p class="left">撰安。</p>

<p class="right">迅 上 <b>五月廿五日</b></p>

</div>
