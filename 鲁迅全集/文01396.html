<p class="title1">260810 致陶元庆</p>
<p class="date">第11卷 · 一九二六年</p>
<br>
<div class="content"><p class="left">璇卿兄：</p>

<p>《彷徨》书面的锌版已制成，今寄上草底，请将写“书名”“人名”的位置指出，仍寄敝寓，以便写入，令排成整版。</p>

<p class="right">鲁迅 八月十日</p>
