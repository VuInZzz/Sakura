<p class="title1">331119 致徐懋庸</p>
<p class="date">第12卷 · 一九三三年</p>
<br>
<div class="content"><p class="left">懋庸先生：</p>

<p>十六信收到。</p>

<p>Teneromo当非日本人，但即为别国人，此姓亦颇怪。</p>

<p>Jokai非“正介”，“正介”之日本读法，当为Shoukai或Shōkai，或Tadasuke，与Jokai相差更远，此字只可存疑矣。</p>

<p>九三页的两句话，据日译本，当作“莫斯科的住下（谓定居于莫斯科），什么都安排好了……”看起语气来，似较妥，因托尔斯泰之至莫斯科，其实不过卜居，并非就职的。</p>

<p>此复，即颂</p>

<p class="left">著安</p>

<p class="right">迅 上 <b>十一月十九夜</b></p>

</div>
