<p class="title1">350722</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350722<sup>②</sup> 致曹靖华</h3>

<p class="left">汝珍兄：</p>

<p>前三四天托书店寄上书籍两包，内有《文学百科全书》<sup class="notelink"><a href="#m404">[404]</a></sup>一本，不知已收到否？</p>

<p>今天得郑君答复，谓学校内情形复杂，农兄事至少在这半年内，无可设法云云。大约掣肘者多，诸事不能放手做去，郑虽为文学院长，恐亦无好效果的。</p>

<p>上海已大热十多天。弟等均安，请释念。</p>

<p>致农兄一笺，乞便中转交。</p>

<p>此布，即请</p>

<p class="left">暑安。</p>

<p class="right"><b>弟</b>豫 顿首 <b>七月廿二日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[404] <b>《文学百科全书》</b> 即《苏联文学百科全书》。</p>
