<p class="title1">351118</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">351118<sup>③</sup> 致曹靖华</h3>

<p class="left">汝珍兄：</p>

<p>日前收到一些刊物<sup class="notelink"><a href="#m588">[588]</a></sup>，即托书店转寄，大约有四包，不知已收到否？</p>

<p>今天得了E君一封信，今寄上，请兄译示为荷。</p>

<p>前一些时这里颇多谣言，现在安静了。我们一动也没有动，不过四邻搬掉的多，冷静而已。今天又已在渐渐的搬回来。</p>

<p>寓中大小均安，请释念。</p>

<p>专此布达，即请</p>

<p class="left">近安。</p>

<p class="right"><b>弟</b>豫 上 <b>十一月十八日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[588] 指从莫斯科寄来的刊物。</p>
