<p class="title1">361010</p>
<p class="date">第14卷 · 一九三六年</p>
<br>
<div class="content">361010<sup>②</sup> 致黄源</h3>

<p class="left">河清先生：</p>

<p>续呈广告一纸<sup class="notelink"><a href="#m373">[373]</a></sup>，希赐揩油登载为感。</p>

<p>今日往上海大戏院观普式庚之Dubrovsky（华名《复仇遇艳》，闻系检查官所改），觉得很好，快去看一看罢。</p>

<p>专此布达，即请</p>

<p class="left">撰安。</p>

<p class="right">迅 上 <b>十夜。</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[373] 即联华书局有关鲁迅等人九种著译的广告，载《译文》新二卷第二期（1936年10月）。</p>
