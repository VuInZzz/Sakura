<p class="title1">350127</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content">350127<sup>①</sup> 致孟十还</h3>

<p class="left">十还先生：</p>

<p>来函奉到。三十日定当趋前领教。致黎茅二位柬，已分别转寄了。</p>

<p>专此奉复，即颂</p>

<p class="left">时绥。</p>

<p class="right">迅 上 <b>一月二十七日</b></p>

</div>
