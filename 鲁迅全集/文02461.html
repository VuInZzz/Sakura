<p class="title1">351109 致赵家璧</p>
<p class="date">第13卷 · 一九三五年</p>
<br>
<div class="content"><p class="left">家璧先生：</p>

<p>得来信并蒙赠书一本<sup class="notelink"><a href="#m573">[573]</a></sup>，谢谢。</p>

<p>《死魂灵》第一部，平装者已订成，布面装订者，尚须迟数天，一俟订好，当奉呈。长序亦译自德文本，并不精彩，倒是附录颇有趣。</p>

<p>来信说要印花二千。不知是一共二千，还是每种二千？希示遵办。</p>

<p>专此布达，即请</p>

<p class="left">撰安。</p>

<p class="right">迅 顿首 <b>十一月九日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[573] <b>赠书</b> 指《小哥儿俩》，凌叔华作，1935年上海良友图书印刷公司出版。</p>
