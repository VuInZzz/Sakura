<p class="title1">341116</p>
<p class="date">第13卷 · 一九三四年</p>
<br>
<div class="content">341116<sup>②</sup> 致曹靖华</h3>

<p class="left">汝珍兄：</p>

<p>两信均收到。冈信已发。碑文<sup class="notelink"><a href="#m586">[586]</a></sup>我一定做的，但限期须略宽，当于月底为止，寄上。因为我天天发热，躺了一礼拜了，好像是流行性感冒，间天在看医生，大约再有一礼拜，总可以好了。</p>

<p>女人和孩子却都好的。请勿念。</p>

<p>专此奉复，即请</p>

<p class="left">冬安。</p>

<p class="right"><b>弟</b>豫 拜上 <b>十一月十六日</b></p>

<hr>
<div class="notes"><p class="notetitle">注　释</p>
<p class="noteitem">[586] <b>碑文</b> 指为曹靖华父亲曹培元作《河南卢氏曹先生教泽碑文》，后收入《且介亭杂文》。</p>
