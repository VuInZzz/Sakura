<p class="title1">查尔斯·达尔文</p>
<p class="date">简体文字版 · OCR 整理</p>
<br>
<blockquote><font color="#000066">英国生物学家、博物学家，生物进化论的奠基人（1809—1882）。生于什鲁斯伯里，就学于爱丁堡大学与剑桥大学。1831—1836 年随"小猎犬号"环球考察，在加拉帕戈斯群岛等地的观察为学说积累了关键材料。1859 年出版《物种起源》，提出以自然选择为核心的生物进化理论，从根本上改变了人类对生命世界的认识；后又发表《人类的由来》《动物和植物的表情》等，把进化论推广到人类起源与行为研究。其学说与遗传学共同奠定现代生物学基础。以下为本站收录的中文著作。</font></blockquote>
