<p class="title1">路易斯·亨利·摩尔根</p>
<p class="date">简体文字版 · OCR 整理</p>
<br>
<blockquote><font color="#000066">美国人类学家、民族学家，古典进化论学派的代表人物（1818—1881）。生于纽约州奥罗拉，毕业于联合学院，长期从事律师职业，同时研究北美印第安人。他通过对易洛魁人的长期田野调查，揭示母系氏族的组织结构，并在《古代社会》中提出人类由蒙昧、野蛮走向文明的进化阶段论，探讨家庭、私有制与国家的起源。马克思、恩格斯高度评价其发现，恩格斯据其成果写成《家庭、私有制和国家的起源》。另著《美洲土著的房屋和家庭生活》。以下为本站收录的中文著作。</font></blockquote>
