<p class="title1">斯塔夫里阿诺斯</p>
<p class="date">简体文字版 · OCR 整理</p>
<br>
<blockquote><font color="#000066">希腊裔美国历史学家，全球史（整体世界史）观的倡导者（1913—2004）。生于加拿大温哥华，获芝加哥大学博士学位，长期在美国多所大学任教。他主张打破以西方为中心、按国别割裂叙述的旧史学，从全球视野考察人类各文明的互动与交流。代表作《全球通史：从史前到 21 世纪》以全球史观重写世界历史，强调各地区、各民族之间的联系与相互影响，被译成多种文字，成为世界史教学的经典著作。以下为本站收录的中文著作。</font></blockquote>
