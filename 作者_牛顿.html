<p class="title1">艾萨克·牛顿</p>
<p class="date">简体文字版 · OCR 整理</p>
<br>
<blockquote><font color="#000066">英国物理学家、数学家、天文学家，经典力学体系的奠基人（1643—1727）。生于林肯郡，毕业于剑桥大学三一学院，后任该校教授与英国皇家学会会长。1687 年出版《自然哲学的数学原理》，提出三大运动定律与万有引力定律，建立起经典力学体系。他与莱布尼茨分别独立创立微积分，并在光学上发明反射望远镜、发现光的色散。其理论统治物理学两百余年，被视为近代科学的象征性人物。以下为本站收录的中文著作。</font></blockquote>
