<p class="title1">威廉·哈维</p>
<p class="date">简体文字版 · OCR 整理</p>
<br>
<blockquote><font color="#000066">英国生理学家、医学家，血液循环学说的创立者，近代生理学的奠基人之一（1578—1657）。生于肯特郡，毕业于剑桥大学，后获帕多瓦大学医学博士学位，曾任英国皇家医学院院长与王室御医。1628 年出版《心血运动论》（《论心脏与血液的运动》），通过解剖与实验论证血液在体内循环运行，推翻了统治千余年的盖伦血液潮汐说。这一发现被视为近代生理学诞生的标志。以下为本站收录的中文著作。</font></blockquote>
