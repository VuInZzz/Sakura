<p class="title1">艾思奇</p>
<p class="date">简体文字版 · OCR 整理</p>
<br>
<blockquote><font color="#000066">中国马克思主义哲学家、教育家（1910—1966），云南腾冲人，原名李生萱。早年赴日本留学，归国后投身左翼文化运动。1936 年出版的《大众哲学》以通俗语言阐释辩证唯物主义与历史唯物主义，把哲学从书斋引向大众，影响了一代青年，他因此被称为"大众哲学家"。他长期在延安工作，后任中央党校副校长等职，参与新中国的哲学教育与研究，是中国马克思主义哲学大众化的奠基者之一。以下为本站收录的中文著作。</font></blockquote>
