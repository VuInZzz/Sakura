<p class="title1">陈玙</p>
<p class="date">简体文字版 · OCR 整理</p>
<br>
<blockquote><font color="#000066">中国当代作家（1924—2005），辽宁人。早年参加革命工作，长期在东北从事文艺与新闻工作，后为辽宁作家协会专业作家。以长篇小说《夜幕下的哈尔滨》闻名，作品描写抗日战争时期哈尔滨的地下斗争，情节曲折、人物鲜明，曾被改编为广播小说与电视剧，影响广泛；另著有多部中长篇小说。其创作具有鲜明的东北地域色彩与时代气息。以下为本站收录的中文著作。</font></blockquote>
