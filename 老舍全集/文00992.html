<p class="title1">二</p>
<p class="date">第13卷，曲艺 诗文 · 歌唱伟大的党</p>
<br>
<div class="content"><p class="center">六亿五千万人民团结一致，</p>
<p class="center">六亿五千万人民同声颂扬：</p>
<p class="center">山河锦绣，伟大的国家，</p>
<p class="center">领导英明，伟大的党！</p>
<p class="center">流不尽扬子江，</p>
<p class="center">赞不完共产党，</p>
<p class="center">壮阔扬子江，</p>
<p class="center">伟大共产党，</p>
<p class="center">自力更生，干劲冲天，</p>
<p class="center">党给我们无穷力量！</p>
<p class="center">前进，前进，走向繁荣，走向富强，</p>
<p class="center">跟着党走，党给我们无穷力量！</p>
</div>
