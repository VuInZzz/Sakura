<p class="title1">五</p>
<p class="date">第13卷，曲艺 诗文 · 内蒙即景</p>
<br>
<div class="content"><p class="center">舞帕飞旋锦扇开，</p>
<p class="center">万人争看二人台：</p>
<p class="center">霸王鞭响春风起，</p>
<p class="center">花雨缤纷燕去来。</p>
<p class="block">“二人台”是内蒙人民最喜爱的一个剧种。演员舞扇，舞巾，且舞霸王鞭，都很好看。舞帕飞旋，疾似春燕。</p>
</div>
