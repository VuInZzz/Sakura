<p class="title1">三 赠河北梆子剧院跃进剧团</p>
<p class="date">第13卷，曲艺 诗文 · 诗五首</p>
<br>
<div class="content"><p class="center">全民齐跃进，戏曲奋争先。</p>

<p class="center">壮士劈山去，

 <a href="#m4">

<sup>[4]</sup>

</a>

 英雄拦马前。

 <a href="#m5">

<sup>[5]</sup>

</a>

</p>

<p class="center">红旗明晓日，粉墨好青年。</p>

<p class="center">八月秦皇岛，歌潮浪接天。</p>

<p class="right">一九六三年八月于北戴河</p>
