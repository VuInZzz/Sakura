<p class="title1">为小朋友们作歌</p>
<p class="date">第13卷，曲艺 诗文 · 雪中行军</p>
<br>
<div class="content"><p class="center">一群小英雄</p>
<p class="center">生长战争中</p>
<p class="center">看惯了飞机——不害怕</p>
<p class="center">长大也去学航空</p>
<p class="center">听惯了枪炮——不害怕</p>
<p class="center">为国报仇有心胸</p>
<p class="center">打倒东洋小鬼</p>
<p class="center">中华有好儿童</p>
<p class="center">大中华 好儿童</p>
<p class="center">爱国的小英雄</p>
<p><br/>
</p>
<p class="center">谁是小英雄</p>
<p class="center">爱国挺起胸</p>
<p class="center">哪怕年纪小——志气大</p>
<p class="center">长大拿枪把敌攻</p>
<p class="center">谁说拳头小——志气大</p>
<p class="center">打败日本立奇功</p>
<p class="center">中华多么可爱</p>
<p class="center">我是中华儿童</p>
<p class="center">大中华 好儿童</p>
<p class="center">爱国的小英雄</p>
<p class="right1">原载1938年4月4日《武汉日报》</p>
</div>
