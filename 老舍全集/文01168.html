<p class="title1">诗一首</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content"><p class="center">弹唱共迎春，迎春歌曲新。</p>
<p class="center">单弦流雅韵，快板奋精神。</p>
<p class="center">学逗相声巧，因缘啼笑真。</p>
<p class="center">莲花落不尽，创造总惊人！</p>
<p class="block">一九六三年春节写赠北京曲艺团诸友并祝健康愉快。</p>
<p class="right1">原载1963年1月29日《北京晚报》</p>
