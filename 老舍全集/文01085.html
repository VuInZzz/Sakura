<p class="title1">一 心热冬天花也开</p>
<p class="date">第13卷，曲艺 诗文 · 为内蒙古百万民歌展览会献诗</p>
<br>
<div class="content">一 心热冬天花也开

 <a href="#m3">

<sup>[3]</sup>

</a>

</h3>

<p class="center">心热冬天花也开，</p>

<p class="center">百万民歌内蒙来。</p>

<p class="center">来到北京人人爱，</p>

<p class="center">都说群众是天才。</p>
