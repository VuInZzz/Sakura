<p class="title1">一</p>
<p class="date">第14卷，散文 杂文 · 未成熟的谷粒</p>
<br>
<div class="content"><p>我最大的苦痛，是我知道的事情太少。使我心里光亮起来的理论，并不能有补于创作——它教给了我怎么说，而没教给我说什么。啊，丰富的生活才是创作的泉源吧？</p>
</div>
