<p class="title1">一 长沙国庆日</p>
<p class="date">第13卷，曲艺 诗文 · 诗三首</p>
<br>
<div class="content"><p class="center">长沙国庆日，万众大游行：</p>
<p class="center">旗展风轻舞，云开花倍明。</p>
<p class="center">相邀争跃进，团结是长城。</p>
<p class="center">歌唱新中国，声声到北京。</p>
</div>
