<p class="title1">四</p>
<p class="date">第13卷，曲艺 诗文 · 贺北京市美术展览会开幕</p>
<br>
<div class="content"><p class="center">工农兵献礼，</p>
<p class="center">美术壮新军。</p>
<p class="center">跃进争光彩，</p>
<p class="center">山川蔚绵云。</p>
<p class="block">展览会有工农兵作品，向建国十周年献礼。</p>
<p class="right1">原载1959年10月3日《北京日报》</p>
