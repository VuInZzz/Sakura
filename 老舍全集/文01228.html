<p class="title1">赠黎波</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">赠黎波

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">译笔辛劳谁最多，</p>

<p class="center">东京樱节识黎波。</p>

<p class="center">新潮黄海文澜阔，</p>

<p class="center">压倒西风鬼唱歌。</p>

<p class="right1">一九六五年四月十日于东京</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 本篇据手迹收入。</p>
