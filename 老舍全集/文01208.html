<p class="title1">咏茶</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">咏茶

 <a href="#m2">

<sup>[2]</sup>

</a>

</h2>

<p class="center">春风春日采新茶，</p>

<p class="center">生产徽州天下夸；</p>

<p class="center">屯绿祁红好姊妹，</p>

<p class="center">淡妆浓抹总无瑕。</p>

<p class="right">一九六四年八月二十四日题赠老舍于交际处</p>
