<p class="title1">赠申凤梅</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">赠申凤梅

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">东风骀荡百花开，</p>

<p class="center">越调重兴多俊才，</p>

<p class="center">香满春城梅不傲，</p>

<p class="center">更随桃李拜师来。</p>

<p class="block">凤梅同志越调能手，生旦不挡，悲喜咸宜，一九六三年春来京公演，内外行争誉成功，而不自满，拜温如先生学艺因献小诗致贺即乞正教适苦脑疾未事推敲文字为憾。</p>

<p class="right">一九六三年四月</p>
