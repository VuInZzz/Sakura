<p class="title1">十九</p>
<p class="date">第14卷，散文 杂文 · 未成熟的谷粒</p>
<br>
<div class="content"><p>文人相轻是件极自然的事。每个文人都多少有点才气。每个文人在创作的时候都愿把全力用出来。这样，他的辛苦使他没法不自信自傲，看不起别人和不易接受别人的批评，几乎是理当如此。能闯过这由卖力气而自傲的一关，进到虚心大度，才能由自傲而自尊，才能觉得认清自己的毛病，承认自己的短处，正是自策自励所当取的态度——这可不很容易。</p>
</div>
