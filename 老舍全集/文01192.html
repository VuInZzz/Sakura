<p class="title1">国庆逢秋节</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content"><p class="center">国庆逢秋节，</p>
<p class="center">芙蓉映桂花。</p>
<p class="center">灯红歌不歇，</p>
<p class="center">明月照长沙。</p>
<p class="block">我同胡絜青在这里参加国庆活动。国庆前夕，絜青同志画了一幅画，送给湖南省博物馆，画的是芙蓉和桂花，还有一个红灯，我想画的意思就是庆祝国庆，而且国庆与中秋连接着，所以芙蓉和桂花象征着两个节日，灯笼就是庆祝的意思。我题了一首小诗。</p>
<p class="right1">原载1963年10月3日《新湖南报》</p>
