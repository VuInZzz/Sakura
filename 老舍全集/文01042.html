<p class="title1">题静庐</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>

<div class="content">题静庐

 <a href="#m1">

<sup>[1]</sup>

</a>

 归雁图</h2>

<p class="center">夜半霜霾秋入微，</p>

<p class="center">月明松寂雁低飞，</p>

<p class="center">传闻南国多烽火，</p>

<p class="center">红豆应怜粱稻肥。</p>

<p class="right1">原载1942年5月13日《时事新报》</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 静庐，即陈半丁（1876—1970），浙江绍兴人。美术家。</p>
