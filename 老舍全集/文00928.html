<p class="title1">三</p>
<p class="date">第13卷，曲艺 诗文 · 海外新声</p>
<br>
<div class="content"><p class="center">你们挨饿受冻伴着荒岛，</p>
<p class="center">为什么不在这里听杜威、罗素？</p>
<p class="center">要设法超度他们，</p>
<p class="center">快快脱了军国的劫数！</p>
<p class="right">民国十年二月五日</p>
<p class="right1">原载1921年4月1日日本广岛高等师范中华留广新声社《海外新声》第一卷第二期</p>
<hr/>
<p class="note"><a id="m1"></a>
 [1]
 本篇发表时署名“舍予”。</p>
