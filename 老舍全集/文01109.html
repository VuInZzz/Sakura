<p class="title1">四</p>
<p class="date">第13卷，曲艺 诗文 · 包头颂</p>
<br>
<div class="content"><p class="center">跃进边城起壮图，</p>
<p class="center">从无到有建钢都。</p>
<p class="center">光芒天外三千丈，</p>
<p class="center">霞蔚云蒸七宝炉。</p>
</div>
