<p class="title1">自光明顶至始信峰</p>
<p class="date">第13卷，曲艺 诗文 · 黄山之游——致郭老</p>
<br>
<div class="content"><p class="center">玉柱擎天云海开 登峰始信胜蓬莱</p>
<p class="center">石猿无语歌声起 人自光明顶上来</p>
