<h3 id="c071">一九三六年</h3>

<p>……这是我的重头戏

 <a href="#m2">

<sup>[2]</sup>

</a>

 ，好比谭叫天唱《定军山》……是给行家看的。……</p>

<p class="right1">引自陶亢德：《本刊一年》</p>

<p class="right1">原载1936年9月16日《宇宙风》第二十五期</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 这是作者给《宇宙风》编辑的书信节录。</p>

<p class="note"><a id="m2"></a>

 [2]

 指在1936年9月16日《宇宙风》第二十五期上开始连载的长篇小说《骆驼祥子》。</p>
