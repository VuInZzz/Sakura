<p class="date">第15卷，散文 杂文 书信 · 书信</p>

<div class="content">致赵建源

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<h3 id="c222">一九五五年十月二十五日</h3>

<p class="left">赵建源同志：</p>

<p>来函收到。初中肄业，爱读文艺作品，并志愿将来成为一个作家，都是很好的。不过当前的课程是将来学问事业的基础，必须把它们搞好，教它们平均发展，不可偏好什么就侧重什么。课余有了时间不妨读读文艺书籍。此致</p>

<p class="left">敬礼</p>

<p class="right">老舍</p>

<p class="right">十，二五</p>

<p class="right1">原载1996年6月3日《新闻出版报》第一三八三期</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 赵建源，当时在山东某中学读初中二年级。</p>
