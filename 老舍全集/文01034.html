<p class="title1">为在华日本人民反战革命同盟会成立周年纪念题诗</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">为在华日本人民反战革命同盟会成立周年纪念题诗

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">一代和平风扫沙，海天雷雨斗龙蛇。</p>

<p class="center">旧潮垂死碧成血，大地重生春是家。</p>

<p class="center">小住巴山盟菊竹，待还瀛岛醉樱花。</p>

<p class="center">临流共誓同舟志，东海晨开万丈霞。</p>

<p class="right1">一九四一年七月二十日</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 本篇据手迹收入。</p>
