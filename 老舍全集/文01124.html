<p class="title1">三 达赉湖</p>
<p class="date">第13卷，曲艺 诗文 · 内蒙东部纪游</p>
<br>
<div class="content"><p class="center">丘原青未了，又到绿波前。</p>

<p class="center">湖阔三江水，鱼肥百草泉。</p>

<p class="center">白鸥翔紫塞，碧浪映霞天。</p>

<p class="center">回望满洲里南，边疆最北边。

 <a href="#m7">

<sup>[7]</sup>

</a>

</p>
