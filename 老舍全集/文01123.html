<p class="title1">二 陈旗草原</p>
<p class="date">第13卷，曲艺 诗文 · 内蒙东部纪游</p>
<br>
<div class="content"><p class="center">陈旗一碧到云边，

 <a href="#m4">

<sup>[4]</sup>

</a>

 莫谓江南景独妍；</p>

<p class="center">六月人归花满地，

 <a href="#m5">

<sup>[5]</sup>

</a>

 随时雨过翠连天。</p>

<p class="center">远丘流雪群羊下，大野惊风匹马还。</p>

<p class="center">隐隐牧歌何处起，遥看公社立炊烟。</p>

<p><br/>

</p>

<p class="center">主人好客手抓羊，

 <a href="#m6">

<sup>[6]</sup>

</a>

 乳酒酥油色色香。</p>

<p class="center">祝福频频难尽意，举杯切切莫相忘。</p>

<p class="center">老翁犹唱当年曲，少女新添时代装。</p>

<p class="center">蒙汉情深何忍别，天涯碧草话斜阳。</p>

</div>
