<p class="title1">三 过天津桥</p>
<p class="date">第13卷，曲艺 诗文 · 诗四首</p>
<br>
<div class="content"><p class="center">天津桥外古亭林，几代风流余鸟音！</p>
<p class="center">白鹤云间山色远，黄牛车缓柳阴深；</p>
<p class="center">桑麻未异丰年景，刀火偏多报国心；</p>
<p class="center">肯向鹃声卜末劫，金戈铁马动长吟！</p>
</div>
