<p class="title1">保我河山</p>
<p class="date">第13卷，曲艺 诗文 · 雪中行军</p>
<br>
<div class="content"><p class="center">高山大河，</p>
<p class="center">伟大中国！</p>
<p class="center">祖宗开创，</p>
<p class="center">万代安和。</p>
<p class="center">我们的土地，</p>
<p class="center">我们的山河，</p>
<p class="center">谁敢来犯，</p>
<p class="center">谁敢来夺？</p>
<p class="center">中华土地好，</p>
<p class="center">中华好汉多，</p>
<p class="center">命可舍，</p>
<p class="center">头可碎，</p>
<p class="center">要保住伟大中国。</p>
<p class="right1">原载1938年10月4日重庆《扫荡报》</p>
