<p class="title1">满堂红歌</p>
<p class="date">第13卷，曲艺 诗文 · 雪中行军</p>
<br>
<div class="content"><p class="center">红旗六千多面，</p>
<p class="center">一面红旗一位英雄！</p>
<p class="center">人民礼堂群英会，</p>
<p class="center">人民礼堂满堂红！</p>
<p><br/>
</p>
<p class="center">红旗六千多面，</p>
<p class="center">一面红旗一位先锋！</p>
<p class="center">先锋带头打胜仗，</p>
<p class="center">全军振奋满堂红！</p>
<p><br/>
</p>
<p class="center">红旗六千多面，</p>
<p class="center">一面红旗一位尖兵！</p>
<p class="center">登高一呼山海应，</p>
<p class="center">祖国建设满堂红！</p>
<p><br/>
</p>
<p class="center">红旗六千多面，</p>
<p class="center">一面红旗一位标兵！</p>
<p class="center">亿万豪杰闻风起，</p>
<p class="center">全民跃进满堂红！</p>
<p class="right1">原载1959年11月7日《北京晚报》</p>
</div>
