<p class="title1">二</p>
<p class="date">第13卷，曲艺 诗文 · 建国十周年大庆</p>
<br>
<div class="content"><p class="center">公社欢腾四海春，</p>
<p class="center">全民跃进寸阴新，</p>
<p class="center">红旗翠柏花齐放，</p>
<p class="center">歌舞东风六亿人。</p>
<p class="right1">原载1959年10月1日《北京晚报》</p>
