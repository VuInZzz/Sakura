<p class="title1">蜀江船歌</p>
<p class="date">第13卷，曲艺 诗文 · 雪中行军</p>
<br>
<div class="content"><p class="center">江是我们的路，</p>
<p class="center">船是我们的家。</p>
<p class="center">把准了舵呀，</p>
<p class="center">顺流而下，</p>
<p class="center">波涛滚滚，</p>
<p class="center">流到三峡。</p>
<p class="center">两岸的青山啊，</p>
<p class="center">开满了花。</p>
<p><br/>
</p>
<p class="center">云在山峰上绕，</p>
<p class="center">雾在江边上流，</p>
<p class="center">逆水行舟，</p>
<p class="center">热汗漓淋，</p>
<p class="center">来到忠州，</p>
<p class="center">灯火儿如星啊，</p>
<p class="center">在山上头。</p>
<p class="right1">原载1946年4月《歌曲选辑》第三辑</p>
</div>
