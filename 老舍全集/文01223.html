<p class="title1">一 昔年</p>
<p class="date">第13卷，曲艺 诗文 · 诗二首</p>
<br>
<div class="content"><p class="center">我昔生忧患，愁长记忆新；</p>
<p class="center">童年习冻饿，壮岁饱酸辛。</p>
<p class="center">滚滚横流水，茫茫末世人。</p>
<p class="center">倘无共产党，荒野鬼为邻！</p>
</div>
