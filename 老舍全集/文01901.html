<p class="title1">致于立群</p>
<p class="date">第15卷，散文 杂文 书信 · 书信</p>
<br>
<div class="content">致于立群

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<h3 id="c253">一九六五年七月二十二日</h3>

<p class="left">立群同志：</p>

<p>郭老书《送瘟神》大字收到，已送交医学科学院，并嘱代致谢！打油诗一首附奉，博郭老一笑！暑甚，恕不一一！致</p>

<p class="left">敬礼</p>

<p>絜青问您好！</p>

<p class="right">老舍</p>

<p class="right">七月二十二日</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 于立群（1916—1979），书法家，郭沫若夫人。</p>
