<p class="title1">四 赠赵家璧同志</p>
<p class="date">第13卷，曲艺 诗文 · 春游小诗</p>
<br>
<div class="content">四 赠赵家璧同志

 <a href="#m1">

<sup>[1]</sup>

</a>

</h3>

<p class="center">桃花红映锦江边，</p>

<p class="center">江上相逢又五年。</p>

<p class="center">酒热茶香谈笑里，</p>

<p class="center">相期干劲倍冲天。</p>

<p class="right1">原载1962年4月22日《文汇报》</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 赵家璧（1908—1997），上海松江人。编辑家、出版家。</p>
