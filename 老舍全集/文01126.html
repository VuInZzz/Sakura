<p class="title1">为四位京剧演员拜周信芳</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">为四位京剧演员拜周信芳

 <a href="#m1">

<sup>[1]</sup>

</a>

 为师贺诗</h2>

<p class="center">同心同德，</p>

<p class="center">春风桃李；</p>

<p class="center">包教包学，</p>

<p class="center">状元师徒。</p>

<p class="right1">原载1961年12月18日《北京日报》</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 周信芳（1895—1975），浙江慈溪人。京剧表演艺术家。</p>
