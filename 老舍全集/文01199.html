<p class="title1">赠李慕良</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">赠李慕良

 <a href="#m2">

<sup>[2]</sup>

</a>

</h2>

<p class="center">幼小喜丝弦，功成二十年。</p>

<p class="center">韵长声自远，意在手之先。</p>

<p class="center">春水流仍静，秋云断复连。</p>

<p class="center">翻新裁古调，歌舞倍增妍。</p>

<p class="right1">引自马少波：《李慕良和京剧音乐》</p>

<p class="right1">原载1990年5月26日《人民日报》</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 本篇据手迹收入。</p>

<p class="note"><a id="m2"></a>

 [2]

 本篇作于1963年。李慕良（生卒年不详），湖南长沙人。京剧琴师。</p>
