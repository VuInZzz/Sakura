<p class="title1">日月蚀之歌</p>
<p class="date">第13卷，曲艺 诗文 · 新诗</p>
<br>
<div class="content">日月蚀之歌

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">先生好比是太阳，</p>

<p class="center">我们地球围着它转，</p>

<p class="center">弟弟好比是月亮，</p>

<p class="center">它又围着我们转。</p>

<p class="center">只因走到一直线，</p>

<p class="center">也别打鼓且莫要打锣，</p>

<p class="center">听它慢慢地转。</p>
