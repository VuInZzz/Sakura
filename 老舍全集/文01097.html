<p class="title1">为胡絜青《桃花游鱼图》题诗</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">为胡絜青《桃花游鱼图》题诗

 <a href="#m2">

<sup>[2]</sup>

</a>

</h2>

<p class="center">细雨江南客欲归</p>

<p class="center">桃花流水小鱼肥</p>

<p class="center">莫怜晴日无聊赖</p>

<p class="center">绿柳青天白鹭飞</p>

<p>

<b>絜青画老舍题句</b>

 。</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 本篇作于1960年深秋，据手迹收入。</p>

<p class="note"><a id="m2"></a>

 [2]

 本篇作于1960年前后，据手迹收入。胡絜青（1905—2001），北京人。书画家，老舍夫人。</p>
