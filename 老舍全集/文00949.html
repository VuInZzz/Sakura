<p class="title1">二、出钱出力歌</p>
<p class="date">第13卷，曲艺 诗文 · 抗战民歌（二首）</p>
<br>
<div class="content"><p class="center">有钱多出钱，</p>
<p class="center">国亡钱不存；</p>
<p class="center">有力多出力，</p>
<p class="center">国亡身不存。</p>
<p class="center">中华好，地富何怕贫？</p>
<p class="center">百姓好，心好即黄金。</p>
<p class="center">毁家去救国，</p>
<p class="center">杀敌把命拼。</p>
<p class="center">有钱出钱，有力出力，</p>
<p class="center">保住中华传子孙。</p>
<p class="center">不出钱，不出力，</p>
<p class="center">失了江山绝子孙。</p>
<p class="right1">原载1938年11月12日重庆《扫荡报》</p>
<hr/>
<p class="note"><a id="m1"></a>
 [1]
 本篇中第一首《大家忙歌》，已作为歌词，由火克谱曲。</p>
