<p class="title1">四 赠东风豫剧团</p>
<p class="date">第13卷，曲艺 诗文 · 诗五首</p>
<br>
<div class="content"><p class="center">玉润珠圆花满枝，</p>

<p class="center">东风歌舞月移迟。</p>

<p class="center">新声应胜霓裳曲，</p>

<p class="center">爱唱多情郭老诗。

 <a href="#m6">

<sup>[6]</sup>

</a>

 一九六三年八月于秦皇岛之海员大楼</p>
