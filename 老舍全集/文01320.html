<p class="title1">二 伤心</p>
<p class="date">第14卷，散文 杂文 · 到武汉后</p>
<br>
<div class="content"><p class="block">遍地干戈举目哀，</p>
<p class="block">天南有国亦难来。</p>
<p class="block">人情鬼蜮乾坤死，</p>
<p class="block">士气云龙肝脑灰。</p>
<p class="block">贼党轻言拥半壁，</p>
<p class="block">流民掩泣避惊雷；</p>
<p class="block">更怜江汉风波急，</p>
<p class="block">艳舞妖歌尚浪催！</p>
</div>
