<p class="title1">四 梆子剧院</p>
<p class="date">第13卷，曲艺 诗文 · 津门咏</p>
<br>
<div class="content"><p class="center">气壮幽燕歌慨慷，</p>
<p class="center">一声云水几低昂，</p>
<p class="center">天津桥上春风舞，</p>
<p class="center">铁笛横吹梆子腔。</p>
<p class="right1">原载1978年《天津文艺》一月号</p>
<hr/>
<p class="note"><a id="m1"></a>
 [1]
 本篇作于1963年9月。</p>
