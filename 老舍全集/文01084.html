<p class="title1">赠陈叔通</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">赠陈叔通

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">夫子风流爱赤梅，</p>

<p class="center">月明不待美人来。</p>

<p class="center">晴霞红日花如海，</p>

<p class="center">枝是珊瑚珠是苔。</p>

<p class="block">因忆蜀中朱砂梅立春前放蕊香艳无比，故与素心腊梅予所喜爱。</p>
