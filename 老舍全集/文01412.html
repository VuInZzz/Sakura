<p class="title1">八</p>
<p class="date">第14卷，散文 杂文 · 滇行短记</p>
<br>
<div class="content"><p>中秋。莘田与我出了点钱，与研究所的学员们过节。吴晓铃先生掌灶，大家帮忙，居然作了不少可口的菜。饭后，在院中赏月，有人唱昆曲。午间，我同两位同学去垂钓，只钓上一二条寸长的小鱼。</p>
</div>
