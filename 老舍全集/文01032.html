<p class="title1">赠太虚法师</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">赠太虚法师

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">大雨冼星海，</p>

<p class="center">长虹万籁天，</p>

<p class="center">冰莹成舍我，</p>

<p class="center">碧野林风眠。</p>

<p class="block">三十年四月（民国），集当代艺术家笔名成小诗。写奉太虚法师教正。</p>

<p class="right1">引自叶德《老舍与佛教二三事》</p>

<p class="right1">原载1984年《法音》第一期</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 太虚（1889—1947），浙江崇德人。现代佛学大师。</p>
