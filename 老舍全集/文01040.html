<p class="title1">一</p>
<p class="date">第13卷，曲艺 诗文 · 集文艺界人名联句</p>
<br>
<div class="content"><p class="center">也频徐仲年，火雪明田间。</p>
<p class="center">大雨冼星海，长虹穆木天，</p>
<p class="center">佩弦卢霁野，振铎欧阳山。</p>
<p class="center">王语今空了，绀弩黄药眠。</p>
</div>
