<p class="title1">二十三</p>
<p class="date">第14卷，散文 杂文 · 未成熟的谷粒</p>
<br>
<div class="content"><p>晚会中，大家朗读新诗，极有趣。新诗读法，尚无规定，亦永难规定，不妨多方面试验。光未然先生有腔调有姿式，将来若有诗剧上演，必用此法。朱铭仙与高兰二先生清楚亲切，宜于警劝激励之作。我自己读诗如说话，取其自然流利，只宜于十数人的晚会中，在广大听众前必定失败。</p>
</div>
