<p class="title1">二 潼关炮声</p>
<p class="date">第13卷，曲艺 诗文 · 诗四首</p>
<br>
<div class="content"><p class="center">瓦砾纵横十万家，潼关依旧障京华。</p>
<p class="center">荒丘雨后萌青草，恶浪风前翻血花；</p>
<p class="center">堪笑晴雷惊鸟雀，誓凭古渡斗龙蛇；</p>
<p class="center">山河浩气争存灭，自有军容灿早霞！</p>
<p><br/>
</p>
<p class="center">一水惊蛇岸欲流，黄沙赤血撼天浮！</p>
<p class="center">奇兵无愧关河险，壮志同消今古仇；</p>
<p class="center">峪口新营嘶战马，山腰古道隐耕牛；</p>
<p class="center">连宵炮火声声急，静待军情斩贼头！</p>
</div>
