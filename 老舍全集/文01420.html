<p class="title1">十六</p>
<p class="date">第14卷，散文 杂文 · 滇行短记</p>
<br>
<div class="content"><p>剧本既已写成，就要离开昆明，多看一些地方。从文与之琳约上呈贡，因为莘田病初好，不敢走路，没有领我去，只好延期。我很想去，一来是听说那里风景很好，二来是要看看之琳写的长篇小说！——已经写了十几万字，还在继续的写。</p>
</div>
