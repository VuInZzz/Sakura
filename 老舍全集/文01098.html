<p class="title1">再集马派名剧</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content"><p class="center">——赠马连良

 <a href="#m1">

<sup>[1]</sup>

</a>

</p>

<p class="center">淮河营外火牛阵，</p>

<p class="center">天水关头白蟒台，</p>

<p class="center">三字经陈十道本，</p>

<p class="center">状元谱上百花开。</p>

<p class="right">辛丑立夏日</p>
