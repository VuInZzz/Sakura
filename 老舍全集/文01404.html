<p class="title1">四</p>
<p class="date">第14卷，散文 杂文 · 参加郭沫若先生创作二十五年纪念会感言</p>
<br>
<div class="content"><p>只把热情写在纸上，大概算不了诗人。我想，一个真正的诗人，必是手之所指，目之所视，都能使被指的被视的感到温暖。诗人是一团火，文字，言语，行动，都有热力；若只在纸上写些好听的，而在作人上心小如豆，恐怕也就写不出最光伟的东西来吧？好听与伟大还相距甚远。</p>
<p class="right">原载1941年11月21日《时事新报·青光》</p>
