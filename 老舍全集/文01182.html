<p class="title1">游秦皇岛</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">游秦皇岛

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">青山西北净无埃，风自东南远海来。</p>

<p class="center">天外舟归烟一缕，滩头浪卷雪千堆。</p>

<p class="center">潮连国际歌声起，水绕田园诗境回。</p>

<p class="center">灯塔长明不冻港，层楼今为海员开。</p>

<p class="right">一九六三年八月</p>
