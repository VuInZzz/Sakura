<p class="title1">登太白楼</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content"><p class="center">酒涌大江流，</p>
<p class="center">人登太白楼。</p>
<p class="center">诗歌光万丈，</p>
<p class="center">今古各千秋。</p>
<p class="right">一九六四年九月于安徽马鞍山</p>
<p class="right1">引自苗子文</p>
<p class="right1">原载1979年《淮河》一月号</p>
<hr/>
