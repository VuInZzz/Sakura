<p class="date">第13卷，曲艺 诗文 · 大好春光</p>

 跤冠军僧格表演</h3>
<p class="center">静如虎伏矫如龙，</p>
<p class="center">全力全心斗志浓！</p>
<p class="center">胜负随时争一秒，</p>
<p class="center">惊风急雨立青松！</p>
