<p class="title1">《抗日三字经》序</p>
<p class="date">第17卷，文论 · 文论</p>
<br>
<div class="content"><p>老向先生有文章下乡，与文章入伍的主张，意在以通俗文艺扶导激励民众与军士，期人人尽力，齐心扫灭倭敌，争得最后胜利。《抗日三字经》即本此旨写成，言简意显，人人能懂。我一方面庆祝他的成功，一方面希望他继续努力，多写多印这类的小册子，广为宣传，增加抗战的力量。</p>
<p class="right">老舍序于武昌</p>
<p class="right1">原载老向著《抗日三字经》，1938年3月三户图书印刷社初版</p>
