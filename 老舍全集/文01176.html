<p class="title1">一 赠申伸同志</p>
<p class="date">第13卷，曲艺 诗文 · 诗五首</p>
<br>
<div class="content"><p class="center">七月秦皇岛，云轻蝉韵幽。</p>
<p class="center">港深冬不冻，天爽暑如秋。</p>
<p class="center">目送千帆影，人登百尺楼。</p>
<p class="center">奇文竞创作，山海共风流。</p>
<p class="block">一九六三年伏日，河北廿余剧作家同来秦皇岛进行创作时，海员大楼建成，碧海门前，潮声入枕，诸贤寓此，奇文丽景，诚乐事也。申伸同志约予与文友会谈，获益受教匪浅。至为感激吟此留念呈致谢意。</p>
</div>
