<p class="title1">赠徐兰沅</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">赠徐兰沅

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">胸如乐海手如波，</p>

<p class="center">春水春风尽唱歌。</p>

<p class="center">晚岁勤栽桃与李，</p>

<p class="center">管弦交响壮山河。</p>

<p class="right">一九六二年二月</p>
