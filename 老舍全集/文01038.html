<p class="title1">四 贺冰心先生</p>
<p class="date">第13卷，曲艺 诗文 · 诗四章</p>
<br>
<div class="content">四 贺冰心先生

 <a href="#m2">

<sup>[2]</sup>

</a>

 移寓歌乐山</h3>

<p class="center">敢为流离厌战争，乾坤终古一浮萍；</p>

<p class="center">茅庐况足遮风雨，诗境何妨壮甲兵。</p>

<p class="center">移竹渐添窗影绿，飞花时共彩霞明；</p>

<p class="center">鸟声人语山歌乐，自有文章致太平！</p>

<p class="right">一九四一年</p>

<p class="right1">原载1941年8月23日《新蜀报·蜀道》</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 郭沫若（1892—1978），四川乐山人。现代诗人、戏剧家、历史学家。</p>

<p class="note"><a id="m2"></a>

 [2]

 冰心（1900—1999），福建长乐县人。现代女作家。</p>
