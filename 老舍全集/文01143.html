<p class="title1">一 参观闵行新城</p>
<p class="date">第13卷，曲艺 诗文 · 春游小诗</p>
<br>
<div class="content"><p class="center">闵行平地起新城，</p>
<p class="center">广厦千间一夜成。</p>
<p class="center">雨露三年花四面，</p>
<p class="center">双双紫燕闹春晴。</p>
<p><br/>
</p>
<p class="center">十年未作沪江游，</p>
<p class="center">十里洋场一笔勾。</p>
<p class="center">劳动人民干净土，</p>
<p class="center">桃花今日识风流。</p>
</div>
