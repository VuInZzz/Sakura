<p class="title1">贺日本前进座剧团成立三十周年</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content"><p class="center">古剧开新史，</p>
<p class="center">光芒万丈长，</p>
<p class="center">现身豪粉墨，</p>
<p class="center">昂首傲冰霜，</p>
<p class="center">舞障红霞映，</p>
<p class="center">歌云白鸽翔，</p>
<p class="center">东风天海阔，</p>
<p class="center">前进寿无疆。</p>
<p class="right1">原载1960年2月26日《人民日报》《祝日本前进座剧团永远前进》</p>
