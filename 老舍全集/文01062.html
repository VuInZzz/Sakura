<p class="title1">五 常四爷的中年</p>
<p class="date">第13卷，曲艺 诗文 · 《茶馆》群像</p>
<br>
<div class="content"><p class="center">生活困难，</p>
<p class="center">自食其力，</p>
<p class="center">遇见仇敌，</p>
<p class="center">还不服气。</p>
</div>
