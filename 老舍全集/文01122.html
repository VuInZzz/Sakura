<p class="title1">一 大兴安岭二首</p>
<p class="date">第13卷，曲艺 诗文 · 内蒙东部纪游</p>
<br>
<div class="content"><h4 id="d031">（一）</h4>

<p class="center">蝉声不到兴安岭，

 <a href="#m1">

<sup>[1]</sup>

</a>

 云冷风清暑自收。</p>

<p class="center">高岭苍茫低岭翠，幼林明媚母林幽。</p>

<p class="center">黄金时节千山雪，

 <a href="#m2">

<sup>[2]</sup>

</a>

 碧玉溪潭五月秋。</p>

<p class="center">消息松涛人语里，良材广厦遍神州。</p>

<h4 id="d032">（二）</h4>

<p class="center">岭上森林岭下田，牛肥香草乳如泉。</p>

<p class="center">层楼灯火添新景，小市歌声入远烟。</p>

<p class="center">伐木红旗明翠谷，运材铁轨接青天。</p>

<p class="center">山中父老神枪手，系马白桦射雉还。

 <a href="#m3">

<sup>[3]</sup>

</a>

</p>
