<p class="title1">赠玛拉沁夫</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">赠玛拉沁夫

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">文坛千里马，</p>

<p class="center">慷慨创奇文，</p>

<p class="center">农牧同欣赏，</p>

<p class="center">山河壮彩云。</p>

<p class="right1">引自玛拉沁夫《没有春天，咱们去创造！》</p>

<p class="right1">原载1979年《新港》五月号</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 本篇作于1963年4月。玛拉沁夫（1930— ），蒙古族。作家。</p>
