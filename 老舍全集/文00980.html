<p class="title1">大家的诗</p>
<p class="date">第13卷，曲艺 诗文 · 雪中行军</p>
<br>
<div class="content">大家的诗

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">大家的诗大家作，</p>

<p class="center">练习练习真不错。</p>

<p class="center">大家的诗大家念，</p>

<p class="center">这是咱们的文化站。</p>

<p class="center">大家的诗大家评，</p>

<p class="center">好诗传遍北京城。</p>

<p class="right1">原载1958年4月18日《人民日报》</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 《曲艺》编辑部当时在北京王府井北口人行道上创办了一块“街头说唱”牌。本篇是第一期的开场白。</p>
