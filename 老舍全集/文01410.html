<p class="title1">六</p>
<p class="date">第14卷，散文 杂文 · 滇行短记</p>
<br>
<div class="content"><p>正是雨季，无法出游。讲演后，即随莘田下乡——龙泉村。村在郊北，距城约二十里，北大文科研究所在此。冯芝生、罗膺中、钱端升、王了一、陈梦家诸教授都在村中住家。教授们上课去，须步行二十里。</p>
<p>研究所有十来位研究生，生活至苦，用工极勤。三餐无肉，只炒点“地蛋”丝当作菜。我既佩服他们苦读的精神，又担心他们的健康。莘田患恶性摆子，几位学生终日伺候他，犹存古时敬师之道，实为难得。</p>
<p>莘田病了，我就写剧本。</p>
</div>
