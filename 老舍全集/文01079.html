<p class="title1">为《集邮》杂志题词</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content"><p class="center">集邮长知识，</p>
<p class="center">嗜爱颇高尚，</p>
<p class="center">切莫去居奇，</p>
<p class="center">赚钱代欣赏。</p>
<p class="right1">原载1959年《集邮》第一期</p>
