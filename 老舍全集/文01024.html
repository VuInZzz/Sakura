<p class="title1">二 别凉州</p>
<p class="date">第13卷，曲艺 诗文 · 诗二章</p>
<br>
<div class="content"><p class="center">塞上秋云开晓日，天梯玉色雪如霞。</p>
<p class="center">乱山无树飞寒鸟，野水随烟入远沙。</p>
<p class="center">忍见村荒枯翠柳，敢怜人瘦比黄花！</p>
<p class="center">乡思空忆篱边菊，举目凉州雁影斜。</p>
<p class="right">一九四○年</p>
<p class="right1">原载1940年1月2日《新蜀报·蜀道》</p>
