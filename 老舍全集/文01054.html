<p class="title1">赠吴组缃</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">赠吴组缃

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">自南自北自西东，大地山河火狱中，</p>

<p class="center">各祷神明屠手足，齐抛肝脑决雌雄。</p>

<p class="center">晴雷一瞬青天死，弹雨经宵碧草空，</p>

<p class="center">若许桃源今尚在，也应铁马踏秋风。</p>

<p class="right">舍</p>
