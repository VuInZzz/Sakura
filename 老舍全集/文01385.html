<p class="title1">十八</p>
<p class="date">第14卷，散文 杂文 · 未成熟的谷粒</p>
<br>
<div class="content"><p>骂人并不是件容易的事。欲骂某人必洞悉其恶。若仅东拉西扯，说些闲白儿，是谓无中生有，罪在造谣，既骂不倒别人，反使自己心脏口臭。</p>
