<p class="title1">十七</p>
<p class="date">第14卷，散文 杂文 · 滇行短记</p>
<br>
<div class="content"><p>查阜西先生愿陪我去游大理。联大的友人们虽已在昆明二三年，还很少有到过大理的。大家都盼望我俩的计划能实现。于是我们就分头去接洽车子。</p>
<p>有几家商车都答应了给我们座位，我们反倒难于决定坐哪一家的了。最后，决定坐吴晓铃先生介绍的车，因为一行四部卡车，其中的一位司机是他的弟弟。兄弟俩一定教我们坐那部车，而且先请我们吃了饭，吃饭的时候，我笑着说：“这回，司机可教黄鱼给吃了！”</p>
</div>
