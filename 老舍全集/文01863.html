<p class="title1">致巴金</p>
<p class="date">第15卷，散文 杂文 书信 · 书信</p>
<br>
<div class="content">致巴金

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<h3 id="c197">一 一九五○年六月十日</h3>

<p class="left">巴金兄：</p>

<p>明天中午在全聚德请您吃烤鸭，有梅博士

 <a href="#m2">

<sup>[2]</sup>

</a>

 及王瑶卿老人等，务请赏光！祝</p>

<p class="left">安！</p>

<p class="right">弟舍</p>

<p class="right">六月十日</p>

<p class="right">亚平、李伯钊、赵树理</p>

<h3 id="c198">二 五十年代初</h3>

<p>会后我预备上琉璃厂，您愿同去否？若同去，咱们可顺手吃小馆。</p>

<p class="right">舍

 <a href="#m3">

<sup>[3]</sup>

</a>

</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 巴金（1904—2005），现代作家。</p>

<p class="note"><a id="m2"></a>

 [2]

 即梅兰芳。</p>

<p class="note"><a id="m3"></a>

 [3]

 此信无日期。</p>
