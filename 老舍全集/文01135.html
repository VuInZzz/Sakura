<p class="title1">三 赠澄海艺香潮剧团</p>
<p class="date">第13卷，曲艺 诗文 · 汕头行</p>
<br>
<div class="content"><p class="center">鲜花翠柏喜同堂，</p>
<p class="center">澄海春风百卉香。</p>
<p class="center">一曲宋元遗韵在，</p>
<p class="center">冠山韩水此情长。</p>
</div>
