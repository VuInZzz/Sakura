<p class="title1">二</p>
<p class="date">第13卷，曲艺 诗文 · 向毛主席唱出我们的决心</p>
<br>
<div class="content"><p class="center">各民族男女青年齐声歌唱，</p>
<p class="center">三面红旗高举，歌声响入青云，</p>
<p class="center">向伟大的导师毛主席，</p>
<p class="center">唱出革命的决心：</p>
<p class="center">钻研主席的理论，</p>
<p class="center">实践主席的教训，</p>
<p class="center">一定要用主席的思想武装自己，</p>
<p class="center">无愧革命事业的接班人！</p>
<p class="center">永远不变色，</p>
<p class="center">红旗代代新，</p>
<p class="center">无愧革命事业的接班人！</p>
</div>
