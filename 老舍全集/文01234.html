<p class="title1">呈郭老</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">呈郭老

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="block">读郭老《由王谢墓志的出土论到兰亭序的真伪》戏成一律录呈郭老博粲。</p>

<p class="center">右军乏策宋兰亭 郭老奇师阵气腾</p>

<p class="center">丹虎从凤原是女 神龙作浪化为僧</p>

<p class="center">书家时代难颠倒 科学精神避爱憎</p>

<p class="center">传说元权充铁证 墓碑跃跃出金陵</p>

<p class="right">老舍</p>

<p class="right">一九六五年七月二十二日</p>
