<p class="title1">十二</p>
<p class="date">第14卷，散文 杂文 · 未成熟的谷粒</p>
<br>
<div class="content"><p>写信与开会是两件费时间的事。可是，私心里却极愿接读友人们的信，也愿去到会场和友人们见面谈一谈；这就无法申冤了！</p>
