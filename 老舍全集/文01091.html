<p class="title1">三</p>
<p class="date">第13卷，曲艺 诗文 · 贺北京市美术展览会开幕</p>
<br>
<div class="content"><p class="center">泥面赢奇趣，</p>
<p class="center">民间艺术家。</p>
<p class="center">同沾甘雨露，</p>
<p class="center">老树放新花。</p>
<p class="block">展览品中有泥人、面人，推陈出新，为群众所喜。</p>
</div>
