<p class="title1">后记</p>
<p class="date">第16卷，文论 · 小花朵集</p>
<br>
<div class="content"><p>近二三年来，我又写了不少各种体裁的小文章。形式不同，内容各异，质量也或高或低。若把它们都编在一本集子里，必然杂乱无章。因此，我同意百花文艺出版社编辑同志们的意见：暂将那些与文艺问题有关的文章选编起来，以免乱七八糟。至于选用的文章是否都精彩，值得阅读，就不敢说了。</p>
<p>有些朋友颇喜爱《内蒙风光》这一篇游记，并嘱选入集内。可是，这样一来，便不能不稍打乱原来的辑选计划。故将它打入附录，以事两全。</p>
<p class="right1">老舍 一九六二年十一月于北京</p>
</div>
