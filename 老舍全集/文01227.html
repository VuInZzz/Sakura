<p class="title1">赠白土吾夫</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">赠白土吾夫

 <a href="#m2">

<sup>[2]</sup>

</a>

</h2>

<p class="center">白花笑对紫花开，</p>

<p class="center">土暖风轻春雨来。</p>

<p class="center">吾辈生涯爱劳动，</p>

<p class="center">夫随妇唱菜亲栽。</p>

<p class="right1">一九六五年春</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 本篇据手迹收入。土src="./images/Image00191.jpg"

 善麿（1885—1980），日本诗人。</p>

<p class="note"><a id="m2"></a>

 [2]

 本篇据手迹收入。白土吾夫（1927—？），日本中国文化交流协会专务理事。</p>
