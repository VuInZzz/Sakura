<p class="title1">二</p>
<p class="date">第14卷，散文 杂文 · 参加郭沫若先生创作二十五年纪念会感言</p>
<br>
<div class="content"><p>没有努力，天才或许反是个祸害。看，多少个自命不凡的才子，作了几句诗，或画一笔“山水”，便到处大言不惭的自称“时代之奇迹”！得志呢，便把艺术推在一旁，只在茶余酒后略作吟咏，以傲俗人；不得志呢，便一把鼻子一把泪的逢人便道：“怀才不遇”！这种人的确有点小聪明，而绝对的没有真诚。他们把摇头吟哦，皱眉低笑，代替了血汗；结果，聪明反被聪明误。没有努力，真的，天才是祸害！</p>
</div>
