<p class="title1">三</p>
<p class="date">第13卷，曲艺 诗文 · 向毛主席唱出我们的决心</p>
<br>
<div class="content"><p class="center">中华的老少男女齐声歌唱，</p>
<p class="center">三面红旗高举，歌声响入青云，</p>
<p class="center">向伟大的领袖毛主席，</p>
<p class="center">唱出革命的决心：</p>
<p class="center">不忘阶级斗争，</p>
<p class="center">投身生产斗争，</p>
<p class="center">用科学实验精神创造新事物，</p>
<p class="center">为建设社会主义献出终身！</p>
<p class="center">爱党爱人民，</p>
<p class="center">天下为己任，</p>
<p class="center">为建设社会主义献出终身！</p>
<p class="right">一九六五年</p>
<p class="right1">原载1979年《北京文艺》二月号</p>
