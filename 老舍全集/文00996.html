<p class="title1">三</p>
<p class="date">第13卷，曲艺 诗文 · 向第二届全运会献歌</p>
<br>
<div class="content"><p class="center">创造新纪录，</p>
<p class="center">戴上大红花，</p>
<p class="center">光荣归于共产党，</p>
<p class="center">革命的青年意气风发。</p>
<p class="center">勤学苦练，从难从严，</p>
<p class="center">不骄不怠，听党的话！</p>
<p class="center">高举毛泽东思想的红旗，</p>
<p class="center">心红身体壮，</p>
<p class="center">建设新中华！</p>
<p class="right1">原载1965年8月25日《体育报》</p>
