<p class="title1">六 歌舞晚会</p>
<p class="date">第13卷，曲艺 诗文 · 大好春光</p>
<br>
<div class="content"><p class="center">堂堂十五载，</p>
<p class="center">艺术发奇葩；</p>
<p class="center">节日琴谐瑟，</p>
<p class="center">春风“蝶恋花”；<b>（节目之一）</b>
</p>
<p class="center">高歌云水阔，<b>（宝音德力格，哈扎布唱民歌）</b>
</p>
<p class="center">急舞马刀斜；<b>（马刀舞）</b>
</p>
<p class="center">民族亲兄弟，</p>
<p class="center">欢声腾彩霞。</p>
</div>
