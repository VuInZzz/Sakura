<p class="title1">二</p>
<p class="date">第13卷，曲艺 诗文 · 诗 三 律</p>
<br>
<div class="content"><p class="center">晚风吹雾湿胶州，群岛微茫孤客愁！</p>
<p class="center">一夏繁华成海市，几重消息隔渔舟；</p>
<p class="center">不关宠辱诗心苦，每忆清高文骨遒。</p>
<p class="center">灯影摇摇潮上急，归来无计遣三秋！</p>
</div>
