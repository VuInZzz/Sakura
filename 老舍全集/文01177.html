<p class="title1">二 赠河北省歌舞剧院</p>
<p class="date">第13卷，曲艺 诗文 · 诗五首</p>
<br>
<div class="content"><p class="center">悲歌燕赵史堂堂，斗志于今百倍强。</p>
<p class="center">革命风云新乐府，翻身日月大文章。</p>
<p class="center">休哀日笛梅花落，善舞红旗丝竹昂。</p>
<p class="center">北去长城东至海，轻装小队入农庄。</p>
</div>
