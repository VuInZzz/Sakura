<p class="title1">题高龙生涂鸭图赠卜少夫</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">题高龙生涂鸭图赠卜少夫

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">堪怜小儿女</p>

<p class="center">衣冠似老人</p>

<p class="center">春水鸭先暖</p>

<p class="center">人独无青春</p>

<p>

<b>题赠少夫兄。</b>

</p>

<p class="right">三十年妇女节 老舍</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 本篇据手迹收入。卜少夫（1909—2000），江苏镇江人。新闻界人士、政论家。</p>
