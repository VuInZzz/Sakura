<p class="title1">《骆驼祥子》拉脱维亚文译本序</p>
<p class="date">第18卷，文论工作报告译文 · 文论</p>
<br>
<div class="content"><p>我非常高兴看到这本小书译成拉脱维亚文，与拉脱维亚朋友们见面。</p>
<p>这本书是二十多年前写成的。那时候，中国革命还未成功，劳动人民处在水深火热之中，“祥子”便是鲜明的一例。今天，我们越同情“祥子”，也越明白新社会的优越性，越热爱社会主义制度！</p>
<p>感谢译者，并祝中苏人民友好万古长青！</p>
<p class="right">一九六二年九月老舍于北京</p>
<p class="right1">原载《骆驼祥子》，1963年里加版</p>
