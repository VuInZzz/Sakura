<p class="title1">一</p>
<p class="date">第13卷，曲艺 诗文 · 胜利之年（歌二首）</p>
<br>
<div class="content"><p class="center">三十而立</p>
<p class="center">三十而立</p>
<p class="center">三十岁的中华民国</p>
<p class="center">五千年的人和地利</p>
<p class="center">经过多少艰险风波</p>
<p class="center">多少惊涛暴雨</p>
<p class="center">用血汗与干戈</p>
<p class="center">头颅与正气</p>
<p class="center">把患难击破，患难击破</p>
<p class="center">教历史永远自由独立</p>
<p class="center">每逢春风吹暖了黄河</p>
<p class="center">呕！这伟大的民族与土地</p>
<p class="center">便与黄莺，便与桃李</p>
<p class="center">齐唱青春之歌</p>
<p class="center">展开青春的美丽</p>
<p class="center">这永生之国</p>
<p class="center">至大至刚的民气</p>
<p class="center">永远像春日的灿烂明和</p>
<p class="center">今天哪 我们的中华民国</p>
<p class="center">刚刚三十而立</p>
</div>
