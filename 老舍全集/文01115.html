<p class="title1">一</p>
<p class="date">第13卷，曲艺 诗文 · 内蒙即景</p>
<br>
<div class="content"><p class="center">街排巷比宛如裁，</p>
<p class="center">户户窗前花盛开。</p>
<p class="center">双髻儿童争问客：</p>
<p class="center">缘何不到我家来？</p>
<p class="block">哲里木盟的大林公社是一面卫生红旗，街道干净，人家干净，常常有人从各处来参观学习。儿童们总愿意客人到自己家来访问，否则有些失望。人家里真干净，最突出的是堂屋里往往有一眼小井，为是用水方便。井上护以小木栏。打这么一眼小井只用四十多圆钱。正是：</p>
