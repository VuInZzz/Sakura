<p class="title1">火箭奔月</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content"><p class="center">莫说前人想象奇，于今奔月已无疑。</p>
<p class="center">不关灵药天同寿，自有精思星布棋。</p>
<p class="center">时代风流亲宇宙，和平竞赛判雄雌。</p>
<p class="center">苏联万岁春潮涌，首折蟾宫桂一枝。</p>
<p class="right1">原载1959年1月4日《光明日报》</p>
