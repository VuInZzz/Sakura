<p class="title1">二 过澄海三大桥</p>
<p class="date">第13卷，曲艺 诗文 · 汕头行</p>
<br>
<div class="content"><p class="center">昔从澄海到汕头，野水荒沙旅客愁。</p>
<p class="center">众志成城争跃进，万家移石断中流。</p>
<p class="center">人民智慧虹为路，堤岸光辉月入沟。</p>
<p class="center">寒食秧田千顷碧，飞花满县冠山游。</p>
</div>
