<p class="title1">二 赠鲤声剧团</p>
<p class="date">第13卷，曲艺 诗文 · 诗三首</p>
<br>
<div class="content"><p class="center">可爱莆仙剧，风流世代传；</p>
<p class="center">弦歌八百曲，珠玉五千篇；</p>
<p class="center">魂断团圆后，神移笑语前；</p>
<p class="center">春光芳草碧，莺啭艳阳天。</p>
</div>
