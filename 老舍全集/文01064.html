<p class="title1">七 康六（牛星丽饰）和他的女儿康顺子（梁菁饰）</p>
<p class="date">第13卷，曲艺 诗文 · 《茶馆》群像</p>
<br>
<div class="content"><p class="center">国乱民贫，</p>
<p class="center">农村破产。</p>
<p class="center">卖女卖儿，</p>
<p class="center">苟延残喘。</p>
</div>
