<p class="title1">赠梅阡</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">赠梅阡

 <a href="#m3">

<sup>[3]</sup>

</a>

</h2>

<p class="center">桔柚花香迎客舟，一帆春雨渡汕头。</p>

<p class="center">海门回望千峰涌，港口雄开万里流。</p>

<p class="center">弦管倾城唐宋曲，嵌雕绝技鬼神愁。</p>

<p class="center">红棉白鸟诗情在，况有潮声微似秋。</p>

<p class="right">一九六二年</p>
