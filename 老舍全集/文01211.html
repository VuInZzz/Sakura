<p class="title1">游合肥包公祠</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content"><p class="center">祠前游侣赏秋莲，</p>
<p class="center">冷淡包公岂偶然。</p>
<p class="center">今日人民作了主，</p>
<p class="center">红旗飘处即青天。</p>
<p class="block">游合肥包公祠戏题。</p>
<p class="right">一九六四年九月</p>
<p class="right1">引自苗子文</p>
<p class="right1">原载1979年《淮河》一月号</p>
