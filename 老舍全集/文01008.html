<p class="title1">一</p>
<p class="date">第13卷，曲艺 诗文 · 《论语》两岁</p>
<br>
<div class="content"><p class="center">共谁挥泪倾甘苦？惨笑唯君堪语愁！</p>
<p class="center">半月鸡虫明冷暖，两年蛇鼠悟春秋；</p>
<p class="center">衣冠到处尊禽兽，利禄无方输马牛。</p>
<p class="center">万物静观咸自得，苍天默默鬼啾啾。</p>
</div>
