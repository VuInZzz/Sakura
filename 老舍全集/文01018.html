<p class="title1">抛锚之后</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content"><p class="center">一去二三里</p>
<p class="center">抛锚四五回</p>
<p class="center">下车六七次</p>
<p class="center">八九十人推</p>
<p>
<b>赠汉中司机沈堂印</b>
 。</p>
<p class="right">一九三九年 老舍</p>
</div>
