<p class="title1">三</p>
<p class="date">第13卷，曲艺 诗文 · 即事</p>
<br>
<div class="content"><p class="center">狂欢胜似过新年，</p>
<p class="center">彻地通天喜气连。</p>
<p class="center">月殿嫦娥歌且舞，</p>
<p class="center">和平万岁祝人间。</p>
<p class="right1">原载1959年1月4日《北京日报》</p>
