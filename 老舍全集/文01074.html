<p class="title1">赠荀慧生</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">赠荀慧生

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">荀生胸有好山川，</p>

<p class="center">笔下风流胜自然。</p>

<p class="center">赠我云林一段景，</p>

<p class="center">长松巨瀑接青天。</p>

<p>

<b>慧生老友为画扇吟此致谢。</b>

</p>

<p class="right">一九五八年八月时全国曲艺代表在首都会演</p>

<p class="block">四大演员于剧艺多所创造，复精绘事，真艺术界之多面手。予藏有梅、程、尚三公作品，今得荀公笔墨，交映生辉，可傲人矣。</p>

<p class="right1">舍再题</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 本篇据手迹收入。荀慧生（1900—1968），河北东光人。京剧表演艺术家。</p>
