<p class="title1">庆元宵</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">庆元宵

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">今年庆元宵，</p>

<p class="center">大雪下的好；</p>

<p class="center">来年庆丰收，</p>

<p class="center">四时春不老。</p>

<p class="right1">引自郭树荣《四时春不老——记老舍先生一首诗》</p>

<p class="right1">原载1979年2月3日《北京日报》</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 本篇作于1960年2月11日。当时，北京市文学艺术工作者联合会举行元宵灯节联欢晚会，作者参加并即席赋诗。</p>
