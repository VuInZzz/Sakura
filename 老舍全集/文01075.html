<p class="title1">赠斯特朗</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">赠斯特朗

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">国际精神致太平，</p>

<p class="center">寿星今在北京城。</p>

<p class="center">蟠桃一熟三千岁，</p>

<p class="center">喜见如霞花正明。</p>

<p class="block">斯特朗同志长寿，胡絜青画，老舍题句同贺。</p>

<p class="right">一九五八年十一月二十四日 北京</p>
