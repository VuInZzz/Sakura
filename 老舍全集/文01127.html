<p class="title1">一</p>
<p class="date">第13卷，曲艺 诗文 · 春节饯友</p>
<br>
<div class="content"><p class="center">逢君去远行，</p>
<p class="center">歌舞动春城；</p>
<p class="center">更进一杯酒，</p>
<p class="center">文雄万里程。</p>
</div>
