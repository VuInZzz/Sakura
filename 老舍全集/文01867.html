<p class="title1">致张永年</p>
<p class="date">第15卷，散文 杂文 书信 · 书信</p>
<br>
<div class="content">致张永年

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<h3 id="c203">五十年代初</h3>

<p class="left">永年同志：</p>

<p>谢谢信！因忙，简复如下：</p>

<p>保存印象是有用的，因写到云，即能描写云，写到风即可描写风。印象积累的越多越好。</p>

<p>有意义的事当然要搜集，这是写东西的骨干资料。</p>

<p>造房既要木料，砖瓦，也要钉子，油漆。不可偏缺。</p>

<p>匆匆，致</p>

<p class="left">敬！</p>

<p class="right">老舍</p>

<p class="right">三，四</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 张永年当时在安徽省电力设计院工作。</p>
