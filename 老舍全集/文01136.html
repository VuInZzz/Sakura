<p class="title1">四 赠广东潮剧院</p>
<p class="date">第13卷，曲艺 诗文 · 汕头行</p>
<br>
<div class="content"><p class="center">莫夸骑鹤下扬州，</p>
<p class="center">渴慕潮汕几十秋。</p>
<p class="center">得句驰书傲子女，</p>
<p class="center">春宵听曲在汕头。</p>
<p><br/>
</p>
<p class="center">姚黄魏紫费评章，</p>
<p class="center">潮剧春花色色香。</p>
<p class="center">听得汕头一夕曲，</p>
<p class="center">青山碧海莫相忘。</p>
<p class="right">一九六二年四月</p>
<p class="right1">原载1962年4月17日《羊城晚报》</p>
</div>
