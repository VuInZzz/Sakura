<p class="title1">赠广州部队战士话剧团</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content"><p class="center">南国芦笙塞北笳，工兵四海好为家。</p>

<p class="center">云峰昨辟通天路，水库今开遍地花。</p>

<p class="center">壮丽关山迎晓日，风流人物在中华。</p>

<p class="center">英雄姓字君休问，集体光荣最可夸。</p>

<p class="block">解放军广州部队战士话剧团来京演出《英雄工兵》留念</p>

<p class="right">一九六五年中秋 老舍</p>

<p class="right1">原载1965年9月20日《解放军报》</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 本篇据手迹收入。</p>
