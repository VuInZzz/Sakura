<p class="title1">序</p>
<p class="date">第16卷，文论 · 老牛破车</p>
<br>
<div class="content"><p>书名《老牛破车》，在第一段开头有简单说明，即不再叨唠。从（一）到（九）都是照原来计划，自评作品——打《老张的哲学》说到《牛天赐传》。作品只有此数，本当就此打住，哪知还得出书，相应凑些字儿。所以又写了（十）至（十四）。不能预评将来的书，勉强谈点作小说的技巧。对否不敢说，有用不呢，您瞧着办。是为序。</p>
<p class="right1">老舍</p>
<p class="right1">一九三六年秋，青岛</p>
