<p class="title1">二十四</p>
<p class="date">第14卷，散文 杂文 · 未成熟的谷粒</p>
<br>
<div class="content"><p>无聊的话虽每起于：（一）以甲衡乙；（二）以己度人。前者，譬如说：甲乐善好施，而论者遂讥乙不如甲，不知甲为富翁，而乙乃寒士，怎能相比。后者，自己好名，遂以为稍具名声者必都高视阔步，得意非常，故当责骂以泄自己无名之怨。前者可称为善意的错误，后者卑劣的想象。</p>
</div>
