<p class="title1">二十五</p>
<p class="date">第14卷，散文 杂文 · 滇行短记</p>
<br>
<div class="content"><p>此地，妇女们似乎比男人更能干。在田里下力的是妇女，在场上卖东西的是妇女，在路上担负粮柴的也是妇女。妇女，据说，可以养着丈夫，而丈夫可以在家中安闲的享福。</p>
<p>妇女的装束略同汉人，但喜戴些零七八碎的小装饰。很穷的小姑娘老太婆，尽管衣裙破旧，也戴着手镯。草帽子必缀上两根红绿的绸带。她们多数是大足，但鞋尖极长极瘦，鞋后跟钉着一块花布，表示出也近乎缠足的意思。</p>
<p>听说她们很会唱歌，但是我没有听见一声。</p>
</div>
