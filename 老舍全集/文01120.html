<p class="title1">八</p>
<p class="date">第13卷，曲艺 诗文 · 内蒙即景</p>
<br>
<div class="content"><p class="center">风卷荒沙暗九天，</p>
<p class="center">摇摇土屋浪中船，</p>
<p class="center">孤灯白日昏如夜，</p>
<p class="center">已过清明未下田！</p>
<p class="block">这是当年赤峰郊外的光景，风沙肆虐，年年歉收，农民无衣无食，只好逃荒。现在呢？请看：</p>
