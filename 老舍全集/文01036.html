<div class="content">二 沫若先生

 <a href="#m1">

<sup>[1]</sup>

</a>

 邀饮赖家桥</h3>

<p class="center">家山北望隔中原，相对能无酒一樽？</p>

<p class="center">薄醉欲倾前日泪，红颜未是少年痕！</p>

<p class="center">平桥翠竹清如水，晓月白莲香到根；</p>

<p class="center">篱外桑麻诗境里，柴扉不掩傲朱门。</p>
