<p class="title1">黄山奇</p>
<p class="date">第13卷，曲艺 诗文 · 黄山之游——致郭老</p>
<br>
<div class="content"><p class="center">人间多少佳山水 独许黄山胜太华</p>
<p class="center">云海横空移彩浪 天峰绝顶落幽花</p>
<p class="center">千重烟树蝉声翠 薄暮晴松鸟语霞</p>
<p class="center">怪石飞泉诗境里 溪头吟罢饮丹砂</p>
</div>
