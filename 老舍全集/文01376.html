<p class="title1">九</p>
<p class="date">第14卷，散文 杂文 · 未成熟的谷粒</p>
<br>
<div class="content"><p>诗的形式太自由了，写完总疑心——是诗吗？戏剧的形式太不自由，写完老不放心——是戏剧吗？还是小说容易像样儿。</p>
