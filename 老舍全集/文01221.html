<p class="title1">致郭老</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">致郭老

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">门头村里好为家，文艺源泉岂浪跨。</p>

<p class="center">金玉红楼终是梦，

 <a href="#m2">

<sup>[2]</sup>

</a>

 镰锄碧野遍开花。</p>

<p class="center">东流巨浪今潮北，

 <a href="#m3">

<sup>[3]</sup>

</a>

 霜降香山叶染霞。</p>

<p class="center">瓜果齐歌丰产日，高天一弹吐光华。</p>

<p class="right">一九六四年十月二十三日于香山门头村</p>
