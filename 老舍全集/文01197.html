<p class="title1">二</p>
<p class="date">第13卷，曲艺 诗文 · 祝捷</p>
<br>
<div class="content"><p class="center">“忧二”高天碎若毛，</p>
<p class="center">野心美帝信徒劳！</p>
<p class="center">可怜魔术齐穿破：</p>
<p class="center">唇上和平手里刀！</p>
<p class="block">“喜闻我英勇空军再次击落美帝‘忧二’飞机，献诗祝捷”。</p>
<p class="right1">原载1963年11月7日《解放军报》</p>
