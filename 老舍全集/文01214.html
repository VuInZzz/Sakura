<p class="title1">黄山松</p>
<p class="date">第13卷，曲艺 诗文 · 黄山之游——致郭老</p>
<br>
<div class="content"><p class="center">险处悠然见老松 黄山奇矣复从容</p>
<p class="center">枝横绝壁根穿石 上舞飞莺下卧龙</p>
<p class="center">云海去来含翠影 霜天今古立青峰</p>
<p class="center">三冬雪后寒风急 奋战丛针寸寸锋</p>
</div>
