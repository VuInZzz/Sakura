<p class="title1">赠木下顺二</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">赠木下顺二

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">小院春风木下家，</p>

<p class="center">长街短卷插樱花。</p>

<p class="center">十杯清酒千般意，</p>

<p class="center">笔墨相期流锦霞。</p>

<p class="right1">一九六五年四月访日时</p>

<p class="right1">引自刘厚生《访日录诗小记》</p>

<p class="right1">原载1981年《大地》第一期</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 木下顺二（1914—？），日本剧作家。</p>
