<p class="title1">赠王莹</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">赠王莹

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">小住佳园百病除，</p>

<p class="center">西山爽气入蓬庐。</p>

<p class="center">风香云暖松荫外，</p>

<p class="center">细读人间革命书。</p>

<p class="right">一九六六年春</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 本篇据手迹收入。王莹（1913—1974），安徽芜湖人。话剧、电影女演员，作家。</p>
