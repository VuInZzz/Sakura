<p class="title1">其一</p>
<p class="date">第13卷，曲艺 诗文 · 北行小诗</p>
<br>
<div class="content"><p class="center">二载流离苦，飘飘梦落花！</p>
<p class="center">停车频买酒，问路倍思家；</p>
<p class="center">尘重知城大，天长盼日斜；</p>
<p class="center">何时平寇乱，茅屋品清茶。</p>
</div>
