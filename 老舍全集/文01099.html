<p class="title1">一 哲盟展览馆</p>
<p class="date">第13卷，曲艺 诗文 · 诗四首</p>
<br>
<div class="content"><p class="center">欣来展览馆，珠玉不胜收。</p>
<p class="center">十载除三害，全盟争上游。</p>
<p class="center">逢山开宝库，因地引渠流。</p>
<p class="center">草木无遗利，辉煌百代猷。</p>
</div>
