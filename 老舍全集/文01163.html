<p class="title1">赠闻捷</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">赠闻捷

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">诗人八月下扬州</p>

<p class="center">万首新诗吟胜游</p>

<p class="center">奇句得来烦北寄</p>

<p class="center">莫教南国独风流</p>

<p class="block">闻捷同志南下书此赠别并祈两正。</p>

<p class="right">一九六二年“八一”节 老舍</p>
