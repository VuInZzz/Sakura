<p class="title1">一</p>
<p class="date">第13卷，曲艺 诗文 · 赠潘孑农</p>
<br>
<div class="content"><p class="center">天翼高长虹，田间潘孑农。</p>
<p class="center">佩src="./images/Image00187.jpg"
 卢冀野，望道吴云峰。</p>
<p class="center">万籁鸣秋苇，独清徐转蓬。</p>
<p class="center">霞光王统照，常任侠何容！</p>
