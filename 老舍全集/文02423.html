<p class="title1">一九六四年日记</p>
<p class="date">第19卷，日记 佚文 · 日记</p>
<br>
<div class="content"><p class="center">（元旦～10日）</p>
<p class="left">
<b>元旦</b>
</p>
<p>写字。</p>
<p class="left">
<b>1月2日</b>
</p>
<p>写字。</p>
<p class="left">
<b>1月3日</b>
</p>
<p>市“文联”欢迎沪剧团等。</p>
<p class="left">
<b>1月4日 雪</b>
</p>
<p>晚缅甸国庆。</p>
<p class="left">
<b>1月5日</b>
</p>
<p>早王局长来谈。</p>
<p class="left">
<b>1月6日</b>
</p>
<p>早刘富贵来谈。</p>
<p class="left">
<b>1月10日 雪</b>
</p>
<p>早看二人台，宾基请饭。</p>
