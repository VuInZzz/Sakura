<p class="title1">《老舍剧作选》越南文译本序</p>
<p class="date">第18卷，文论工作报告译文 · 文论</p>
<br>
<div class="content"><p>我写话剧，是为了学习，所以到今天为止，还没写出一部出色的作品。《全家福》等四剧，得到译为越南文的机会，引为荣幸，尚希读者指教！</p>
<p class="right">老舍 一九六一年六月于北京。</p>
<p class="right1">原载《老舍剧作选》，1961年10月河内版</p>
