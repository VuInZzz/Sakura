<p class="title1">一</p>
<p class="date">第13卷，曲艺 诗文 · 歌唱伟大的党</p>
<br>
<div class="content"><p class="center">六亿五千万人民高举红旗，</p>
<p class="center">六亿五千万人民齐声歌唱：</p>
<p class="center">热爱我们伟大的国家，</p>
<p class="center">热爱我们伟大的党！</p>
<p class="center">天上的北极星，</p>
<p class="center">我们的共产党，</p>
<p class="center">看着北极星，</p>
<p class="center">跟着共产党，</p>
<p class="center">建设祖国，乘风破浪，</p>
<p class="center">我们永远不会迷失方向！</p>
<p class="center">前进，前进，走向光明，走向胜利，</p>
<p class="center">跟着党走，永远不会迷失方向！</p>
</div>
