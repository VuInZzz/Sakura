<p class="title1">诗谢郭老秋雨中来访</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">诗谢郭老秋雨中来访

 <a href="#m4">

<sup>[4]</sup>

</a>

</h2>

<p class="center">古稀革命老诗家，后进文章拙亦夸。</p>

<p class="center">相约长风冲雪浪，休怜细雨湿黄花。</p>

<p class="center">高年笑敛三升酒，晓日吟开万里霞。</p>

<p class="center">一怒定教白骨碎，乾坤正气在中华。</p>

<p class="right">一九六四年十月</p>
