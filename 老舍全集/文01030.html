<p class="title1">赠台静农</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">赠台静农

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="block">看小女儿写字，最为有趣，倒画逆推，信意创作，兴之所至，加减笔画，前无古人，自成一家，至指黑眉重，墨点满身，亦具淋漓之致。</p>

<p class="center">为诗用文言，</p>

<p class="center">或者用白话，</p>

<p class="center">语妙即成诗，</p>

<p class="center">何必乱吵絮。</p>

<p>

<b>静农兄来渝，酒后论文说字，写此为证。</b>

</p>

<p class="right">一九四一年春</p>

<p class="right1">引自台静农《我与老舍与酒》</p>

<p class="right1">原载1944年9月《抗战文艺》第九卷第三、四期合刊</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 台静农（1902—1990），安徽省霍邱县人。现代作家。</p>
