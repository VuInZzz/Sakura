<p class="title1">三 大兴安岭原始森林</p>
<p class="date">第13卷，曲艺 诗文 · 内蒙风光</p>
<br>
<div class="content"><p class="center">原始森林客始来，</p>
<p class="center">松针已落几千回，</p>
<p class="center">参天古木“横山倒”，</p>
<p class="center">遍地杂花带露开。</p>
<p><br/>
</p>
<p class="center">红豆如珠明碧草，</p>
<p class="center">锦鸡多彩啄香苔，</p>
<p class="center">新苗人望丛丛起，</p>
<p class="center">付与辛勤尽大材。</p>
<p>
<b>“横山倒”系伐木时呼声之一，以示树倒方向，免生事故。红豆为山中小野果，可用造酒</b>
 。</p>
<p class="right1">原载1961年《草原》九、十月号</p>
