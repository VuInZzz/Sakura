<p class="title1">二</p>
<p class="date">第13卷，曲艺 诗文 · 春节饯友</p>
<br>
<div class="content"><p class="center">南海任遨游，</p>
<p class="center">春潮天际流；</p>
<p class="center">东风花似锦，</p>
<p class="center">开遍亚非洲！</p>
<p class="block">中国作家代表团出国，参加亚非作家会议，谨献短句欢送，并祝春吉。</p>
<p class="right1">原载1962年2月10日《人民日报》</p>
