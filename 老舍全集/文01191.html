<p class="title1">登岳阳楼题“三秋图”</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">登岳阳楼题“三秋图”

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">天上一轮月，</p>

<p class="center">亭前双桂花。</p>

<p class="center">香风随我去，</p>

<p class="center">一路到长沙。</p>

<p class="right1">一九六三年登岳阳楼</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 本篇据手迹收入。1963年夏，作者与夫人胡絜青登岳阳楼。胡絜青作画，作者为画题款为“三秋图”，并题诗。</p>
