<p class="title1">二十五</p>
<p class="date">第14卷，散文 杂文 · 未成熟的谷粒</p>
<br>
<div class="content"><p>我应当受苦。没有任何专门学识，只凭一点点想象力去乱写胡诌；受苦是当然的惩罚。青年朋友们，别因为算术或外国语不能及格，而想作个写家呀！</p>
