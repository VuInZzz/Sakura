<p class="title1">赠田仲济</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">赠田仲济

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">乱年渐气短，有米胜无诗，</p>

<p class="center">卖剑沽邨酒，听蝉望柳枝。</p>

<p class="center">斜阳人影瘦，晓雾鸟声迟。</p>

<p class="center">静里有真趣，神清月上时。</p>

<p class="block">乙酉秋初写旧诗一首，仲济作家仁兄两正。</p>
