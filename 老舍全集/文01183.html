<p class="title1">一 赠李焕之</p>
<p class="date">第13卷，曲艺 诗文 · 北戴河赠四友诗</p>
<br>
<div class="content">一 赠李焕之

 <a href="#m2">

<sup>[2]</sup>

</a>

</h3>

<p class="center">碧海为琴浪作弦，</p>

<p class="center">水仙吹笛老龙眠；</p>

<p class="center">滩头自有知音客，</p>

<p class="center">谱出风云交响篇！</p>
