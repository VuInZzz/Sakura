<p class="title1">三 述怀</p>
<p class="date">第13卷，曲艺 诗文 · 诗四章</p>
<br>
<div class="content"><p class="center">辛酸步步向西来，不到河清眉不开！</p>
<p class="center">身后声名留气节，眼前风物愧诗才；</p>
<p class="center">论人莫逊春秋笔，入世方知圣哲哀；</p>
<p class="center">四海飘零余一死，青天尚在敢心灰！</p>
</div>
