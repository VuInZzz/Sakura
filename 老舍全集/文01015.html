<p class="title1">贺全国文艺界抗敌协会成立</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content"><p class="center">三月莺花黄鹤楼，骚人无复旧风流。</p>
<p class="center">忍听杨柳大堤曲，誓雪江山半壁仇。</p>
<p class="center">李杜光芒齐万丈，乾坤血泪共千秋。</p>
<p class="center">凯歌明日春潮急，洗笔携来东海头。</p>
<p class="right1">原载1938年3月26日《文艺战线》第二卷第一期“中华全国文艺界抗敌协会成立纪念特辑”</p>
