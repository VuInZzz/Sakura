<p class="title1">三</p>
<p class="date">第14卷，散文 杂文 · 血点</p>
<br>
<div class="content"><p>新诗人问：朗诵诗可以采用点旧有的民众文艺的技巧与词汇吗？</p>
<p>新小说家问：新小说可以按照评词那么写吗？</p>
<p>新文艺理论者问：旧瓶新酒的办法，不是作来作去还是旧瓶吗？</p>
<p>答曰：你们都先去费点心，看看民众文艺再谈。知道了民众文艺是什么东西，则自己找到了答案；否则我细细回答也毫无益处。</p>
</div>
