<p class="title1">为黄胄《载歌行》画题诗</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">为黄胄《载歌行》画题诗

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">民族解放，</p>

<p class="center">四海欢唱，</p>

<p class="center">驴背逍遥，</p>

<p class="center">琴声清壮。</p>

<p class="right1">引自刘金涛《为老舍装裱字画》</p>

<p class="right1">原载1984年《人物》第六期</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 黄胄（1925—1997），河北src="./images/Image00188.jpg"

 县人。画家、收藏家、社会活动家。</p>
