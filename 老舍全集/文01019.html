<p class="title1">一 沔县谒武侯祠</p>
<p class="date">第13卷，曲艺 诗文 · 诗四首</p>
<br>
<div class="content"><p class="center">淡泊于今尚若斯，清流疏柏武侯祠。</p>
<p class="center">三分未竟贤臣志，一表应怜庸主师！</p>
<p class="center">大汉衣冠余百劫，中原烽火似当时；</p>
<p class="center">死而后已同肝胆，海内飞传荡寇旗！</p>
</div>
