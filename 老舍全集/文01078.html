<p class="title1">二</p>
<p class="date">第13卷，曲艺 诗文 · 元旦高兴</p>
<br>
<div class="content"><p class="center">元旦齐狂喜，新年乐事多：</p>
<p class="center">儿童排话剧，父老赛诗歌；</p>
<p class="center">壁画樱如斗，墙题蜜作河。</p>
<p class="center">人人说党好，四海沐恩波。</p>
<p class="right1">原载1959年1月1日《北京日报》</p>
</div>
