<p class="title1">二 参加长沙国庆节庆祝大会</p>
<p class="date">第13卷，曲艺 诗文 · 诗三首</p>
<br>
<div class="content"><p class="center">革命人民集广场，红旗十万彩千行：</p>
<p class="center">龙飞狮舞歌声起，马壮人强斗志昂。</p>
<p class="center">齐树雄心争跃进，每凭胜利作新装；</p>
<p class="center">狂欢滚滚湘江浪，恰是中秋飘桂香。</p>
</div>
