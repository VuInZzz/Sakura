<p class="title1">三</p>
<p class="date">第13卷，曲艺 诗文 · 诗 三 律</p>
<br>
<div class="content"><p class="center">故人南北东西去，独领江山一片哀！</p>
<p class="center">从此桃源萦客梦，共谁桑海赏天才？</p>
<p class="center">二更明月潮先后，万事浮云雁往回：</p>
<p class="center">莫把卖文钱浪掷，青州瓜熟待君来！</p>
<p class="right1">原载1935年9月15日《青岛民报·避暑录话》（第十期）</p>
