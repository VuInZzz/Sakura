<p class="title1">小序</p>
<p class="date">第8卷，小说 · 贫血集</p>
<br>
<div class="content"><p>三年来，因营养不良，与打摆子，得了贫血病。病重的时候，多日不能起床；一动，就晕得上吐下泻。病稍好，也还不敢多作事，怕又忽然晕倒。</p>
<p>以贫血名集，有向读者致歉之意；其人贫血，其作品亦难健旺也。</p>
<p class="right1">老舍于北碚。</p>
</div>
