<p class="title1">三</p>
<p class="date">第13卷，曲艺 诗文 · 诗三首</p>
<br>
<div class="content"><p class="center">暴政推翻争自由，</p>
<p class="center">壮怀生死不低头。</p>
<p class="center">何干美帝兴刀火，</p>
<p class="center">革命潮流阻更流。</p>
<p class="right1">原载1965年5月13日《光明日报》</p>
