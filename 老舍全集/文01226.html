<p class="title1">赠土□善麿</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">赠土src="./images/Image00190.jpg"

 善麿

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">白也诗无敌，</p>

<p class="center">情深万古心，</p>

<p class="center">愁吟启百代，</p>

<p class="center">硬语最惊人。</p>

<p class="right">一九六五年春</p>
