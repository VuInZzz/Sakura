<p class="title1">轮箍厂留赠工人同志</p>
<p class="date">第13卷，曲艺 诗文 · 黄山之游——致郭老</p>
<br>
<div class="content"><p class="center">壮怀决不乞人怜</p>
<p class="center">自力更生头顶天</p>
<p class="center">革命精神无保守</p>
<p class="center">红旗插上最尖端<b>（端借韵）</b>
</p>
<hr/>
<p class="note"><a id="m1"></a>
 [1]
 此信写于1964年10月12日，现据手迹收入。郭老，即郭沫若。</p>
<p class="note"><a id="m2"></a>
 [2]
 卢施福（1898—1983），广东中山人。摄影家。</p>
