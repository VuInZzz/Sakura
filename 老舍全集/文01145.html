<p class="title1">三 雨夜在大世界听扬剧名演员</p>
<p class="date">第13卷，曲艺 诗文 · 春游小诗</p>
<br>
<div class="content"><p class="center">顾玉君唱《阳告阴告》轻寒乍暖未分明，柳盼春阴花盼晴。</p>
<p class="center">听罢扬州绝命曲，江南三月雨无声。</p>
<p><br/>
</p>
<p class="center">悲歌春夜雨纷纷，四座惊夸顾玉君。</p>
<p class="center">笑尽啼残唯有恨，青天碧海儿女坟。</p>
</div>
