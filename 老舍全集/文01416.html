<p class="title1">十二</p>
<p class="date">第14卷，散文 杂文 · 滇行短记</p>
<br>
<div class="content"><p>离龙泉村五六里，为凤鸣山。山上有庙，庙有金殿——一座小殿，全用铜筑。山与庙都没什么好看，倒是遍山青松，十分幽丽。</p>
<p>云南的松柏结果都特别的大。松塔大如菠萝，柏实大如枣。松子几乎代替了瓜子，闲着没事的时候，大家总是买些松子吃着玩，整船的空的松塔运到城中；大概是作燃料用，可是凤鸣山的青松并没有松塔儿，也许是另一种树吧，我叫不上名字来。</p>
</div>
