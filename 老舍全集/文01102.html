<p class="title1">一</p>
<p class="date">第13卷，曲艺 诗文 · 诗二首</p>
<br>
<div class="content"><p class="center">诗人新谱“汉宫秋”，</p>
<p class="center">马上琵琶泪不流。</p>
<p class="center">壮志和亲青冢在，</p>
<p class="center">二千年事说从头！</p>
