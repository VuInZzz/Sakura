<p class="title1">二</p>
<p class="date">第14卷，散文 杂文 · 未成熟的谷粒</p>
<br>
<div class="content"><p>照着批评者的意见去创作，也许只能掉在公式阵中吧？创作饥歉，批评便也瘠瘦；随着瘠瘦的理论去学习，怎能康健呢？还是勇于创作，多方去试验吧！</p>
