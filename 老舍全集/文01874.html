<p class="title1">致刘金涛</p>
<p class="date">第15卷，散文 杂文 书信 · 书信</p>
<br>
<div class="content">致刘金涛

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<h3 id="c213">一九五三年</h3>

<p class="left">金涛先生：</p>

<p>昨送去画四张

 <a href="#m2">

<sup>[2]</sup>

</a>

 ，中有一张纸幅稍小，祈补足——切勿将三幅大者裁小。能于阴历二十二日

 <a href="#m3">

<sup>[3]</sup>

</a>

 送来，至为感激！</p>

<p>匆匆，祝</p>

<p class="left">安！</p>

<p class="right">老舍躬</p>

<p class="right">二十二</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 刘金涛，原中央工艺美术学院著名裱画技师。作者的藏画多经他裱成画轴。本信据手迹收入。</p>

<p class="note"><a id="m2"></a>

 [2]

 画四张，即作者命题请齐白石所画的四张画。</p>

<p class="note"><a id="m3"></a>

 [3]

 即作者1953年阴历生日的前一天。</p>
