<p class="title1">赠关友声</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">赠关友声

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">覃思画境秀如秋，敛尽锋芒绘浅愁。</p>

<p class="center">墨未到时神远瞩，笔留余意树微羞。</p>

<p class="center">山从心里生云气，露在毫端滴石头。</p>

<p class="center">俱是空灵诗韵味，天边语响落轻舟。</p>

<p class="right1">引自孔亚兵：《老舍与画家关友声》</p>

<p class="right1">载1992年12月22日《人民政协报》</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 本篇1933年作于济南。关友声（1906—1970），济南人。中国现代画家。</p>
