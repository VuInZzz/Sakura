<p class="title1">亿众学雷锋</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content"><p class="center">平凡而伟大，亿众学雷锋，</p>
<p class="center">生意湖旁柳，雄心岩上松，</p>
<p class="center">螺丝为集体，砖瓦筑崇墉，</p>
<p class="center">革命无遗力，东风桃李秾。</p>
<p class="right1">原载1963年3月29日《北京日报》《“向雷锋同志学习”书法展览今日起在和平画店开幕》</p>
