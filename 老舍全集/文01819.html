<p class="title1">慰问信</p>
<p class="date">第15卷，散文 杂文 书信 · 书信</p>
<br>
<div class="content"><h3 id="c090">一九三八年十月十八日</h3>
<p class="left">同志：</p>
<p>你在战场杀敌，受尽千辛万苦，我们全国的人都感激你，佩服你！你放心吧，我们各地的人民都没有一时一刻忘了你，都肯出钱做棉衣，买东西，送给你用。你放胆去打敌人吧，我们全国同胞一心，非打退日本小鬼不拉倒。爱国的英雄啊，放枪吧，百发百中，多多打倒敌兵啊！向你敬礼，并祝</p>
<p class="left">平安！</p>
<p class="right">老舍鞠躬</p>
<p class="right">十，十八重庆</p>
<p class="right1">原载1938年11月3日重庆《扫荡报》</p>
