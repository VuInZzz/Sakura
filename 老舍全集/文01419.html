<p class="title1">十五</p>
<p class="date">第14卷，散文 杂文 · 滇行短记</p>
<br>
<div class="content"><p>剧本写完，今年是我个人的倒霉年。春初即患头晕，一直到夏季，几乎连一个字也没有写。没想到，在昆明两月，倒能写成这一点东西——好坏是另一问题，能动笔总是件可喜的事。</p>
