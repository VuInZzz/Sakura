<p class="title1">喜联</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content"><p class="center">洛浦汀滢，</p>
<p class="center">人盟白首；</p>
<p class="center">筠溪芳美，</p>
<p class="center">缘结朱盟。</p>
<p class="block">阅报，敬悉筠美女士洛汀先生结婚桂林，谨制喜联，遥祝吉庆。</p>
<p class="right">老舍</p>
<p class="right">一九四四年五月</p>
<p class="right1">引自洛汀《忆老舍先生二三事》</p>
<p class="right1">原载1996年《天下为公》第二期</p>
<hr/>
<p class="note"><a id="m1"></a>
 [1]
 本篇据手迹收入。</p>
