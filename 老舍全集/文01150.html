<p class="title1">二 参观旅行内蒙古画家画展</p>
<p class="date">第13卷，曲艺 诗文 · 大好春光</p>
<br>
<div class="content"><p class="center">地阔天圆日落迟，</p>
<p class="center">草原无际马长嘶，</p>
<p class="center">春风万里歌声远，</p>
<p class="center">画笔得来光景奇！</p>
</div>
