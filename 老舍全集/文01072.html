<p class="title1">十五 刘麻子（英若诚饰）</p>
<p class="date">第13卷，曲艺 诗文 · 《茶馆》群像</p>
<br>
<div class="content"><p class="center">贩卖人口，</p>
<p class="center">一世缺德。</p>
<p class="center">别人落泪，</p>
<p class="center">他吃他喝。</p>
</div>
