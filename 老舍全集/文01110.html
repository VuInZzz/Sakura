<p class="title1">五</p>
<p class="date">第13卷，曲艺 诗文 · 包头颂</p>
<br>
<div class="content"><p class="center">朗日新城古渡头，</p>
<p class="center">黄河滚滚向东流。</p>
<p class="center">昔年六十三株树，</p>
<p class="center">今看芳林艳九秋。</p>
<p class="right1">原载1961年9月24日《内蒙古日报》</p>
