<p class="title1">二</p>
<p class="date">第13卷，曲艺 诗文 · 胜利之年（歌二首）</p>
<br>
<div class="content"><p class="center">三十而立</p>
<p class="center">三十而立</p>
<p class="center">三十岁的中华民国</p>
<p class="center">正英雄有为的年纪</p>
<p class="center">高举着正义的旗戈</p>
<p class="center">争取光荣胜利</p>
<p class="center">把五岳与黄河</p>
<p class="center">用鲜血刷洗</p>
<p class="center">把日冠击破 日寇击破</p>
<p class="center">山川变作敌人的坟地</p>
<p class="center">今年的莺声便是凯歌</p>
<p class="center">呕 这血里的中国与国际</p>
<p class="center">要有和平 要有正义</p>
<p class="center">全凭我们争得</p>
<p class="center">全凭我们的努力</p>
<p class="center">杀过了黄河</p>
<p class="center">教全世界都欢喜</p>
<p class="center">胜利像春风吹入了心窝</p>
<p class="center">胜利了 我们的中华民国</p>
<p class="center">永远在世界雄立</p>
<p class="right1">原载1941年1月1日《扫荡报》</p>
</div>
