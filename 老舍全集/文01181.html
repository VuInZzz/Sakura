<p class="title1">赠友人归广州</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content"><p class="center">莫苦长安春到迟，</p>
<p class="center">亭园四月牡丹奇。</p>
<p class="center">劝君留待端阳酒，</p>
<p class="center">天上飞来红荔枝。</p>
<p class="right">一九六三年夏天</p>
<p class="right1">原载1980年《新港》七月号</p>
