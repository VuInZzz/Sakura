<p class="title1">一</p>
<p class="date">第14卷，散文 杂文 · 滇行短记</p>
<br>
<div class="content"><p>总没学会写游记。这次到昆明住了两个半月，依然没学会写游记，最好还是不写。但友人嘱寄短文，并以滇游为题。友情难违；就想起什么写什么。另创一路，则吾岂敢，聊以塞责，颇近似之，惭愧得紧！</p>
</div>
