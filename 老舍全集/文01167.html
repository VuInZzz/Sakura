<p class="title1">三</p>
<p class="date">第13卷，曲艺 诗文 · 迎春</p>
<br>
<div class="content"><p class="center">海南秧已绿，漠北雪封沙，</p>
<p class="center">气象虽千态，人民是一家；</p>
<p class="center">工农相祝酒，儿女尽如花！</p>
<p class="center">顾盼生颜色，红旗扬彩霞。</p>
<p class="right1">原载1963年1月25日《文汇报》</p>
</div>
