<p class="title1">三</p>
<p class="date">第13卷，曲艺 诗文 · 歌唱伟大的党</p>
<br>
<div class="content"><p class="center">六亿五千万人民意气风发，</p>
<p class="center">六亿五千万人民尽情高唱：</p>
<p class="center">歌唱我们伟大的国家，</p>
<p class="center">歌唱我们伟大的党！</p>
<p class="center">国际主义旗帜，</p>
<p class="center">迎风四海飘扬，</p>
<p class="center">伟大的旗帜，</p>
<p class="center">伟大的理想，</p>
<p class="center">见义勇为，当仁不让，</p>
<p class="center">真理正义永放光芒！</p>
<p class="center">前进，前进，保卫和平，保卫革命，</p>
<p class="center">跟着党走，真理正义永放光芒！</p>
<p class="right1">原载1963年1月3日《北京日报》</p>
<hr/>
<p class="note"><a id="m1"></a>
 [1]
 本篇是一首歌词，由贺绿汀谱曲。</p>
