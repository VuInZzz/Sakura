<p class="title1">赠钱钟书</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">赠钱钟书

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">梅花傲对雪花开，</p>

<p class="center">放眼山川无点埃，</p>

<p class="center">此景此情应小醉，</p>

<p class="center">诗人恰寄宋诗来。</p>

<p class="block">新年喜雪复得。</p>

<p class="block">钟书同志赠所著《宋诗选注》狂喜此书致谢未计工拙并祝新年愉快。</p>

<p class="right">一九六四年元月五日 老舍</p>

<p class="right1">引自林以亮《老舍的一首诗》</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 钱钟书（1910—1998），江苏无锡人。学者、作家。</p>
