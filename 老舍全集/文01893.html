<p class="title1">致杨居辰</p>
<p class="date">第15卷，散文 杂文 书信 · 书信</p>
<br>
<div class="content">致杨居辰

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<h3 id="c244">一九五九年十一月七日</h3>

<p class="left">杨居辰同志：</p>

<p>函诵悉。《萌芽》社曾经发表了您的稿件与否，我不知道。刊物编辑部退稿迟早，自有权衡，我不便过问，还是希望您用挂号信再向该社查询为盼！致</p>

<p class="left">敬！</p>

<p class="right">老舍</p>

<p class="right">十一，七</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 杨居辰，业余作者，当时在青岛任教。</p>
