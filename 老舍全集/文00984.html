<p class="title1">欢迎曲</p>
<p class="date">第13卷，曲艺 诗文 · 雪中行军</p>
<br>
<div class="content"><p>鸭绿江波涌，日照凯旋门，六亿人民一条心，欢呼：欢迎！欢迎！欢迎我们最亲爱的人！</p>
<p>碧江分两岸，朝中情不分，六亿人民一条心，欢呼：友谊！友谊！朝中友谊万古长春！</p>
<p>英雄得胜归，人民添干劲，六亿人民一条心，欢呼：跃进！跃进！我们的榜样是志愿军！</p>
<p>打击侵略者，将士立奇勋，六亿人民一条心，欢呼：胜利！胜利！一定要解放台湾，消灭敌人！</p>
<p class="right1">原载1958年10月28日《解放军报》</p>
