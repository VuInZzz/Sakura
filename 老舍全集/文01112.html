<p class="title1">二 昭旗苹果</p>
<p class="date">第13卷，曲艺 诗文 · 内蒙风光</p>
<br>
<div class="content"><p class="center">辟壤开荒意气雄，</p>
<p class="center">十年种树孕春风，</p>
<p class="center">果然天下无难事，</p>
<p class="center">花果山前苹果红。</p>
<p>
<b>五三公社农业中学开荒造园，苹果已结实。园地昔日为沙丘，今名青年花果山</b>
 。</p>
</div>
