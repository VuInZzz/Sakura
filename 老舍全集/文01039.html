<p class="title1">赠涤非词人</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">赠涤非词人

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<p class="center">词客天南去，碧鸡金马间；</p>

<p class="center">山光十日酒，渔唱一溪烟。</p>

<p class="center">春雨花开落，秋云梦往还；</p>

<p class="center">此中多妙趣，回首几千年！</p>

<p class="right">一九四一年</p>
