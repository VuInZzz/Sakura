<p class="title1">九</p>
<p class="date">第14卷，散文 杂文 · 滇行短记</p>
<br>
<div class="content"><p>莘田病好了一些。我写完了话剧《大地龙蛇》的前二幕。约了膺中、了一、和众研究生，来听我朗读。大家都给了些很好的意见，我开始修改。</p>
<p>对文艺，我实在不懂得什么，就是愿意学习，最快活的，就是写得了一些东西，对朋友们朗读，而后听大家的批评。一个人的脑子，无论怎样的缜密，也不能教作品完全没有漏隙，而旁观者清，不定指出多少窟窿来。</p>
</div>
