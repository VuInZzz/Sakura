<p class="title1">访东风人民公社而作</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content">访东风人民公社而作

 <a href="#m2">

<sup>[2]</sup>

</a>

</h2>

<p class="center">丰产高潮安国来，</p>

<p class="center">良田一望喜千回，</p>

<p class="center">东风今岁花开好，</p>

<p class="center">欣祝明年万倍开。</p>

<p class="right1">原载1958年《蜜蜂》十二月号</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 本篇据手迹收入。安娜·路易丝·斯特朗（1885—1970），美国进步女作家、记者。</p>

<p class="note"><a id="m2"></a>

 [2]

 作者于1958年9月随中国文联参观团到河北省安国县参观访问了当时的东风和先锋两个人民公社，有感而作。</p>
