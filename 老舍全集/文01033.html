<p class="title1">赠冯纪法</p>
<p class="date">第13卷，曲艺 诗文 · 旧体诗</p>
<br>
<div class="content"><p class="center">抗战今开第五年，男儿志在复幽燕，</p>
<p class="center">金陵纵有降臣表，铁甲终辉国士天。</p>
<p class="center">斜汉双星休乞巧，西风万马且争先。</p>
<p class="center">多情最是卢沟月，犹照英雄血色鲜。</p>
<p>
<b>卅年七七纪念写奉纪法先生两教</b>
 。</p>
<p class="right">老舍</p>
<p>
<b>引自侯鸿绪《多情最是卢沟月，犹照英雄血色鲜——一把由老舍题写抗战诗的纸扇》</b>
</p>
<p class="right1">原载1985年9月11日《安徽日报》</p>
