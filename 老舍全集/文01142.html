<p class="title1">三 观林务夏同志演贻顺哥</p>
<p class="date">第13卷，曲艺 诗文 · 诗三首</p>
<br>
<div class="content"><p class="center">八年尚忆钗头凤，

 <a href="#m4">

<sup>[4]</sup>

</a>

</p>

<p class="center">今夕欣看烛蒂哥，</p>

<p class="center">宜喜宜悲情似海，</p>

<p class="center">轻愁微笑漾春波。</p>

<p class="right">一九六二年四月</p>

<p class="right1">原载1962年4月22日《福建日报》</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 本篇据手迹收入。</p>

<p class="note"><a id="m2"></a>

 [2]

 本篇据手迹收入。康濯（1920—1991），湖南湘阳人。现代作家。</p>

<p class="note"><a id="m3"></a>

 [3]

 本篇据手迹收入。梅阡（1916—2002），天津市人。剧作家，话剧导演。</p>

<p class="note"><a id="m4"></a>

 [4]

 八年前观郭西珠同志此剧。——作者</p>
