<p class="date">第15卷，散文 杂文 书信 · 书信</p>
<br>
<div class="content">致楼适夷

 <a href="#m1">

<sup>[1]</sup>

</a>

</h2>

<h3 id="c219">一九五五年九月二十六日</h3>

<p class="left">适夷同志：</p>

<p>光潜译笔

 <a href="#m2">

<sup>[2]</sup>

</a>

 甚确，全文无大错误。原稿及书退还，并附致光潜函，祈连同原稿交他，以便订正。致</p>

<p class="left">敬！</p>

<p class="right">舍

 <a href="#m3">

<sup>[3]</sup>

</a>

</p>

<hr/>

<p class="note"><a id="m1"></a>

 [1]

 楼适夷（1905—2001），现代作家、翻译家。当时任人民文学出版社副社长。本信据手迹收入。</p>

<p class="note"><a id="m2"></a>

 [2]

 指朱光潜为人民文学出版社要出版的《萧伯纳戏剧选》所译《英国佬的另一个岛》一剧。</p>

<p class="note"><a id="m3"></a>

 [3]

 此信无日期。</p>
