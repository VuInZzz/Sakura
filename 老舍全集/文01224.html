<p class="title1">二 今日</p>
<p class="date">第13卷，曲艺 诗文 · 诗二首</p>
<br>
<div class="content"><p class="center">晚年逢盛世，日夕百无忧；</p>
<p class="center">儿女竞劳动，工农共戚休。</p>
<p class="center">诗吟新事物，笔扫旧风流。</p>
<p class="center">莫笑行扶杖，昂昂争上游！</p>
<p class="right1">载1977年《人民文学》十月号</p>
<hr/>
<p class="note"><a id="m1"></a>
 [1]
 本篇据郭沫若书信手迹收入。</p>
<p class="note"><a id="m2"></a>
 [2]
 父老传言，曹雪芹曾在附近法海寺出家为僧。——作者</p>
<p class="note"><a id="m3"></a>
 [3]
 村外长渠，引永定河水北来，灌溉效果甚大。——作者</p>
<p class="note"><a id="m4"></a>
 [4]
 本篇据手迹收入。</p>
<p class="note"><a id="m5"></a>
 [5]
 本篇作于1965年。</p>
