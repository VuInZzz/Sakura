<p class="title1">三 自励</p>
<p class="date">第14卷，散文 杂文 · 到武汉后</p>
<br>
<div class="content"><p class="block">黄鹤楼头莫诉哀，</p>
<p class="block">酒酣风劲壮心来；</p>
<p class="block">烟波自古留余恨，</p>
<p class="block">烽火从今燃死灰；</p>
<p class="block">如此江山空暮雨，</p>
<p class="block">有谁文笔奋云雷？</p>
<p class="block">奇师指日收河北，</p>
<p class="block">七步诗成战鼓催。</p>
<p class="right">原载1938年3月5日香港《大风》创刊号</p>
