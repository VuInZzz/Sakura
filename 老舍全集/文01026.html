<p class="title1">其二</p>
<p class="date">第13卷，曲艺 诗文 · 北行小诗</p>
<br>
<div class="content"><p class="center">劳军来万里，愧我未能兵！</p>
<p class="center">空作长沙哭，羞看细柳营；</p>
<p class="center">感怀成酒病，误国是书生！</p>
<p class="center">莫任山河碎，男儿当请缨。</p>
<p class="right">一九四○年一月</p>
<p class="right1">原载1940年1月24日《新蜀报·蜀道》</p>
