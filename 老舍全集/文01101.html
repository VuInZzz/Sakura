<p class="title1">三 水库赏莲</p>
<p class="date">第13卷，曲艺 诗文 · 诗四首</p>
<br>
<div class="content"><p class="center">江南鲢鲤乐新家，</p>
<p class="center">蒲草青青唱绿蛙。</p>
<p class="center">水库今朝迎远客，</p>
<p class="center">插瓶带露摘莲花。</p>
<p class="right1">原载1961年9月7日《内蒙古日报》</p>
<hr/>
<p class="note"><a id="m1"></a>
 [1]
 本篇作于1961年5月6日（夏历立夏日），据手迹收入。马连良（1901—1966），北京人，京剧表演艺术家。马派，京剧流派之一，以马连良的演唱艺术为代表，是当代中国京剧中最有影响的老生流派之一。</p>
<p class="note"><a id="m2"></a>
 [2]
 本篇中第四首《游红山公园》已收入《内蒙即景》，故从略。</p>
