<p class="title1">一 流亡</p>
<p class="date">第14卷，散文 杂文 · 到武汉后</p>
<br>
<div class="content"><p class="block">弱女痴儿不解哀，</p>
<p class="block">牵衣问父去何来？</p>
<p class="block">话因伤别潜成泪，</p>
<p class="block">血若停流定是灰。</p>
<p class="block">已见乡关沦水火，</p>
<p class="block">更堪江海逐风雷；</p>
<p class="block">徘徊未忍道珍重，</p>
<p class="block">墓雁声低切切催。</p>
</div>
