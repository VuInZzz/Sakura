<p class="title1">第十五版说明</p>
<p class="date">狭义与广义相对论浅说</p>
<br>
<div class="content"><p>第十五版增加了一个附录——附录Ⅰ(5)。在这个附录中阐述了我大体上对空间问题以及对我们的空间观如何在相对论观点影响下逐渐改变的看法。我想说明，空间-时间未必能看作是可以脱离物质世界的真实客体而独立存在的东西。并不是物体存在于空间中，而是这些物体具有空间广延性，这样看来，关于“一无所有的空间”的概念就失去了意义。</p>
<p class="right">爱因斯坦 1952年6月9日</p>
</div>
