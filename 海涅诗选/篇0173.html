<p class="title1">领悟</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1842</p>
<br>
<div class="content">

<span class="noteSuper">[132]</span>



 ！你如今可觉察到，</p>

<p class="bodytext">人们骗走了最好吃的汤，</p>

<p class="bodytext">从你嘴边骗得十分巧妙？</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">他们答应补偿你的损失，</p>

<p class="bodytext">给你纯净的天上的欢悦，</p>

<p class="bodytext">天上那些天使在烹调</p>

<p class="bodytext">没有肉的幸福极乐！</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">米歇尔，是你的信仰减弱了，</p>

<p class="bodytext">还是你的胃口加强？</p>

<p class="bodytext">你抓取生命的酒杯，</p>

<p class="bodytext">把异教徒的歌曲歌唱！</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">在地上就营养你的肚皮吧，</p>

<p class="bodytext">米歇尔，什么也不要怕，</p>

<p class="bodytext">将来我们躺在坟墓里，</p>

<p class="bodytext">那里你能够静静地消化。</p>

<p class="bodytext-right">（冯至 译）</p>
