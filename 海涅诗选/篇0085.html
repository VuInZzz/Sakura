<p class="title1">我要留在你这里</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1823</p>
<br>
<div class="content">
<h2 class="chapter-two">我要留在你这里</h2>
<p class="bodytext">我要留在你这里，</p>
<p class="bodytext">在你的身边休憩；</p>
<p class="bodytext">你定然要离开我，</p>
<p class="bodytext">说你有许多要事。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">我告诉你，我的心</p>
<p class="bodytext">已经完全交给你；</p>
<p class="bodytext">你却扑哧地大笑，</p>
<p class="bodytext">向我行屈膝之礼。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">你还要更进一步</p>
<p class="bodytext">使我的烦恼激增，</p>
<p class="bodytext">到最后你甚至拒绝</p>
<p class="bodytext">给我临别的亲吻。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">别以为我会自杀，</p>
<p class="bodytext">不管情况怎样糟！</p>
<p class="bodytext">这一切，我的爱人，</p>
<p class="bodytext">我早已尝过味道。</p>
<p class="bodytext-right">（钱春绮 译）</p>
