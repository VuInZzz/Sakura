<p class="title1">赠别</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1820</p>
<br>
<div class="content">

<h2 class="chapter-two">赠别</h2>

<p class="yinwenc">——题纪念册</p>

<p class="bodytext">世界是一条宽大的公路，</p>

<p class="bodytext">我们世人像旅客一般；</p>

<p class="bodytext">骑马、步行、奔走匆匆，</p>

<p class="bodytext">仿佛急使或是赛跑员。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">迎面走过，点头招呼，</p>

<p class="bodytext">又在马车里挥动手帕；</p>

<p class="bodytext">我们很想拥抱和亲吻，</p>

<p class="bodytext">可是马蹄儿无法停下。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">刚在同一个驿站相逢，</p>

<p class="bodytext">亲爱的亚历山大王子<a id="note7" >

<span class="noteSuper">[7]</span>

</a>

 ，</p>

<p class="bodytext">马车夫已在吹号开车，</p>

<p class="bodytext">又吹得我们各自东西。</p>

<p class="bodytext-right">（钱春绮 译）</p>
