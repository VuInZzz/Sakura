<p class="title1">天空灰暗、平庸</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1829</p>
<br>
<div class="content"><p class="bodytext">天空灰暗、平庸！</p>

<p class="bodytext">城市<a id="note112" >

<span class="noteSuper">[112]</span>

</a>

 还是老样儿！</p>

<p class="bodytext">它投在易北河中的倒影</p>

<p class="bodytext">依旧是那么寒碜、荒凉。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">长鼻子，依旧无聊地</p>

<p class="bodytext">擤着鼻涕，一如既往；</p>

<p class="bodytext">人们要么伪善地点头哈腰，</p>

<p class="bodytext">要么自吹自擂，趾高气扬。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">美丽的南国啊！我多么</p>

<p class="bodytext">崇敬你的天空，你的神们，</p>

<p class="bodytext">自从我又见到这堆人垃圾，</p>

<p class="bodytext">又见到这鬼天气！</p>

<p class="bodytext-right">（杨武能 译）</p>
