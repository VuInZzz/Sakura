<p class="title1">蓝色的春天的眼睛</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1830</p>
<br>
<div class="content">
<h2 class="chapter-two">蓝色的春天的眼睛</h2>
<p class="bodytext">蓝色的春天的眼睛</p>
<p class="bodytext">从草丛中向外窥探；</p>
<p class="bodytext">我挑选它们扎个花球，</p>
<p class="bodytext">这些可爱的紫罗兰。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">我一边采花一边遐想，</p>
<p class="bodytext">无数幽思在心中低叹，</p>
<p class="bodytext">然而夜莺已暴露我的</p>
<p class="bodytext">想法，用它高声的鸣啭。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">是的，它唱出了我的</p>
<p class="bodytext">思想，歌声四处回荡，</p>
<p class="bodytext">整个树林都已知悉</p>
<p class="bodytext">我珍藏心中的秘密。</p>
<p class="bodytext-right">（杨武能 译）</p>
