<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">

<h2 class="chapter-two">星星们高挂空中</h2>

<p class="bodytext">星星们高挂空中，</p>

<p class="bodytext">千万年一动不动，</p>

<p class="bodytext">彼此在遥遥相望，</p>

<p class="bodytext">满怀着爱的伤痛。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">它们说着一种语言，</p>

<p class="bodytext">美丽悦耳，含义无穷，</p>

<p class="bodytext">世界上的语言学家，</p>

<p class="bodytext">谁也没法将它听懂。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">可我学过这种语言，</p>

<p class="bodytext">并且牢记在了心中，</p>

<p class="bodytext">供我学习用的语法，</p>

<p class="bodytext">就是我爱人的面容。</p>

<p class="bodytext-right">（杨武能 译）</p>
