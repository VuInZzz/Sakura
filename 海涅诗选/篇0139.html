<p class="title1">唉！我心里渴望着眼泪</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1828</p>
<br>
<div class="content">
<h2 class="chapter-two">唉！我心里渴望着眼泪</h2>
<p class="bodytext">唉！我心里渴望着眼泪，</p>
<p class="bodytext">又苦又甜的爱情之泪，</p>
<p class="bodytext">我真担心，这种渴望</p>
<p class="bodytext">最后会有实现的机会。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">唉，爱情的甜蜜的痛苦</p>
<p class="bodytext">以及爱情的辛酸的欢喜，</p>
<p class="bodytext">又在奇妙地折磨着我，</p>
<p class="bodytext">钻进我刚刚痊愈的心里。</p>
<p class="bodytext-right">（钱春绮 译）</p>
