<p class="title1">月亮已经升起来</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1823</p>
<br>
<div class="content">
<h2 class="chapter-two">月亮已经升起来</h2>
<p class="bodytext">月亮已经升起来，</p>
<p class="bodytext">照耀在海波之上；</p>
<p class="bodytext">我抱紧我的爱人，</p>
<p class="bodytext">我们的心在跳荡。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">我躺在爱人的怀里，</p>
<p class="bodytext">在海滨独自小休；——</p>
<p class="bodytext">风声里你听到什么？</p>
<p class="bodytext">你的手为何发抖？</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">“这不是海风吹动，</p>
<p class="bodytext">这是人鱼的歌声，</p>
<p class="bodytext">她们是我的姐妹，</p>
<p class="bodytext">从前被海波鲸吞。”</p>
<p class="bodytext-right">（钱春绮 译）</p>
