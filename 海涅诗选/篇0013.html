<p class="title1">美丽的明亮的金色的星星</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1819</p>
<br>
<div class="content">
<h2 class="chapter-two">美丽的明亮的金色的星星</h2>
<p class="bodytext">美丽的明亮的金色的星星，</p>
<p class="bodytext">请代我问候远在他乡的爱人，</p>
<p class="bodytext">告诉她：我还和从前一样，</p>
<p class="bodytext">心患相思，面色苍白，对她忠诚。</p>
<p class="bodytext-right">（杨武能 译）</p>
