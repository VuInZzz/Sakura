<p class="title1">在你的两颊上面</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">
<h2 class="chapter-two">在你的两颊上面</h2>
<p class="bodytext">在你的两颊上面</p>
<p class="bodytext">看到暖热的夏天；</p>
<p class="bodytext">在你小小的心里</p>
<p class="bodytext">却是冰冷的冬天。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">我最亲爱的人儿，</p>
<p class="bodytext">这些全都要改变！</p>
<p class="bodytext">你脸上将变成冬天，</p>
<p class="bodytext">你心里将变成夏天。</p>
<p class="bodytext-right">（钱春绮 译）</p>
