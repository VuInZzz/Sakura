<p class="title1">人们在黑暗中偷来……</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1830</p>
<br>
<div class="content">
<h2 class="chapter-two">人们在黑暗中偷来……</h2>
<p class="bodytext">人们在黑暗中偷来、</p>
<p class="bodytext">又在黑暗中归还的吻，</p>
<p class="bodytext">对于正在恋爱的心，</p>
<p class="bodytext">这是多么快意的吻！</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">就在此时，心儿勾起</p>
<p class="bodytext">无限回忆和预感的遐想，</p>
<p class="bodytext">想起许多过去的日子，</p>
<p class="bodytext">又想到许多未来的情况。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">可是，在接吻的时候，</p>
<p class="bodytext">怎能这样地思虑重重；——</p>
<p class="bodytext">亲爱的心啊，情愿哭泣，</p>
<p class="bodytext">因为哭泣倒比较轻松。</p>
<p class="bodytext-right">（钱春绮 译）</p>
