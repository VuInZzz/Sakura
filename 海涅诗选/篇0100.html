<p class="title1">给一个变节者</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1824</p>
<br>
<div class="content">

<span class="noteSuper">[41]</span>



</h2>

<p class="bodytext">哦，神圣的青年的勇气！</p>

<p class="bodytext">唉，你真是克制得多快！</p>

<p class="bodytext">你已经把热血冷却，</p>

<p class="bodytext">跟亲爱的上帝和解。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">你已经在爬向十字架，</p>

<p class="bodytext">就是你蔑视的十字架，</p>

<p class="bodytext">就在几个星期之前，</p>

<p class="bodytext">你还想把它踩在脚下！</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">施莱格尔<a id="note42" >

<span class="noteSuper">[42]</span>

</a>

 、哈勒尔<a id="note43" >

<span class="noteSuper">[43]</span>

</a>

 、伯克<a id="note44" >

<span class="noteSuper">[44]</span>

</a>

 ，</p>

<p class="bodytext">你多读了他们的书，</p>

<p class="bodytext">所以昨天还是个英雄，</p>

<p class="bodytext">今天已变成一个叛徒。</p>

<p class="bodytext-right">（钱春绮 译）</p>
