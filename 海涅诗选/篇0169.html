<p class="title1">教义</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1842</p>
<br>
<div class="content"><p class="bodytext">敲起鼓来，不要畏惧，</p>
<p class="bodytext">和随军女贩亲嘴去！</p>
<p class="bodytext">这就是全部的学问，</p>
<p class="bodytext">这就是书中的奥义。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">把人们从沉睡中敲醒，</p>
<p class="bodytext">敲起鼓来，用青春的力，</p>
<p class="bodytext">敲着鼓永远向前行进，</p>
<p class="bodytext">这就是全部的学问。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">这就是黑格尔的哲学，</p>
<p class="bodytext">这就是书中的奥义！</p>
<p class="bodytext">我懂得它，因为我是个</p>
<p class="bodytext">好鼓手，并且聪明伶俐。</p>
<p class="bodytext-right">（杨武能 译）</p>
</div>
