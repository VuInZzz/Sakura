<p class="title1">把你的脸贴住我的脸</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content"><p class="bodytext">把你的脸贴住我的脸，</p>
<p class="bodytext">眼泪就流在一起；</p>
<p class="bodytext">把你的心贴紧我的心，</p>
<p class="bodytext">爱火就迸在一起！</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">等我们潮水似的眼泪</p>
<p class="bodytext">淌到熊熊的火里，</p>
<p class="bodytext">等我的手臂搂紧住你——</p>
<p class="bodytext">我情愿殉情而死！</p>
<p class="bodytext-right">（钱春绮 译）</p>
</div>
