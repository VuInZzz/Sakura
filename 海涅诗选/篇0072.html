<p class="title1">我又走上从前的旧路</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1823</p>
<br>
<div class="content">
<h2 class="chapter-two">我又走上从前的旧路</h2>
<p class="bodytext">我又走上从前的旧路，</p>
<p class="bodytext">那非常熟悉的巷口；</p>
<p class="bodytext">我走过我恋人的家门，</p>
<p class="bodytext">却已是人去楼空。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">街道竟是那样狭窄！</p>
<p class="bodytext">石子路令人难忍！</p>
<p class="bodytext">房子像倒到我的头上！</p>
<p class="bodytext">我尽力拔足飞奔！</p>
<p class="bodytext-right">（钱春绮 译）</p>
