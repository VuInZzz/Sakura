<p class="title1">寒冷的心中揣着厌倦</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1827</p>
<br>
<div class="content">
<h2 class="chapter-two">寒冷的心中揣着厌倦</h2>
<p class="bodytext">寒冷的心中揣着厌倦，</p>
<p class="bodytext">我厌倦地走过寒冷的大地，</p>
<p class="bodytext">秋已近凋残，湿雾紧抱着</p>
<p class="bodytext">田野，田野早已经死去。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">风发出啸叫，飘零的红叶</p>
<p class="bodytext">被风卷着，在天空中摇曳，</p>
<p class="bodytext">树林在啜泣，荒野在叹息，</p>
<p class="bodytext">而最糟的是，还下起了雨。</p>
<p class="bodytext-right">（杨武能 译）</p>
