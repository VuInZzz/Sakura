<p class="title1">恋人啊，我们并坐着</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">
<h2 class="chapter-two">恋人啊，我们并坐着</h2>
<p class="bodytext">恋人啊，我们并坐着；</p>
<p class="bodytext">亲密地驾着轻舟。</p>
<p class="bodytext">夜色幽静，我们在</p>
<p class="bodytext">辽阔的海面上漂流。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">月光下朦胧地躺着</p>
<p class="bodytext">美丽的神仙岛屿；</p>
<p class="bodytext">那儿传来了仙乐，</p>
<p class="bodytext">飘舞着袅袅的轻雾。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">仙乐越来越动听，</p>
<p class="bodytext">轻雾飘去又飘来；</p>
<p class="bodytext">我们却郁郁寡欢，</p>
<p class="bodytext">漂过汪洋的大海。</p>
<p class="bodytext-right">（钱春绮 译）</p>
