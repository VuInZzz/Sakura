<p class="title1">给一个政治诗人</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1843</p>
<br>
<div class="content"></span>
</p>
<p class="bodytext">满怀里是英雄气概；</p>
<p class="bodytext">但是你却选错了</p>
<p class="bodytext">你的听众和你的时代。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">他们诚然满意地倾听，</p>
<p class="bodytext">感到兴奋，还不住赞美：</p>
<p class="bodytext">你多么能掌握形式，</p>
<p class="bodytext">你的思想是多么高贵。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">他们也常常举起酒杯，</p>
<p class="bodytext">给你祝贺健康，</p>
<p class="bodytext">并且大声呼啸，</p>
<p class="bodytext">把你的一些战歌歌唱。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">奴仆喜欢唱一首自由歌，</p>
<p class="bodytext">晚间坐在酒馆内：</p>
<p class="bodytext">这能够助长消化力，</p>
<p class="bodytext">也给饮料添些香味。</p>
<p class="bodytext-right">（冯至 译）</p>
