<p class="title1">他们告诉你很多</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">
<h2 class="chapter-two">他们告诉你很多</h2>
<p class="bodytext">他们告诉你很多，</p>
<p class="bodytext">大大地将我责怪；</p>
<p class="bodytext">而我内心的痛苦，</p>
<p class="bodytext">他们却不说出来。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">他们在议论纷纷，</p>
<p class="bodytext">摇摇头表示悲愤；</p>
<p class="bodytext">他们唤我为坏人，</p>
<p class="bodytext">你全都信以为真。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">可是最糟的事情，</p>
<p class="bodytext">他们是一无所知；</p>
<p class="bodytext">最糟最傻的事情，</p>
<p class="bodytext">我都暗藏在心里。</p>
<p class="bodytext-right">（钱春绮 译）</p>
