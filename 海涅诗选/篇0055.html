<p class="title1">我在睡梦中哭过</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">
<h2 class="chapter-two">我在睡梦中哭过</h2>
<p class="bodytext">我在睡梦中哭过，</p>
<p class="bodytext">梦见你在墓中沉睡。</p>
<p class="bodytext">当我醒时，泪珠儿</p>
<p class="bodytext">还从脸上流下来。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">我在睡梦中哭过，</p>
<p class="bodytext">梦见你将我遗弃。</p>
<p class="bodytext">当我醒时，我依然</p>
<p class="bodytext">哀哀地哭了多时。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">我在睡梦中哭过，</p>
<p class="bodytext">梦见你没改变心肠。</p>
<p class="bodytext">当我醒时，泪珠儿</p>
<p class="bodytext">依然像潮涌一样。</p>
<p class="bodytext-right">（钱春绮 译）</p>
