<p class="title1">苗条的睡莲花儿</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1828</p>
<br>
<div class="content">
<h2 class="chapter-two">苗条的睡莲花儿</h2>
<p class="bodytext">苗条的睡莲花儿</p>
<p class="bodytext">从湖中蒙眬地仰望；</p>
<p class="bodytext">月亮俯向她问好，</p>
<p class="bodytext">怀着恋慕的哀伤。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">她又把她的小头</p>
<p class="bodytext">含羞地垂向水里——</p>
<p class="bodytext">她看到脚边又跟着</p>
<p class="bodytext">可怜的苍白的小子。</p>
<p class="bodytext-right">（钱春绮 译）</p>
