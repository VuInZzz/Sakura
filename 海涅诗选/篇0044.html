<p class="title1">啊，我真愿……</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">
<h2 class="chapter-two">啊，我真愿……</h2>
<p class="chapter-two">（头 说：）</p>
<p class="bodytext">啊，我真愿变成一张小板凳，</p>
<p class="bodytext">供我的心上人搁脚！</p>
<p class="bodytext">任她怎样踏我，踩我，</p>
<p class="bodytext">我也绝不抱怨、喊叫。</p>
<p class="chapter-two">（心 说：）</p>
<p class="bodytext">啊，我真愿变成一只小布袋，</p>
<p class="bodytext">供我的心上人插针！</p>
<p class="bodytext">任她怎样戳我，刺我，</p>
<p class="bodytext">我也一样快乐、欢欣。</p>
<p class="chapter-two">（歌 说：）</p>
<p class="bodytext">啊，我真愿变成一片小纸条，</p>
<p class="bodytext">供我的心上人卷发！</p>
<p class="bodytext">我要悄悄凑近她耳边，</p>
<p class="bodytext">对她诉说我心里的话。</p>
<p class="bodytext-right">（杨武能 译）</p>
