<p class="title1">警告</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1855</p>
<br>
<div class="content"><p class="bodytext">不要用冷冰冰的语调，</p>
<p class="bodytext">伤害那个陌生小伙子，</p>
<p class="bodytext">他可怜巴巴地来求你布施——</p>
<p class="bodytext">他没准儿是神的儿子。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">有朝一日你再见到他，</p>
<p class="bodytext">灵光将环绕着他的头：</p>
<p class="bodytext">他谴责你的严厉目光，</p>
<p class="bodytext">你的眼睛将难以忍受。</p>
<p class="bodytext-right">（杨武能 译）</p>
</div>
