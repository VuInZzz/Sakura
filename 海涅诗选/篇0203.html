<p class="title1">垂死者</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1851</p>
<br>
<div class="content">
<h2 class="chapter-two">垂死者</h2>
<p class="bodytext">为追求光明幸福，你曾远走高飞，</p>
<p class="bodytext">如今两手空空归来，你真叫狼狈。</p>
<p class="bodytext">德意志的忠贞，德意志的衬衫，</p>
<p class="bodytext">它们也在异乡被磨破、扯碎。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">你脸色苍白，如同死人，</p>
<p class="bodytext">然而身已在家，心感快慰。</p>
<p class="bodytext">在德意志祖国的泥土里，</p>
<p class="bodytext">能像在温暖的火炉旁一般安睡。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">遗憾的是，有人已经瘫痪，</p>
<p class="bodytext">纵然希望，也不能再把家还——</p>
<p class="bodytext">只能伸出双臂，哀哀求告：</p>
<p class="bodytext">上帝啊，求你把我可怜可怜！</p>
<p class="bodytext-right">（杨武能 译）</p>
