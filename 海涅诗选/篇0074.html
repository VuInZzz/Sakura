<p class="date">乘着歌声的翅膀：海涅诗选 · 1823</p>
<br>
<div class="content">

<h2 class="chapter-two">我站在黑暗的梦中</h2>

<p class="bodytext">我站在黑暗的梦中，</p>

<p class="bodytext">凝望着她的画像，</p>

<p class="bodytext">她那可爱的面貌，</p>

<p class="bodytext">像暗暗活起来一样。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">一种奇妙的微笑，</p>

<p class="bodytext">浮在她嘴唇周围，</p>

<p class="bodytext">而她那一双眼睛，</p>

<p class="bodytext">闪耀着忧伤的眼泪。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">从我的两颊上面，</p>

<p class="bodytext">也不由掉下泪珠——</p>

<p class="bodytext">唉，我真不能相信，</p>

<p class="bodytext">我已经把你失去！</p>

<p class="bodytext-right">（钱春绮 译）</p>
