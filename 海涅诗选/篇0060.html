<p class="title1">五月已来到人间</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">
<h2 class="chapter-two">五月已来到人间</h2>
<p class="bodytext">五月已来到人间，</p>
<p class="bodytext">花木都欣欣向荣，</p>
<p class="bodytext">那蔷薇色的云彩</p>
<p class="bodytext">飘过蔚蓝的天空。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">从高枝茂叶丛中</p>
<p class="bodytext">传来夜莺的歌唱，</p>
<p class="bodytext">在那绿苜蓿之中</p>
<p class="bodytext">跳着白色的羔羊。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">我不能唱，不能跳，</p>
<p class="bodytext">病倒在芳草丛中；</p>
<p class="bodytext">听到远处的音响，</p>
<p class="bodytext">我做着莫名的梦。</p>
<p class="bodytext-right">（钱春绮 译）</p>
