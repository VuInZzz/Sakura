<p class="title1">北方有一棵松树</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">
<h2 class="chapter-two">北方有一棵松树</h2>
<p class="bodytext">北方有一棵松树，</p>
<p class="bodytext">孤零零立在秃冈上。</p>
<p class="bodytext">冰雪替它蒙上白被，</p>
<p class="bodytext">送它沉沉入梦乡。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">它梦见一棵棕榈，</p>
<p class="bodytext">在遥远遥远的东方，</p>
<p class="bodytext">孤单单暗自哀戚，</p>
<p class="bodytext">在火辣辣的岩壁上。</p>
<p class="bodytext-right">（杨武能 译）</p>
