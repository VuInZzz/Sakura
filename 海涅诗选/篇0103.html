<p class="title1">夏季的暮色朦朦胧胧地</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1824</p>
<br>
<div class="content">

<h2 class="chapter-two">夏季的暮色朦朦胧胧地</h2>

<p class="bodytext">夏季的暮色朦朦胧胧地</p>

<p class="bodytext">笼罩在森林和绿野上面；</p>

<p class="bodytext">金色的月亮，在蓝天里，</p>

<p class="bodytext">泻下清光，香气四溢。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">溪边传来蟋蟀的叫声，</p>

<p class="bodytext">水中似有什么在活动，</p>

<p class="bodytext">行人听到，在沉寂之中</p>

<p class="bodytext">有一种呼吸和拍水之声。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">就在那边小溪之旁，</p>

<p class="bodytext">美丽的爱尔芬<a id="note48" >

<span class="noteSuper">[48]</span>

</a>

 独自洗澡；</p>

<p class="bodytext">手臂和颈项，洁白可爱，</p>

<p class="bodytext">在月亮下面闪闪发光。</p>

<p class="bodytext-right">（钱春绮 译）</p>
