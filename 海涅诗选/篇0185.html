<p class="title1">题玛蒂尔德的纪念册</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1845</p>
<br>
<div class="content">题玛蒂尔德<a id="note152" >

<span class="noteSuper">[152]</span>

</a>

 的纪念册</h2>

<p class="bodytext">这儿，在压得硬挺的破布上，</p>

<p class="bodytext">我奉命用一支鹅毛笔，</p>

<p class="bodytext">一半认真，一半儿戏，</p>

<p class="bodytext">涂写下几行拙劣的诗句——</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">我，原本只习惯在你</p>

<p class="bodytext">红红的小嘴上，用亲吻</p>

<p class="bodytext">倾述我迸发自心底的</p>

<p class="bodytext">烈火一般的爱情！</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">唉，要命的时髦！我是个</p>

<p class="bodytext">诗人，到头来得受妻子的刑罚，</p>

<p class="bodytext">直到我也学着别的雅士文人，</p>

<p class="bodytext">在她的本子里写上押韵的废话。</p>

<p class="bodytext-right">（杨武能 译）</p>
