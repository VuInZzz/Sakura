<p class="title1">教训</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1816</p>
<br>
<div class="content">
<h2 class="chapter-two">教训</h2>
<p class="bodytext">母亲告诫小蜜蜂：</p>
<p class="bodytext">“发光的蜡烛别去碰！”</p>
<p class="bodytext">母亲不停地讲啊讲，</p>
<p class="bodytext">小蜜蜂全当耳边风。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">它围着烛光团团转，</p>
<p class="bodytext">还一个劲儿嗡嗡嗡，</p>
<p class="bodytext">听不见母亲大声唤：</p>
<p class="bodytext">“小蜜蜂呀，小蜜蜂！”</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">青春的血液，狂暴的血液</p>
<p class="bodytext">把它赶进了烛焰中，</p>
<p class="bodytext">烛焰中间火熊熊，</p>
<p class="bodytext">“小蜜蜂哟，小蜜蜂！”</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">只见红光一忽闪，</p>
<p class="bodytext">烈火已将它葬送——</p>
<p class="bodytext">小伙子啊，小伙子，</p>
<p class="bodytext">年轻的姑娘别瞎碰！</p>
<p class="bodytext-right">（杨武能 译）</p>
