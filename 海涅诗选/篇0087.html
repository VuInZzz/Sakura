<p class="title1">第一次谈情说爱的人</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1823</p>
<br>
<div class="content">
<h2 class="chapter-two">第一次谈情说爱的人</h2>
<p class="bodytext">第一次谈情说爱的人，</p>
<p class="bodytext">虽不成功，总是个神仙；</p>
<p class="bodytext">可是第二次再谈恋爱，</p>
<p class="bodytext">还不成功，他就是笨蛋。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">我，这种笨蛋，我去恋爱，</p>
<p class="bodytext">又没有获得对方垂青！</p>
<p class="bodytext">太阳、月亮和星辰大笑，</p>
<p class="bodytext">我也跟着笑——就此丧命。</p>
<p class="bodytext-right">（钱春绮 译）</p>
