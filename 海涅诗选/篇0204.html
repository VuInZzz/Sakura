<p class="title1">穷光蛋哲学</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1851</p>
<br>
<div class="content">

<h2 class="chapter-two">穷光蛋哲学</h2>

<p class="bodytext">要讨好那班富儿们，</p>

<p class="bodytext">你只能实打实地谄媚——</p>

<p class="bodytext">钱是实打实的玩意儿，孩子</p>

<p class="bodytext">也喜欢实打实的恭维。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">在每一尊金牛犊<a id="note190" >

<span class="noteSuper">[190]</span>

</a>

 前，</p>

<p class="bodytext">你要使劲摇动香炉；</p>

<p class="bodytext">灰里泥里一样下跪祷告，</p>

<p class="bodytext">顶要紧是颂词不能含糊。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">这年头儿面包太贵，</p>

<p class="bodytext">漂亮话却一文不值——</p>

<p class="bodytext">你不妨赞颂主人家的狗，</p>

<p class="bodytext">只要因此能猛喝猛吃。</p>

<p class="bodytext-right">（杨武能 译）</p>
