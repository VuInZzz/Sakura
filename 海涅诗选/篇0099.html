<p class="title1">死是清凉的黑夜</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1824</p>
<br>
<div class="content">
<h2 class="chapter-two">死是清凉的黑夜</h2>
<p class="bodytext">死是清凉的黑夜，</p>
<p class="bodytext">生是闷热的白天。</p>
<p class="bodytext">暮色朦胧，昏昏欲眠，</p>
<p class="bodytext">白天已令我厌倦。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">我床头长出一棵树，</p>
<p class="bodytext">夜莺儿在枝间鸣啭，</p>
<p class="bodytext">它一个劲儿歌唱爱，</p>
<p class="bodytext">我在梦中仍然听见。</p>
<p class="bodytext-right">（杨武能 译）</p>
