<p class="title1">我又重温了昔日的旧梦</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">
<h2 class="chapter-two">我又重温了昔日的旧梦</h2>
<p class="bodytext">我又重温了昔日的旧梦，</p>
<p class="bodytext">梦见我俩坐在菩提树荫，</p>
<p class="bodytext">在一个美好的五月之夜，</p>
<p class="bodytext">我俩发誓相互永远忠诚。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">发完一个誓再发一个誓，</p>
<p class="bodytext">我俩嬉笑、爱抚又亲吻，</p>
<p class="bodytext">你并且在我手上咬一口，</p>
<p class="bodytext">为了使我把誓言记在心。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">我明眸生辉的小爱人啊！</p>
<p class="bodytext">你这么妩媚却这么任性！</p>
<p class="bodytext">发誓忠诚纵然理所应当，</p>
<p class="bodytext">咬我一口可实在是过分。</p>
<p class="bodytext-right">（杨武能 译）</p>
