<p class="title1">致青年</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1846</p>
<br>
<div class="content"></span>

</p>

<p class="bodytext">将你引诱，将你迷惑！</p>

<p class="bodytext">刀剑铿锵，箭矢鸣响，</p>

<p class="bodytext">也不能使英雄停步、退缩。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">大胆开始已成功一半，</p>

<p class="bodytext">一个亚历山大<a id="note155" >

<span class="noteSuper">[155]</span>

</a>

 能征服世界！</p>

<p class="bodytext">何必左思右想！王妃们</p>

<p class="bodytext">已跪在帐幕中，等胜利者到来。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">我们勇敢，我们进取！我们</p>

<p class="bodytext">作为后继者登上大流士的王位。</p>

<p class="bodytext">啊，幸福的毁灭，光辉的死亡！</p>

<p class="bodytext">胜利了死在巴比伦也令人陶醉！</p>

<p class="bodytext-right">（杨武能 译）</p>
