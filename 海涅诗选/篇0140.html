<p class="title1">每当你经过我身旁</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1828</p>
<br>
<div class="content">
<h2 class="chapter-two">每当你经过我身旁</h2>
<p class="bodytext">每当你经过我身旁，</p>
<p class="bodytext">只要衣裙碰我一碰，</p>
<p class="bodytext">我的心立刻欢呼雀跃，</p>
<p class="bodytext">狂热地追随你的芳踪。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">可一旦你转过脸来，</p>
<p class="bodytext">睁大眼睛瞪我一瞪，</p>
<p class="bodytext">我的心立刻惊惶失措，</p>
<p class="bodytext">收住脚步再不能前进。</p>
<p class="bodytext-right">（杨武能 译）</p>
