<p class="title1">如果人家背叛了你</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1847</p>
<br>
<div class="content"><p class="bodytext">如果人家背叛了你，</p>
<p class="bodytext">那你更要加倍忠诚；</p>
<p class="bodytext">如果你的心郁闷得要命，</p>
<p class="bodytext">那你就快去拿起七弦琴。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">拨动琴弦！唱起英雄赞歌，</p>
<p class="bodytext">让歌声像火一般炽热！</p>
<p class="bodytext">这一来怒气就会消解，</p>
<p class="bodytext">你的心就会甜蜜地流尽血。</p>
<p class="bodytext-right">（杨武能 译）</p>
</div>
