<p class="title1">铭记</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1855</p>
<br>
<div class="content">
<h2 class="chapter-two">铭记</h2>
<p class="bodytext">你永远别去戏弄</p>
<p class="bodytext">那些头脑昏聩的小市民，</p>
<p class="bodytext">那些心地狭隘的蠢人。</p>
<p class="bodytext">在我们的戏谑中，</p>
<p class="bodytext">只有宽广而聪慧的心灵</p>
<p class="bodytext">始终能发现友爱之情。</p>
<p class="bodytext-right">（杨武能 译）</p>
