<p class="title1">世界这样美，天空这样青</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">
<h2 class="chapter-two">世界这样美，天空这样青</h2>
<p class="bodytext">世界这样美，天空这样青，</p>
<p class="bodytext">微风吹得这样温和宁静，</p>
<p class="bodytext">百花在绿野里眨着眼睛，</p>
<p class="bodytext">闪耀着带着朝露的光影，</p>
<p class="bodytext">我环顾世人都高高兴兴——</p>
<p class="bodytext">可是我却想在墓中栖身，</p>
<p class="bodytext">偎依着一位死去的恋人。</p>
<p class="bodytext-right">（钱春绮 译）</p>
