<p class="title1">世道</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1851</p>
<br>
<div class="content">
<h2 class="chapter-two">世道</h2>
<p class="bodytext">谁有的多，他马上会</p>
<p class="bodytext">得到更多更多。</p>
<p class="bodytext">谁只有一点，这一点</p>
<p class="bodytext">也会被人抢夺。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">你要是一无所有，</p>
<p class="bodytext">唉，快叫人把你埋进土里——</p>
<p class="bodytext">须知只有有钱人，穷鬼啊，</p>
<p class="bodytext">才有生存的权利。</p>
<p class="bodytext-right">（杨武能 译）</p>
