<p class="title1">每逢我在清晨</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1823</p>
<br>
<div class="content">
<h2 class="chapter-two">每逢我在清晨</h2>
<p class="bodytext">每逢我在清晨</p>
<p class="bodytext">从你的房前走过，</p>
<p class="bodytext">我看见你在窗内，</p>
<p class="bodytext">亲爱的，我就快乐。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">你探索着凝视着我，</p>
<p class="bodytext">用你深褐的眼睛：</p>
<p class="bodytext">“你这他乡多病的人，</p>
<p class="bodytext">你是谁，你有什么病？”</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">“我是一个德国诗人，</p>
<p class="bodytext">在德国的境内闻名；</p>
<p class="bodytext">说出那些最好的名姓，</p>
<p class="bodytext">也就说出我的姓名。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">“我跟一些人一样，</p>
<p class="bodytext">在德国感到同样的病苦；</p>
<p class="bodytext">说出那些最坏的苦痛，</p>
<p class="bodytext">也就说出我的痛苦。”</p>
<p class="bodytext-right">（冯至 译）</p>
