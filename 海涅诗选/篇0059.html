<p class="title1">尽管外面飞雪成堆</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">
<h2 class="chapter-two">尽管外面飞雪成堆</h2>
<p class="bodytext">尽管外面飞雪成堆，</p>
<p class="bodytext">冰雹降落，狂风乱吹，</p>
<p class="bodytext">嘎吱地震响我的窗户，</p>
<p class="bodytext">我也绝对不会叫苦，</p>
<p class="bodytext">因为在我的胸中有我</p>
<p class="bodytext">恋人的倩影、阳春的欢乐。</p>
<p class="bodytext-right">（钱春绮 译）</p>
