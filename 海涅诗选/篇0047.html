<p class="title1">一个青年爱一个姑娘</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">
<h2 class="chapter-two">一个青年爱一个姑娘</h2>
<p class="bodytext">一个青年爱一个姑娘，</p>
<p class="bodytext">姑娘却相中另一个人；</p>
<p class="bodytext">这人偏又爱另一个女子，</p>
<p class="bodytext">并且跟她结了婚。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">姑娘于是恼羞成怒，</p>
<p class="bodytext">嫁给了闯上门来的</p>
<p class="bodytext">随随便便一个男人，</p>
<p class="bodytext">叫青年好不伤心。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">这是一个古老的故事，</p>
<p class="bodytext">然而它却永远新鲜，</p>
<p class="bodytext">谁要刚巧碰上这事，</p>
<p class="bodytext">谁的心就裂成两半。</p>
<p class="bodytext-right">（杨武能 译）</p>
