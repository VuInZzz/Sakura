<p class="title1">两个人分离之时</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">
<h2 class="chapter-two">两个人分离之时</h2>
<p class="bodytext">两个人分离之时，</p>
<p class="bodytext">总不免握手惜别，</p>
<p class="bodytext">开始流下了眼泪，</p>
<p class="bodytext">而且不住地叹息。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">我们并没有哭过，</p>
<p class="bodytext">也没有唉声叹气！</p>
<p class="bodytext">直到分别了以后，</p>
<p class="bodytext">我们才流泪叹息。</p>
<p class="bodytext-right">（钱春绮 译）</p>
