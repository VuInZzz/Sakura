<p class="title1">一颗星星落下来</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">

<h2 class="chapter-two">一颗星星落下来</h2>

<p class="bodytext">一颗星星落下来</p>

<p class="bodytext">从它闪烁的高空！</p>

<p class="bodytext">这是一颗爱情的星，</p>

<p class="bodytext">我看它在那里陨落。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">苹果树上落下来</p>

<p class="bodytext">许多的花瓣花朵。</p>

<p class="bodytext">吹来轻佻的微风，</p>

<p class="bodytext">它们把落花戏弄。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">天鹅在池里歌唱，</p>

<p class="bodytext">它浮过来浮过去，</p>

<p class="bodytext">它越唱声音越轻，</p>

<p class="bodytext">最后伸入水的坟墓。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">这样的寂静、阴暗！</p>

<p class="bodytext">花瓣花朵都吹散，</p>

<p class="bodytext">那颗星戛然粉碎，</p>

<p class="bodytext">天鹅歌<a id="note17" >

<span class="noteSuper">[17]</span>

</a>

 也无声中断。</p>

<p class="bodytext-right">（冯至 译）</p>
