<p class="title1">你要有一双好眼睛</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1830</p>
<br>
<div class="content">
<h2 class="chapter-two">你要有一双好眼睛</h2>
<p class="bodytext">你要有一双好眼睛，</p>
<p class="bodytext">能看透我的歌曲，</p>
<p class="bodytext">你就看见一个美女，</p>
<p class="bodytext">在我的歌中踯躅。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">你要有一双好耳朵，</p>
<p class="bodytext">能听见她的声音，</p>
<p class="bodytext">她的叹息、欢笑和歌唱，</p>
<p class="bodytext">就会扰乱你可怜的心。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">她将用目光和言语，</p>
<p class="bodytext">像迷惑我一样迷惑你，</p>
<p class="bodytext">你将做着爱的春梦，</p>
<p class="bodytext">迷路在无边的密林里。</p>
<p class="bodytext-right">（杨武能 译）</p>
