<p class="title1">大实话</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1820</p>
<br>
<div class="content">
<h2 class="chapter-two">大实话</h2>
<p class="bodytext">当春天带来明媚的阳光，</p>
<p class="bodytext">花朵便会竞相开放；</p>
<p class="bodytext">当月亮踏上光辉的旅程，</p>
<p class="bodytext">星星便会随后徜徉；</p>
<p class="bodytext">当歌手瞅见盈盈的秋波，</p>
<p class="bodytext">歌声便会涌出心房——</p>
<p class="bodytext">可是歌声、星星和花朵，</p>
<p class="bodytext">还有明眸、月光和春阳，</p>
<p class="bodytext">这些东西尽管叫人喜爱，</p>
<p class="bodytext">却还远远不能构成世界。</p>
<p class="bodytext-right">（杨武能 译）</p>
