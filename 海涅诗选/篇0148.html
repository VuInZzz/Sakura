<p class="title1">优美悦耳的乐音</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1830</p>
<br>
<div class="content">
<h2 class="chapter-two">优美悦耳的乐音</h2>
<p class="bodytext">优美悦耳的乐音，</p>
<p class="bodytext">回响在我的心房，</p>
<p class="bodytext">飘扬吧，你这春天的歌儿，</p>
<p class="bodytext">飘向那遥远遥远的地方。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">飘到那所小小的屋前，</p>
<p class="bodytext">那儿盛开着无数鲜花，</p>
<p class="bodytext">你要是见着一朵玫瑰，</p>
<p class="bodytext">请对她讲，我问候她。</p>
<p class="bodytext-right">（杨武能 译）</p>
