<p class="title1">每时，每日，永恒的年华</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1855</p>
<br>
<div class="content">
<h2 class="chapter-two">每时，每日，永恒的年华</h2>
<p class="bodytext">每时，每日，永恒的年华，</p>
<p class="bodytext">它们就像是蜗牛在爬；</p>
<p class="bodytext">这些无情的巨大的蜗牛</p>
<p class="bodytext">伸出它们的触角漫游。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">常常在荒凉的地方，</p>
<p class="bodytext">常常在迷雾的海上，</p>
<p class="bodytext">闪着一线可爱的金光，</p>
<p class="bodytext">像我恋人的眼睛一样。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">可是就在这同一刹那，</p>
<p class="bodytext">喜气全消，我只剩下</p>
<p class="bodytext">我这难以忍受的苦恼，</p>
<p class="bodytext">我这昏昏沉沉的知觉。</p>
<p class="bodytext-right">（钱春绮 译）</p>
</div>
