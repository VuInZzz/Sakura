<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">

<h2 class="chapter-two">我在异乡流连忘返</h2>

<p class="bodytext">我在异乡流连忘返，</p>

<p class="bodytext">耽搁很长很长的时间：</p>

<p class="bodytext">我爱人感到等得太长，</p>

<p class="bodytext">她缝制好结婚的衣裳，</p>

<p class="bodytext">玉臂挽着的那位新官人，</p>

<p class="bodytext">是蠢青年中最蠢的人。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">我的恋人温柔而漂亮，</p>

<p class="bodytext">她的倩影真使我难忘；</p>

<p class="bodytext">紫罗兰眼睛，蔷薇花的脸，</p>

<p class="bodytext">年年盛开得非常鲜艳。</p>

<p class="bodytext">我竟错过了这样的姑娘，</p>

<p class="bodytext">真是我蠢举中最蠢的一桩。</p>

<p class="bodytext-right">（钱春绮 译）</p>
