<p class="title1">伤心人</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1820</p>
<br>
<div class="content"><p class="bodytext">看到那苍白的少年，</p>
<p class="bodytext">人人都要忧心悄悄，</p>
<p class="bodytext">因为在他的脸上</p>
<p class="bodytext">铭刻着痛苦和烦恼。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">充满同情的微风</p>
<p class="bodytext">扇凉他闷热的额角；</p>
<p class="bodytext">从前那些冷淡的姑娘，</p>
<p class="bodytext">乐意报以宽慰的微笑。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">他避开市民的喧嚣，</p>
<p class="bodytext">一直向森林奔逃。</p>
<p class="bodytext">那儿有树叶在欢鸣，</p>
<p class="bodytext">那儿有小鸟在欢叫。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">可是当这个伤心人</p>
<p class="bodytext">慢慢地走近森林，</p>
<p class="bodytext">鸟儿都停止歌唱，</p>
<p class="bodytext">树叶也发出悲鸣。</p>
<p class="bodytext-right">（钱春绮 译）</p>
</div>
