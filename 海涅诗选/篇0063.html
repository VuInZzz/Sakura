<p class="title1">在我极端黑暗的生涯里</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1823</p>
<br>
<div class="content">
<h2 class="chapter-two">在我极端黑暗的生涯里</h2>
<p class="bodytext">在我极端黑暗的生涯里</p>
<p class="bodytext">曾闪耀过一个清姿；</p>
<p class="bodytext">如今这清姿已经消失，</p>
<p class="bodytext">我周围尽是茫茫的黑夜。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">孩子们处于黑暗之中，</p>
<p class="bodytext">常会觉得惴惴不安，</p>
<p class="bodytext">他们总是高声唱歌，</p>
<p class="bodytext">以便把那恐怖驱散。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">我这一个发痴的孩子，</p>
<p class="bodytext">如今在黑暗之中唱歌；</p>
<p class="bodytext">歌声虽然不很悦耳，</p>
<p class="bodytext">却驱散了我的忧愁。</p>
<p class="bodytext-right">（钱春绮 译）</p>
