<p class="title1">大风吹奏起舞曲</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1823</p>
<br>
<div class="content">

<span class="noteSuper">[27]</span>



</h2>

<p class="bodytext">大风吹奏起舞曲，</p>

<p class="bodytext">它呼啸、怒吼、凄鸣；</p>

<p class="bodytext">小船颠簸得多厉害！</p>

<p class="bodytext">黑夜正得意而忘形。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">汹涌的大海形成了</p>

<p class="bodytext">一座活动的波峰；</p>

<p class="bodytext">那边堆起了白山，</p>

<p class="bodytext">这边陷成个黑窟窿。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">船舱里传来一阵</p>

<p class="bodytext">呕吐、祈祷和骂声；</p>

<p class="bodytext">我紧紧抱住桅杆，</p>

<p class="bodytext">祝愿我太太平平。</p>

<p class="bodytext-right">（钱春绮 译）</p>
