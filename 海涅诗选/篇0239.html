<p class="title1">仲裁</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1855</p>
<br>
<div class="content">
<h2 class="chapter-two">仲裁</h2>
<p class="bodytext">你很热情，你有勇气——</p>
<p class="bodytext">这也是好事！</p>
<p class="bodytext">可是不能拿宝贵的热情</p>
<p class="bodytext">完全来代替沉着冷静。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">敌人不是为正义和光明</p>
<p class="bodytext">进行战争——</p>
<p class="bodytext">但他们有枪，还有不少</p>
<p class="bodytext">大炮和许多百磅大炮。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">镇静地拿起你的武器——</p>
<p class="bodytext">扳上枪机——</p>
<p class="bodytext">瞄准——如果敌人阵亡，</p>
<p class="bodytext">你的心也会心花怒放。</p>
<p class="bodytext-right">（钱春绮 译）</p>
