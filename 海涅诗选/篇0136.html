<p class="title1">我爱着一朵花</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1828</p>
<br>
<div class="content">
<h2 class="chapter-two">我爱着一朵花</h2>
<p class="bodytext">我爱着一朵花，却不知是哪朵，</p>
<p class="bodytext">叫我多么伤心。</p>
<p class="bodytext">我观察遍所有的花萼花蕊，</p>
<p class="bodytext">想寻找一颗心。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">百花在晚霞中吐放芬芳，</p>
<p class="bodytext">夜莺在枝头歌唱，</p>
<p class="bodytext">我寻找一颗心，像我的一样美，</p>
<p class="bodytext">像我的一样跳荡。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">夜莺在枝头歌唱，</p>
<p class="bodytext">我理解它的歌声，</p>
<p class="bodytext">它和我一样的伤心、忧戚，</p>
<p class="bodytext">我和它一样的忧戚、伤心。</p>
<p class="bodytext-right">（杨武能 译）</p>
