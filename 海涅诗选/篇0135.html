<p class="title1">春夜的美丽的眼睛</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1828</p>
<br>
<div class="content"><p class="bodytext">春夜的美丽的眼睛</p>
<p class="bodytext">俯视着我，安慰我说：</p>
<p class="bodytext">曾经使你心灰意懒的爱情，</p>
<p class="bodytext">如今它将叫你精神振作。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">听，在绿色的菩提树上，</p>
<p class="bodytext">一只夜莺唱着甜美的歌；</p>
<p class="bodytext">一当歌声飞进我的心中，</p>
<p class="bodytext">我的心房又将舒畅、开阔。</p>
<p class="bodytext-right">（杨武能 译）</p>
</div>
