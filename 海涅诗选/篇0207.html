<p class="title1">告诫</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1851</p>
<br>
<div class="content">
<h2 class="chapter-two">告诫</h2>
<p class="bodytext">不朽的灵魂啊，你得当心；</p>
<p class="bodytext">有朝一日和尘世分别，</p>
<p class="bodytext">你当心别出什么事情；</p>
<p class="bodytext">因为路将通过死和夜。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">在光明之都的金门前，</p>
<p class="bodytext">守卫着上帝的士兵；</p>
<p class="bodytext">他们只问你在世的业绩，</p>
<p class="bodytext">却不问姓什么？官几品？</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">朝圣者在门口将留下</p>
<p class="bodytext">仆仆风尘的局促皮靴——</p>
<p class="bodytext">进去吧，你将得到安宁、</p>
<p class="bodytext">宽松的拖鞋和优美的音乐。</p>
<p class="bodytext-right">（杨武能 译）</p>
