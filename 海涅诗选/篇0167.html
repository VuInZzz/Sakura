<p class="title1">为了一个大胆的念头</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1841</p>
<br>
<div class="content"><p class="bodytext">为了一个大胆的念头，</p>
<p class="bodytext">我付出了自己的生命；</p>
<p class="bodytext">如今冒险已经失败，</p>
<p class="bodytext">我的心啊，别怨恨！</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">萨克森人道得好：</p>
<p class="bodytext">“人的意愿即人的天堂”——</p>
<p class="bodytext">我虽然付出了生命，</p>
<p class="bodytext">可是却如愿以偿！</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">我所感受的幸福</p>
<p class="bodytext">的确十分短暂；</p>
<p class="bodytext">然而为幸福陶醉的人</p>
<p class="bodytext">不会把时间计算。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">哪儿有幸福，那儿</p>
<p class="bodytext">就有永生，那儿就会</p>
<p class="bodytext">爱火熊熊，光明温暖，</p>
<p class="bodytext">不复存在空间、时间。</p>
<p class="bodytext-right">（杨武能译）</p>
</div>
