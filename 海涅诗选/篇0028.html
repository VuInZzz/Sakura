<p class="title1">小花儿如果知道</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1821</p>
<br>
<div class="content">
<h2 class="chapter-two">小花儿如果知道</h2>
<p class="bodytext">小花儿如果知道，</p>
<p class="bodytext">我的心受伤多重，</p>
<p class="bodytext">它们将伴我流泪，</p>
<p class="bodytext">来医治我的苦痛。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">夜莺儿如果知道，</p>
<p class="bodytext">我怎样多病多愁，</p>
<p class="bodytext">它们将高高兴兴</p>
<p class="bodytext">给我唱安慰之歌。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">那些金色的星辰，</p>
<p class="bodytext">如知道我的伤悲，</p>
<p class="bodytext">它们会从天而降，</p>
<p class="bodytext">用好言将我安慰。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">它们都无法知道，</p>
<p class="bodytext">知道的只有一人：</p>
<p class="bodytext">就是那把我的心</p>
<p class="bodytext">亲手扯碎的伊人。</p>
<p class="bodytext-right">（钱春绮 译）</p>
