<p class="title1">他们今晚在请客</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1823</p>
<br>
<div class="content">
<h2 class="chapter-two">他们今晚在请客</h2>
<p class="bodytext">他们今晚在请客，</p>
<p class="bodytext">屋子里灯火通明。</p>
<p class="bodytext">在楼上明亮的窗口，</p>
<p class="bodytext">移动着一个人影。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">你看不到我，我独自</p>
<p class="bodytext">站在下面黑暗里；</p>
<p class="bodytext">你当然更不能看到</p>
<p class="bodytext">我的黑暗的心里。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">我黑暗的心在爱你，</p>
<p class="bodytext">它爱着，它碎了，</p>
<p class="bodytext">它碎了，抽搐、流血，</p>
<p class="bodytext">而你却不能看到。</p>
<p class="bodytext-right">（钱春绮 译）</p>
