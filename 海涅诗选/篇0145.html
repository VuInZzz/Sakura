<p class="title1">警告</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1829</p>
<br>
<div class="content">
<h2 class="chapter-two">警告</h2>
<p class="bodytext">你竟让出版这样的书，</p>
<p class="bodytext">老朋友，你完蛋啦！</p>
<p class="bodytext">你既想得到金钱名誉，</p>
<p class="bodytext">又怎么能不低声下气。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">啥时候我都不会劝你</p>
<p class="bodytext">这么去民众面前饶舌，</p>
<p class="bodytext">这么去谈论那些牧师，</p>
<p class="bodytext">以及高高在上的爵爷！</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">老朋友，你完蛋啦！</p>
<p class="bodytext">爵爷们有的是长胳膊，</p>
<p class="bodytext">牧师们有的是长舌头，</p>
<p class="bodytext">老百姓呢，有长耳朵！</p>
<p class="bodytext-right">（杨武能 译）</p>
