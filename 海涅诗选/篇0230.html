<p class="title1">忠告</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1854</p>
<br>
<div class="content">
<h2 class="chapter-two">忠告</h2>
<p class="bodytext">在你写的寓言里，</p>
<p class="bodytext">每个人物都得用真名实姓。</p>
<p class="bodytext">不这样做你更加倒霉：</p>
<p class="bodytext">立刻有一打老傻瓜跳出来，</p>
<p class="bodytext">自称是你写的驴子的原型——</p>
<p class="bodytext">“可不，这正是我的长耳朵！”</p>
<p class="bodytext">他们争着嚷嚷，“这可怕的叫声</p>
<p class="bodytext">也正是我的噪音！</p>
<p class="bodytext">这头驴子无疑是我，尽管没有</p>
<p class="bodytext">道出姓名；我的日耳曼祖国啊，</p>
<p class="bodytext">她一眼就能将我认清！</p>
<p class="bodytext">我就是这头驴子！</p>
<p class="bodytext">咿——啊！咿——啊！”</p>
<p class="bodytext">就这样，你为照顾一个傻瓜，</p>
<p class="bodytext">临了儿却惹恼了一打。</p>
<p class="bodytext-right">（杨武能 译）</p>
