<p class="title1">笃实</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1851</p>
<br>
<div class="content">
<h2 class="chapter-two">笃实</h2>
<p class="bodytext">爱情告诉歌神：</p>
<p class="bodytext">世风真是不好，</p>
<p class="bodytext">要她委身于他，</p>
<p class="bodytext">他先得给些担保。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">歌神笑着回答：</p>
<p class="bodytext">可不，世道已经变坏，</p>
<p class="bodytext">连你也像个老吝啬鬼，</p>
<p class="bodytext">不先收抵押不肯放债。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">唉，我只有一张七弦琴，</p>
<p class="bodytext">可制造这琴用的是纯金，</p>
<p class="bodytext">以它作抵押你能借给我</p>
<p class="bodytext">多少个吻，啊，小亲亲？</p>
<p class="bodytext-right">（杨武能 译）</p>
</div>
