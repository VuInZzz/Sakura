<p class="title1">春天很严肃</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1830</p>
<br>
<div class="content">
<h2 class="chapter-two">春天很严肃</h2>
<p class="bodytext">春天很严肃，它做的梦</p>
<p class="bodytext">非常凄凉，百花在注望，</p>
<p class="bodytext">无限痛苦，夜莺的歌声</p>
<p class="bodytext">荡漾着一种秘密的忧伤。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">哦，不要笑，亲爱的丽人，</p>
<p class="bodytext">别笑得这样兴高采烈！</p>
<p class="bodytext">哦，还是哭吧，我真甘愿</p>
<p class="bodytext">吻你脸上流下的眼泪。</p>
<p class="bodytext-right">（钱春绮 译）</p>
