<p class="title1">温暖的春夜</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1828</p>
<br>
<div class="content">
<h2 class="chapter-two">温暖的春夜</h2>
<p class="bodytext">是温暖的春夜，</p>
<p class="bodytext">催得百花开放；</p>
<p class="bodytext">我的心要不留神，</p>
<p class="bodytext">又会将谁爱上。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">不知百花中是谁，</p>
<p class="bodytext">将缠住我的心？</p>
<p class="bodytext">歌唱的夜莺警告说，</p>
<p class="bodytext">对百合最得当心。</p>
<p class="bodytext-right">（杨武能 译）</p>
