<p class="title1">哦，不要发誓，只要接吻</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">
<h2 class="chapter-two">哦，不要发誓，只要接吻</h2>
<p class="bodytext">哦，不要发誓，只要接吻，</p>
<p class="bodytext">女人的发誓我不相信！</p>
<p class="bodytext">你的话儿说得真甜，</p>
<p class="bodytext">可是我亲到的吻更甜！</p>
<p class="bodytext">有了它，我也就相信它，</p>
<p class="bodytext">言语只不过是空话。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">哦，恋人，你常常发誓吧，</p>
<p class="bodytext">我相信你嘴上的空话！</p>
<p class="bodytext">我只要倒在你的怀中，</p>
<p class="bodytext">我就自以为幸福无穷；</p>
<p class="bodytext">我相信你会永远爱我，</p>
<p class="bodytext">而且比永远更久地爱我。</p>
<p class="bodytext-right">（钱春绮 译）</p>
