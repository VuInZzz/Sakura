<p class="title1">你知道我还活着</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1823</p>
<br>
<div class="content">
<h2 class="chapter-two">你知道我还活着</h2>
<p class="bodytext">你知道我还活着，</p>
<p class="bodytext">怎么能那样安睡？</p>
<p class="bodytext">要是勾起我旧怒，</p>
<p class="bodytext">我要把桎梏打碎。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">你知道那首古歌：</p>
<p class="bodytext">有个死去的男子，</p>
<p class="bodytext">半夜里把他的爱人</p>
<p class="bodytext">拖进他自己的墓里？</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">相信我，你这绝色的、</p>
<p class="bodytext">绝顶可爱的姑娘，</p>
<p class="bodytext">我依然活着，而且</p>
<p class="bodytext">比任何死人更坚强！</p>
<p class="bodytext-right">（钱春绮 译）</p>
