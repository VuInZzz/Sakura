<p class="title1">丁香的香气多么芳馨</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1827</p>
<br>
<div class="content">
<h2 class="chapter-two">丁香的香气多么芳馨</h2>
<p class="bodytext">丁香的香气多么芳馨！</p>
<p class="bodytext">仿佛一群金蜂的星星，</p>
<p class="bodytext">在紫蓝色的天空里面</p>
<p class="bodytext">闪烁得多么战战兢兢！</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">在栗树的黑阴里闪烁着</p>
<p class="bodytext">春光无限的白色别墅，</p>
<p class="bodytext">我听到玻璃门嘎吱作响，</p>
<p class="bodytext">我听到亲切的低声耳语。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">可爱的战栗，甜蜜的颤抖，</p>
<p class="bodytext">羞怯怯的温柔的拥抱——</p>
<p class="bodytext">娇艳的蔷薇侧耳窃听，</p>
<p class="bodytext">夜莺也在不住地啼叫。</p>
<p class="bodytext-right">（钱春绮 译）</p>
