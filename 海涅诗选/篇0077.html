<p class="title1">他们俩倾心相爱</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1823</p>
<br>
<div class="content">
<h2 class="chapter-two">他们俩倾心相爱</h2>
<p class="bodytext">他们俩倾心相爱，</p>
<p class="bodytext">可是不肯相互承认，</p>
<p class="bodytext">一见面就像仇敌，</p>
<p class="bodytext">还说爱情真烦死人。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">他俩终于天各一方，</p>
<p class="bodytext">只偶尔相逢在梦境；</p>
<p class="bodytext">他们早已进入坟墓，</p>
<p class="bodytext">却永远不知道真情。</p>
<p class="bodytext-right">（杨武能 译）</p>
