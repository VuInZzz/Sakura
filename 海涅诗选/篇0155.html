<p class="title1">有个年老的国王</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1830</p>
<br>
<div class="content">
<h2 class="chapter-two">有个年老的国王</h2>
<p class="bodytext">有个年老的国王，</p>
<p class="bodytext">他心情沉郁，他头发灰白；</p>
<p class="bodytext">可怜的年老的国王，</p>
<p class="bodytext">娶了个年轻的后妃。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">有个美貌的侍童，</p>
<p class="bodytext">他头发金黄，他心情欢愉；</p>
<p class="bodytext">他替年轻的王妃</p>
<p class="bodytext">捧着丝绸的裙裾。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">你知道这首古歌？</p>
<p class="bodytext">听起来动人，听起来可哀！</p>
<p class="bodytext">他们只得都死了，</p>
<p class="bodytext">他们彼此太相爱。</p>
<p class="bodytext-right">（钱春绮 译）</p>
