<p class="title1">嘴儿红红的姑娘</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1823</p>
<br>
<div class="content">
<h2 class="chapter-two">嘴儿红红的姑娘</h2>
<p class="bodytext">嘴儿红红的姑娘，</p>
<p class="bodytext">眼儿甜蜜、明亮，</p>
<p class="bodytext">我可爱的人儿啊，</p>
<p class="bodytext">我永远将你怀想。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">在这漫漫的冬夜，</p>
<p class="bodytext">我真愿来到你身旁，</p>
<p class="bodytext">坐在你的小房里，</p>
<p class="bodytext">对你把知心话细讲。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">我要把你洁白的小手，</p>
<p class="bodytext">按在我的唇上，</p>
<p class="bodytext">我要让我的泪水，</p>
<p class="bodytext">滴在你洁白的小手上。</p>
<p class="bodytext-right">（杨武能 译）</p>
