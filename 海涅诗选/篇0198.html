<p class="title1">懊恼</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1851</p>
<br>
<div class="content">
<h2 class="chapter-two">懊恼</h2>
<p class="bodytext">从无限欢乐的海洋</p>
<p class="bodytext">升起这灰色的云翳，</p>
<p class="bodytext">今天我必须受苦，</p>
<p class="bodytext">为了幸福的昨日。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">唉，蜂蜜变成了苦艾！</p>
<p class="bodytext">唉，真痛苦，好难受——</p>
<p class="bodytext">我的心和我的胃，</p>
<p class="bodytext">在酒醉醒来以后！</p>
<p class="bodytext-right">（杨武能 译）</p>
