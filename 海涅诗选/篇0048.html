<p class="title1">一听到那种歌声</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">
<h2 class="chapter-two">一听到那种歌声</h2>
<p class="bodytext">一听到那种歌声，</p>
<p class="bodytext">我恋人唱过的小曲，</p>
<p class="bodytext">我的心儿就破碎，</p>
<p class="bodytext">禁不住剧烈的痛苦。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">一种忧郁的憧憬，</p>
<p class="bodytext">迫使我去山林高处，</p>
<p class="bodytext">我那过大的哀伤</p>
<p class="bodytext">化为点点的泪珠。</p>
<p class="bodytext-right">（钱春绮 译）</p>
