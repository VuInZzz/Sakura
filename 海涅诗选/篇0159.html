<p class="title1">颂歌</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1830</p>
<br>
<div class="content">
<h2 class="chapter-two">颂歌</h2>
<p class="bodytext">我是剑，我是火焰。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">黑暗中我将你们照亮，战斗开始，</p>
<p class="bodytext">我冲杀在前，在斗争第一线。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">在我周围，躺着战友们的尸体，</p>
<p class="bodytext">可是我们已经胜利。我们已经</p>
<p class="bodytext">胜利，可周围躺着——战友们的</p>
<p class="bodytext">尸体。在热烈欢腾的凯歌声中，</p>
<p class="bodytext">回响着哀悼死者的合唱曲。然而，</p>
<p class="bodytext">我们既没有时间欢乐，也没有时间</p>
<p class="bodytext">哀泣。投入新的战斗的号角已经</p>
<p class="bodytext">吹起——</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">我是剑，我是火焰。</p>
<p class="bodytext-right">（杨武能 译）</p>
