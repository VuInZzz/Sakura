<p class="title1">诺言</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1842</p>
<br>
<div class="content">

<h2 class="chapter-two">诺言</h2>

<p class="bodytext">德意志的自由啊，你不必</p>

<p class="bodytext">再赤脚涉过沼泽，</p>

<p class="bodytext">你的脚将穿上长袜，</p>

<p class="bodytext">外面再套一双皮靴！</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">你的头将戴上皮帽，</p>

<p class="bodytext">暖和和的洋洋自得，</p>

<p class="bodytext">它还保护你的耳朵，</p>

<p class="bodytext">再不怕那寒风凛冽。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">你还会有吃的呐——</p>

<p class="bodytext">美好未来转眼就到！</p>

<p class="bodytext">别上威尔斯魔鬼<a id="note131" >

<span class="noteSuper">[131]</span>

</a>

 的当啊，</p>

<p class="bodytext">千万别跟着他们胡闹！</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">你要安分，再安分，</p>

<p class="bodytext">切切不可抛弃礼节，</p>

<p class="bodytext">你要尊重官府啊，</p>

<p class="bodytext">以及咱市长老爷。</p>

<p class="bodytext-right">（杨武能 译）</p>
