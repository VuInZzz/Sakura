<p class="title1">可怜的彼得摇摇晃晃</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1820</p>
<br>
<div class="content">
<h2 class="chapter-two">可怜的彼得摇摇晃晃</h2>
<p class="bodytext">可怜的彼得摇摇晃晃，</p>
<p class="bodytext">慢吞吞，羞怯怯，面如死灰。</p>
<p class="bodytext">路上的行人看到了他，</p>
<p class="bodytext">差不多个个都停下来。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">姑娘们互相窃窃私语：</p>
<p class="bodytext">“他好像刚刚走出坟墓。”</p>
<p class="bodytext">啊，不，可爱的年轻姑娘，</p>
<p class="bodytext">他乃是刚刚走进坟墓。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">他已经失去他的情人，</p>
<p class="bodytext">所以坟墓是最好的卧室，</p>
<p class="bodytext">他可以在那儿高枕无忧，</p>
<p class="bodytext">一直睡到世界的末日。</p>
<p class="bodytext-right">（钱春绮 译）</p>
