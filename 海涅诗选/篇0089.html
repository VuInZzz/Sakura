<p class="title1">一等你做了我的妻子</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1823</p>
<br>
<div class="content">
<h2 class="chapter-two">一等你做了我的妻子</h2>
<p class="bodytext">一等你做了我的妻子，</p>
<p class="bodytext">人人都会把你羡慕，</p>
<p class="bodytext">你将生活得无忧无虑，</p>
<p class="bodytext">享受不尽幸福、欢乐。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">你尽管骂我，尽管撒泼，</p>
<p class="bodytext">我都一概不以为过；</p>
<p class="bodytext">只有一件事使我抛弃你，</p>
<p class="bodytext">就是你不称赞我的诗歌。</p>
<p class="bodytext-right">（杨武能 译）</p>
