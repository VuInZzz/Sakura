<p class="title1">莲花</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1855</p>
<br>
<div class="content">

<span class="noteSuper">[236]</span>



</p>

<p class="bodytext">确实，我们俩配成了</p>

<p class="bodytext">非常奇怪的一对，</p>

<p class="bodytext">女的两只脚不方便，</p>

<p class="bodytext">男的甚至是残废。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">她是个虚弱的猫咪，</p>

<p class="bodytext">他病得像一只癞犬，</p>

<p class="bodytext">我认为，我们的头脑</p>

<p class="bodytext">都并不特别健全。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">女的想象她自己</p>

<p class="bodytext">像一朵莲花一样，</p>

<p class="bodytext">而他，苍白的家伙，</p>

<p class="bodytext">把自己当作月亮。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">莲花在月光之下，</p>

<p class="bodytext">打开了她的花萼，</p>

<p class="bodytext">可是没花粉传授，</p>

<p class="bodytext">只收进一首诗歌。</p>

<p class="bodytext-right">（钱春绮 译）</p>
