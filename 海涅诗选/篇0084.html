<p class="title1">有人祷告圣母马利亚</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1823</p>
<br>
<div class="content">
<h2 class="chapter-two">有人祷告圣母马利亚</h2>
<p class="bodytext">有人祷告圣母马利亚，</p>
<p class="bodytext">有人祷告圣彼得和圣保罗；</p>
<p class="bodytext">可是我只向你祷告，姑娘，</p>
<p class="bodytext">你是我的美丽的太阳！</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">给我亲吻，给我欢乐，</p>
<p class="bodytext">对我仁慈，对我温和，</p>
<p class="bodytext">你姑娘当中最美丽的太阳，</p>
<p class="bodytext">你太阳底下最美丽的姑娘！</p>
<p class="bodytext-right">（杨武能 译）</p>
