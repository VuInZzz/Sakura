<p class="title1">赠康培</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1837</p>
<br>
<div class="content">赠康培<a id="note123" >

<span class="noteSuper">[123]</span>

</a>

</h2>

<p class="bodytext">歌唱的鸟儿，它死掉了，</p>

<p class="bodytext">你不会使它还阳！</p>

<p class="bodytext">你可以把黄金的鹅毛<span class="noteSuper">

<a id="note124" >[124]</a>

</span>

</p>

<p class="bodytext">放心地插在屁股上。</p>

<p class="bodytext-right">（钱春绮 译）</p>
