<p class="title1">我用我极大的痛苦</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">
<h2 class="chapter-two">我用我极大的痛苦</h2>
<p class="bodytext">我用我极大的痛苦</p>
<p class="bodytext">写下了小小的诗章；</p>
<p class="bodytext">张开了铿锵的翅膀，</p>
<p class="bodytext">它们向心上人飞去。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">它们见到了姑娘，</p>
<p class="bodytext">却又飞回来诉苦，</p>
<p class="bodytext">诉苦，又不肯说出，</p>
<p class="bodytext">心眼里掌握的情况。</p>
<p class="bodytext-right">（钱春绮 译）</p>
