<p class="title1">他将被埋在十字路旁</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">

<span class="noteSuper">[18]</span>



 ；</p>

<p class="bodytext">那儿生长着蓝色的花，</p>

<p class="bodytext">可怜的罪人之花<a id="note19" >

<span class="noteSuper">[19]</span>

</a>

 。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">我站在十字路旁叹息，</p>

<p class="bodytext">长夜苦寒而喑哑。</p>

<p class="bodytext">在月光下徐徐微动着</p>

<p class="bodytext">可怜的罪人之花。</p>

<p class="bodytext-right">（钱春绮 译）</p>
