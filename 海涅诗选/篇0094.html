<p class="title1">世界和人生太残缺不全</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1824</p>
<br>
<div class="content">
<h2 class="chapter-two">世界和人生太残缺不全</h2>
<p class="bodytext">世界和人生太残缺不全，</p>
<p class="bodytext">我要请教德国的教授去！</p>
<p class="bodytext">他有的是拼凑人生的本领，</p>
<p class="bodytext">能搞出个明白易懂的体系。</p>
<p class="bodytext">他还会修补宇宙结构的窟窿，</p>
<p class="bodytext">用他的睡帽和破睡衣。</p>
<p class="bodytext-right">（杨武能 译）</p>
