<p class="title1">在记忆之中显露出</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1827</p>
<br>
<div class="content">
<h2 class="chapter-two">在记忆之中显露出</h2>
<p class="bodytext">在记忆之中显露出</p>
<p class="bodytext">久已凋谢的形影——</p>
<p class="bodytext">你对我说了些什么，</p>
<p class="bodytext">如此打动我的心？</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">别说你爱我！我知道，</p>
<p class="bodytext">世间最美的东西，</p>
<p class="bodytext">就是春天和爱情，</p>
<p class="bodytext">将来也必然要消逝。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">别说你爱我！只要</p>
<p class="bodytext">默默地跟我亲嘴，</p>
<p class="bodytext">只要笑，如果明天</p>
<p class="bodytext">给你看枯萎的玫瑰。</p>
<p class="bodytext-right">（钱春绮 译）</p>
