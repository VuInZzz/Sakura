<p class="title1">你不爱我，你不爱我</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">
<h2 class="chapter-two">你不爱我，你不爱我</h2>
<p class="bodytext">你不爱我，你不爱我，</p>
<p class="bodytext">我并不怎样悲伤；</p>
<p class="bodytext">我只要当面看到了你，</p>
<p class="bodytext">就乐得像个国王。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">你恨，甚至对我憎恨，</p>
<p class="bodytext">你的朱唇这样讲；</p>
<p class="bodytext">只要它让我亲一个吻，</p>
<p class="bodytext">我就满足了，姑娘。</p>
<p class="bodytext-right">（钱春绮 译）</p>
