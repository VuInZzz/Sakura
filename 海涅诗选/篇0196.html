<p class="title1">神话</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1851</p>
<br>
<div class="content">

<span class="noteSuper">[187]</span>



 被征服了——</p>

<p class="bodytext">谁能抵抗一头公牛？</p>

<p class="bodytext">我们也原谅达那厄，</p>

<p class="bodytext">她在金雨之下低了头！</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">赛美勒受了迷惑——</p>

<p class="bodytext">她想，一朵白云，</p>

<p class="bodytext">天国中理想的白云，</p>

<p class="bodytext">它不会坑害我们。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">可读到丽达的故事，</p>

<p class="bodytext">我们不禁深感气愤——</p>

<p class="bodytext">你真是一个蠢婆娘，</p>

<p class="bodytext">竟为一只公天鹅丢了魂！</p>

<p class="bodytext-right">（杨武能 译）</p>
