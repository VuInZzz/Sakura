<p class="title1">何处？</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1835</p>
<br>
<div class="content"><p class="bodytext">何处是疲倦的浪游者</p>
<p class="bodytext">最后的安息之地？</p>
<p class="bodytext">是那南国的棕榈树下，</p>
<p class="bodytext">还是莱茵河畔的菩提树底？</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">我将在何处的沙漠中，</p>
<p class="bodytext">由陌生人掩埋尸骨？</p>
<p class="bodytext">还是在荒凉的海岸上，</p>
<p class="bodytext">获得我最后的归宿？</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">随它去吧！无论何处，</p>
<p class="bodytext">主的蓝天永远把我环抱，</p>
<p class="bodytext">那悬挂夜空的万点繁星，</p>
<p class="bodytext">将永远在我坟头闪耀。</p>
<p class="bodytext-right">（杨武能 译）</p>
</div>
