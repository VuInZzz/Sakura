<p class="title1">蝴蝶爱上了玫瑰花</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1830</p>
<br>
<div class="content">
<h2 class="chapter-two">蝴蝶爱上了玫瑰花</h2>
<p class="bodytext">蝴蝶爱上了玫瑰花，</p>
<p class="bodytext">围着它千百遍飞舞，</p>
<p class="bodytext">日光又爱上了蝴蝶，</p>
<p class="bodytext">用金手指将它轻抚。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">可是玫瑰爱上了谁？</p>
<p class="bodytext">这问题我很想弄清。</p>
<p class="bodytext">是在唱歌的夜莺呢？</p>
<p class="bodytext">还是不吭声的金星？<br/>
</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">我不知道玫瑰爱谁，</p>
<p class="bodytext">可我爱着你们大家：</p>
<p class="bodytext">金星、夜莺、日光，</p>
<p class="bodytext">还有蝴蝶和玫瑰花。</p>
<p class="bodytext-right">（杨武能 译）</p>
