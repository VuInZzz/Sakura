<p class="title1">白昼恋着黑夜</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1829</p>
<br>
<div class="content">
<h2 class="chapter-two">白昼恋着黑夜</h2>
<p class="bodytext">白昼恋着黑夜，</p>
<p class="bodytext">春天恋着冬天，</p>
<p class="bodytext">生命恋着死亡——</p>
<p class="bodytext">而你，你爱着我。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">你爱我——头顶上已经</p>
<p class="bodytext">笼罩着可怖的阴影，</p>
<p class="bodytext">你的花朵将全部枯萎，</p>
<p class="bodytext">你的心房将鲜血流尽。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">离开我吧，你只该去爱</p>
<p class="bodytext">那些快活轻佻的蝴蝶，</p>
<p class="bodytext">在阳光中翩跹起舞的蝴蝶——</p>
<p class="bodytext">离开我，离开我就离开了不幸。</p>
<p class="bodytext-right">（杨武能 译）</p>
