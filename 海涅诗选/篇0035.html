<p class="title1">莲花儿战战兢兢</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">

<h2 class="chapter-two">莲花儿战战兢兢</h2>

<p class="bodytext">莲花儿战战兢兢，</p>

<p class="bodytext">害怕壮丽的太阳，</p>

<p class="bodytext">她低头梦寐沉沉，</p>

<p class="bodytext">等待着良夜垂降。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">月亮是她的情郎<a id="note15" >

<span class="noteSuper">[15]</span>

</a>

 ，</p>

<p class="bodytext">照醒了她的幽梦，</p>

<p class="bodytext">她对他亲亲密密</p>

<p class="bodytext">露出温柔的花容。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">她容光焕发地盛开，</p>

<p class="bodytext">向高空默然凝视；</p>

<p class="bodytext">她发出香气而抽泣，</p>

<p class="bodytext">禁不住无限相思。</p>

<p class="bodytext-right">（钱春绮 译）</p>
