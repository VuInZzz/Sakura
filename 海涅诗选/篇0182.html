<p class="title1">等着吧</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1844</p>
<br>
<div class="content">
<h2 class="chapter-two">等着吧</h2>
<p class="bodytext">因为我的闪电是这样出色，</p>
<p class="bodytext">你们就以为，我不能雷鸣！</p>
<p class="bodytext">你们搞错了，因为我同样</p>
<p class="bodytext">有一种打雷的本领。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">一旦那正当的日子来到，</p>
<p class="bodytext">这本领就恐怖地得到证明；</p>
<p class="bodytext">你们将要听到我的声音，</p>
<p class="bodytext">是长空霹雳，风雨雷霆。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">暴风雨将要在那一天</p>
<p class="bodytext">甚至把一些檞树吹倒，</p>
<p class="bodytext">一些教堂的高塔要倒塌，</p>
<p class="bodytext">一些宫殿也将要动摇！</p>
<p class="bodytext-right">（冯至 译）</p>
