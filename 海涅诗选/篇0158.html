<p class="title1">深长的叹息</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1830</p>
<br>
<div class="content">

<span class="noteSuper">[114]</span>



</h2>

<p class="bodytext">新的信仰<a id="note115" >

<span class="noteSuper">[115]</span>

</a>

 多么不快意！</p>

<p class="bodytext">如果他们<a id="note271" >

<span class="noteSuper">[271]</span>

</a>

 夺去了上帝，</p>

<p class="bodytext">从此也就结束诅咒——</p>

<p class="bodytext">绝对没有这种理由<a id="note116" >

<span class="noteSuper">[116]</span>

</a>

 ！</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">我们可以不要祈祷，</p>

<p class="bodytext">可是去把敌人撞倒，</p>

<p class="bodytext">怎么能够不要诅咒——</p>

<p class="bodytext">绝对没有这种理由！</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">不是为了爱，而是为了憎，</p>

<p class="bodytext">应当把上帝留给我们，</p>

<p class="bodytext">因为否则就不能诅咒——</p>

<p class="bodytext">绝对没有这种理由！</p>

<p class="bodytext-right">（钱春绮 译）</p>
