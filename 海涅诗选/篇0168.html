<p class="title1">致赫尔威</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1841</p>
<br>
<div class="content">

<span class="noteSuper">[126]</span>



</h2>

<p class="bodytext">赫尔威，你这只铁云雀，</p>

<p class="bodytext">你发出铿锵的鸣叫，</p>

<p class="bodytext">飞向那神圣的太阳！</p>

<p class="bodytext">难道严冬真已逝去？</p>

<p class="bodytext">德意志真已春花怒放？</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">赫尔威，你这只铁云雀，</p>

<p class="bodytext">你已飞得天一般高，</p>

<p class="bodytext">人世你已经看不见——</p>

<p class="bodytext">要晓得只有在你的诗里，</p>

<p class="bodytext">才存在你歌唱的春天。</p>

<p class="bodytext-right">（杨武能 译）</p>
