<p class="title1">亲爱的朋友，你干什么……</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1823</p>
<br>
<div class="content">
<h2 class="chapter-two">亲爱的朋友，你干什么……</h2>
<p class="bodytext">“亲爱的朋友，你干什么</p>
<p class="bodytext">老是把那旧调重弹？</p>
<p class="bodytext">你想永远温着旧梦，</p>
<p class="bodytext">孵那陈旧的爱情之蛋？</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">“唉！这永远是作茧自缚，</p>
<p class="bodytext">从蛋壳里爬出了雏鸡，</p>
<p class="bodytext">它吱吱喊叫，扑动翅膀，</p>
<p class="bodytext">你又把它关在书里。”</p>
<p class="bodytext-right">（钱春绮 译）</p>
