<p class="title1">我这不幸的阿特拉斯</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1823</p>
<br>
<div class="content">

<span class="noteSuper">[28]</span>



</h2>

<p class="bodytext">我这不幸的阿特拉斯！我必须</p>

<p class="bodytext">背负世界，整个痛苦的世界，</p>

<p class="bodytext">我背负着受不了的重荷，</p>

<p class="bodytext">我的心真要裂碎。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">你高傲的心，是你希望如此！</p>

<p class="bodytext">你想要么就幸福，永久地幸福，</p>

<p class="bodytext">要么就永久地不幸，高傲的心啊，</p>

<p class="bodytext">如今你果然不幸。</p>

<p class="bodytext-right">（钱春绮 译）</p>
