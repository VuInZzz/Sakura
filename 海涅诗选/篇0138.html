<p class="title1">情况紧迫，警钟齐鸣</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1828</p>
<br>
<div class="content">
<h2 class="chapter-two">情况紧迫，警钟齐鸣</h2>
<p class="bodytext">情况紧迫，警钟齐鸣，</p>
<p class="bodytext">唉！我已然头脑昏昏，</p>
<p class="bodytext">春天和一双美目</p>
<p class="bodytext">正合谋对付我的心。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">春天和一双美目</p>
<p class="bodytext">使我的心陷入新的迷惘，</p>
<p class="bodytext">我相信玫瑰和夜莺</p>
<p class="bodytext">也参与了它俩的勾当。</p>
<p class="bodytext-right">（杨武能 译）</p>
