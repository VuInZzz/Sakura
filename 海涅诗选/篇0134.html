<p class="title1">深秋的雾，寒冷的梦</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1827</p>
<br>
<div class="content">
<h2 class="chapter-two">深秋的雾，寒冷的梦</h2>
<p class="bodytext">深秋的雾，寒冷的梦，</p>
<p class="bodytext">披着霜的山和谷，</p>
<p class="bodytext">树被风撕去了叶，</p>
<p class="bodytext">死气沉沉，一片光秃。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">唯有一棵树亭亭静立，</p>
<p class="bodytext">唯有一棵树拥着叶簇，</p>
<p class="bodytext">仿佛为感伤的泪所浇洒，</p>
<p class="bodytext">正轻轻摇着绿色的头颅。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">啊，我的心就像这荒原，</p>
<p class="bodytext">你的倩影，美人儿啊，</p>
<p class="bodytext">就是我的荒芜的心里</p>
<p class="bodytext">唯一一棵碧绿碧绿的树！</p>
<p class="bodytext-right">（杨武能 译）</p>
