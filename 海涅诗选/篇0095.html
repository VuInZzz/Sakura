<p class="title1">我在七月中离开了你</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1824</p>
<br>
<div class="content">
<h2 class="chapter-two">我在七月中离开了你</h2>
<p class="bodytext">我在七月中离开了你，</p>
<p class="bodytext">在一月份又跟你重逢；</p>
<p class="bodytext">那时你处于高温状态，</p>
<p class="bodytext">如今你凉了，甚至很冷。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">我又要离开，等他日重来，</p>
<p class="bodytext">那时你将不冷也不热，</p>
<p class="bodytext">我将在你的墓畔徘徊，</p>
<p class="bodytext">我的心也将困顿而老衰。</p>
<p class="bodytext-right">（钱春绮 译）</p>
