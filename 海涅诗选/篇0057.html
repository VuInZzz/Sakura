<p class="title1">午夜是如此沉寂苦寒</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">
<h2 class="chapter-two">午夜是如此沉寂苦寒</h2>
<p class="bodytext">午夜是如此沉寂苦寒；</p>
<p class="bodytext">我在树林里徘徊长叹。</p>
<p class="bodytext">我把沉睡的树木摇醒；</p>
<p class="bodytext">它们摇摇头深表同情。</p>
<p class="bodytext-right">（钱春绮 译）</p>
