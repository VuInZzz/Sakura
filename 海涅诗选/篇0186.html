<p class="title1">阿斯拉人</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1846</p>
<br>
<div class="content"><p class="bodytext">每当暮色降临，</p>

<p class="bodytext">喷泉激溅起白色水花，</p>

<p class="bodytext">美如天仙的苏丹公主</p>

<p class="bodytext">便会来泉边踱上踱下。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">每当暮色降临，</p>

<p class="bodytext">喷泉激溅起白色水花，</p>

<p class="bodytext">年轻奴隶总伫立泉边，</p>

<p class="bodytext">脸色一天天更苍白可怕。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">一天傍晚，女主人</p>

<p class="bodytext">突然走过来命令他：</p>

<p class="bodytext">告诉我，你叫啥名字，</p>

<p class="bodytext">什么部族，故乡在哪儿！</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">奴隶回答：我名叫</p>

<p class="bodytext">穆罕默德，家在也门，</p>

<p class="bodytext">我的族人一爱就会死，</p>

<p class="bodytext">因为我们正是阿斯拉<a id="note153" >

<span class="noteSuper">[153]</span>

</a>

 。</p>

<p class="bodytext-right">（杨武能 译）</p>
