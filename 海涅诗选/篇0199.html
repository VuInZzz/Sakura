<p class="title1">和睦的家庭</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1851</p>
<br>
<div class="content">
<h2 class="chapter-two">和睦的家庭</h2>
<p class="bodytext">多少女人，多少跳蚤，</p>
<p class="bodytext">多少跳蚤，多少痒痒——</p>
<p class="bodytext">她们暗暗给你罪受，</p>
<p class="bodytext">而且叫你不好嚷嚷。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">须知她们狡狯地笑着，</p>
<p class="bodytext">在夜里对你进行报复——</p>
<p class="bodytext">你想搂住她亲热亲热，</p>
<p class="bodytext">唉，她却转给你背脊骨。</p>
<p class="bodytext-right">（杨武能 译）</p>
