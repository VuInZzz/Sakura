<p class="title1">心，我的心，你不要忧郁</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1823</p>
<br>
<div class="content">
<h2 class="chapter-two">心，我的心，你不要忧郁</h2>
<p class="bodytext">心，我的心，你不要忧郁，</p>
<p class="bodytext">快接受命运的安排，</p>
<p class="bodytext">寒冬从你那儿夺走的一切，</p>
<p class="bodytext">新春将重新给你带来。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">为你留下的如此之多，</p>
<p class="bodytext">世界仍然这般美丽！</p>
<p class="bodytext">一切一切，只要你喜欢，</p>
<p class="bodytext">我的心，你都可以去爱！</p>
<p class="bodytext-right">（杨武能 译）</p>
