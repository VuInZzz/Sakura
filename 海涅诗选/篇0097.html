<p class="title1">我在年轻的时候</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1824</p>
<br>
<div class="content">
<h2 class="chapter-two">我在年轻的时候</h2>
<p class="bodytext">我在年轻的时候，</p>
<p class="bodytext">也有过热烈的爱，</p>
<p class="bodytext">受过爱火的痛灼。</p>
<p class="bodytext">只因为木柴太贵，</p>
<p class="bodytext">爱火终于熄灭，</p>
<p class="bodytext">说实在的，这倒不错！</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">想想吧，美人儿，</p>
<p class="bodytext">快擦干愚蠢的泪，</p>
<p class="bodytext">快忘掉痛苦的爱。</p>
<p class="bodytext">只要你还活着，</p>
<p class="bodytext">就投入我的怀抱，</p>
<p class="bodytext">说实在的，这也不错！</p>
<p class="bodytext-right">（杨武能 译）</p>
