<p class="title1">早晨起身，我就问道</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1817</p>
<br>
<div class="content">早晨起身，我就问道<a id="note5" >

<span class="noteSuper">[5]</span>

</a>

</h2>

<p class="bodytext">早晨起身，我就问道：</p>

<p class="bodytext">今天爱人可来？</p>

<p class="bodytext">晚上我躺卧着叹息：</p>

<p class="bodytext">今天她又没来。</p>

<p class="bodytext"><br/>

</p>

<p class="bodytext">夜里我睁着眼失眠，</p>

<p class="bodytext">抱着无限忧伤：</p>

<p class="bodytext">白天我却似睡非睡，</p>

<p class="bodytext">梦沉沉地彷徨。</p>

<p class="bodytext-right">（钱春绮 译）</p>
