<p class="title1">朋友，别嘲笑魔鬼</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1824</p>
<br>
<div class="content">
<h2 class="chapter-two">朋友，别嘲笑魔鬼</h2>
<p class="bodytext">朋友，别嘲笑魔鬼，</p>
<p class="bodytext">生命的旅程实在短暂，</p>
<p class="bodytext">还有那永劫不复之苦，</p>
<p class="bodytext">也并非愚民的妄念。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">朋友，快偿清债务，</p>
<p class="bodytext">生命的旅程实在漫长，</p>
<p class="bodytext">将来你难免还要借债，</p>
<p class="bodytext">就像过去经常那样。</p>
<p class="bodytext-right">（杨武能 译）</p>
