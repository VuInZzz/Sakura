<p class="title1">他们赠我金玉良言</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1823</p>
<br>
<div class="content">
<h2 class="chapter-two">他们赠我金玉良言</h2>
<p class="bodytext">他们赠我金玉良言，</p>
<p class="bodytext">吹我捧我不遗余力，</p>
<p class="bodytext">说只要我耐心等待，</p>
<p class="bodytext">就给我庇护、奖掖。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">可是等过来又等过去，</p>
<p class="bodytext">我差点儿没给饿死，</p>
<p class="bodytext">多亏得有位好心人，</p>
<p class="bodytext">给了我关照、提携。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">好心人啊，他给我饭吃，</p>
<p class="bodytext">我永世不会把他忘记！</p>
<p class="bodytext">只可惜我不能吻吻他，</p>
<p class="bodytext">因为此人就是我自己。</p>
<p class="bodytext-right">（杨武能 译）</p>
