<p class="title1">我们乘在黑暗的邮车里</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1824</p>
<br>
<div class="content">
<h2 class="chapter-two">我们乘在黑暗的邮车里</h2>
<p class="bodytext">我们乘在黑暗的</p>
<p class="bodytext">邮车里坐了个通宵；</p>
<p class="bodytext">我们互相偎依着，</p>
<p class="bodytext">一路上有说有笑。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">可是，到天色发亮，</p>
<p class="bodytext">我们是多么惊愕！</p>
<p class="bodytext">因为插进了小爱神，</p>
<p class="bodytext">这个揩油的乘客。</p>
<p class="bodytext-right">（钱春绮 译）</p>
