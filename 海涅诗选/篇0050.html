<p class="title1">他们使我苦恼</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">
<h2 class="chapter-two">他们使我苦恼</h2>
<p class="bodytext">他们使我苦恼，</p>
<p class="bodytext">气得我发青发白，</p>
<p class="bodytext">一些人用他们的恨，</p>
<p class="bodytext">一些人用他们的爱。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">给我的面包掺上毒药，</p>
<p class="bodytext">给我的酒杯注入毒鸩，</p>
<p class="bodytext">一些人用他们的爱，</p>
<p class="bodytext">一些人用他们的恨。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">可是她，她最使我</p>
<p class="bodytext">苦恼、气愤和悲哀，</p>
<p class="bodytext">她从来对我没有恨，</p>
<p class="bodytext">也从来对我没有爱。</p>
<p class="bodytext-right">（冯至 译）</p>
