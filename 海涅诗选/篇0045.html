<p class="title1">自从恋人弃我远离</p>
<p class="date">乘着歌声的翅膀：海涅诗选 · 1822</p>
<br>
<div class="content">
<h2 class="chapter-two">自从恋人弃我远离</h2>
<p class="bodytext">自从恋人弃我远离，</p>
<p class="bodytext">我已把欢笑完全忘记。</p>
<p class="bodytext">许多人向我卖弄诙谐，</p>
<p class="bodytext">可是我也笑不出来。</p>
<p class="bodytext"><br/>
</p>
<p class="bodytext">自从我失去了她，</p>
<p class="bodytext">我也把哭泣完全丢下；</p>
<p class="bodytext">哪怕痛苦得使我心碎，</p>
<p class="bodytext">可是我也哭不出来。</p>
<p class="bodytext-right">（钱春绮 译）</p>
