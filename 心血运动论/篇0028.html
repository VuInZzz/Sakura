<h1 class="title" id="calibre_pb_0">第十七章　通过心脏结构的特点以及通过解剖中所发现的现象证明血液的运行和循环</h1>
<p class="normaltextx">在所有的动物中，我发现心脏并非都是明确可分的……每一个具有肺的动物，都有两个心室，只要有右心室，都会有左心室，但反之却不尽然。胚胎中还不存在两个心室的差别。部位不同，动脉与静脉的差别不同，心脏中还有大量的柱状物。</p>
