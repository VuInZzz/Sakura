<p class="normaltext"><br class="calibre2"/></p>
<p class="normaltext">科学元典是科学史和人类文明史上划时代的丰碑，是人类文化的优秀遗产，是历经时间考验的不朽之作。它们不仅是伟大的科学创造的结晶，而且是科学精神、科学思想和科学方法的载体，具有永恒的意义和价值。</p>
