<p class="date">心血运动论</p>

<div class="content">
<h1 class="title" id="calibre_pb_0">第四章　活体动物中观察到的心脏和心房运动</h1>
<p class="normaltextx">有两种运动是相互联系着的，一种是心房的运动，另外一种是心室的运动。这两种运动绝不会同时发生，先是心房的运动，接着是心脏本身的运动，运动显然是始于心房然后扩展到心室。</p>
