<p class="date">心血运动论</p>

<div class="content">
<h1 class="title" id="calibre_pb_0">第十四章　从循环得出的结论</h1>
<p class="normaltextx">从血液循环得出的结论：动物体中的血液被驱动着以循环的方式不停地运行，而这就是心脏通过搏动表现出来的作用或功能，这也是心脏运动和收缩的唯一目的。</p>
