<h1 class="title" id="calibre_pb_0">第十三章　证实第三个论点，并且由此证明血液循环</h1>
<p class="normaltextx">静脉瓣这样排列的效果显然是阻止了所有来自心脏或大静脉的血液运行，无论是向上流向头，还是向下流向足，或者是流向双臂，一滴血也无法通过。通过静脉瓣，阻止了血液从大的静脉流向小的静脉的所有运行……</p>
