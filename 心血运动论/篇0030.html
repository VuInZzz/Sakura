<p class="normaltext"><br class="calibre2"/></p>
<p class="normaltextx">哈维的贡献是划时代的，他的工作标志着新的生命科学的开始，属于发端于16世纪科学革命的一个重要组成部分。哈维也因为他对心血系统的出色研究，使得他成为与哥白尼、伽俐略、牛顿等人齐名的科学革命的巨匠。</p>
