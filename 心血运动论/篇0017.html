<p class="title1">第七章　血液从右心室通过肺进入肺静脉和左心室</p>
<p class="date">心血运动论</p>
<br>
<div class="content">
<h1 class="title" id="calibre_pb_0">第七章　血液从右心室通过肺进入肺静脉和左心室</h1>
<p class="normaltextx">右心室的搏动促使来自大静脉的血液通过肺脏进入左心室的空腔。因此，在这一点上，可以说右心室是为肺而造的，为了使运输的血液通过肺部，而不是为了营养作用。</p>
