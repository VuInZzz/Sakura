<p class="title1">第十二章　通过证实第二个论点而表明血液循环的存在</p>
<p class="date">心血运动论</p>
<br>
<div class="content">
<h1 class="title" id="calibre_pb_0">第十二章　通过证实第二个论点而表明血液循环的存在</h1>
<p class="normaltextx">我们必须承认，第一，血液随着搏动而流出来，而且这是受结扎处下方的力的作用的；血液在力的作用下流出，这种力来自心脏的搏动和力量，血液的力量仅仅源于心脏。第二，血液的流动始于心脏，而且通过大静脉流到心脏。</p>
