<p class="title1">海因里希·海涅</p>
<p class="date">简体文字版 · OCR 整理</p>
<br>
<blockquote><font color="#000066">犹太裔德国诗人、思想家，德国浪漫主义向现实主义过渡的代表人物（1797—1856）。生于杜塞尔多夫，早年求学于波恩、柏林，后长期流亡巴黎。早期以《诗歌集》《哈尔茨山游记》成名，后期写下政治长诗《西里西亚的纺织工人》《德国，一个冬天的童话》，以辛辣的讽刺批判封建专制与资产阶级的妥协。他与马克思交往密切，诗作被谱成歌曲广为传唱，是德国最优秀的抒情诗人之一。以下为本站收录的中文著作。</font></blockquote>
